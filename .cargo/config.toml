[build]
target = "riscv64imac-unknown-none-elf"

# The target-feature line is the default riscv64 baseline level
# (Kconfig RISCV64_LEVEL_RV64IMAC) for a plain `cargo build`; the Kconfig is
# the source (tools/build/kconfig_to_cargo.py --rustflags), and
# crates/core/limits/build.rs refuses a kernel build whose target features
# disagree with its Kconfig (e.g. a `require`d Zbb missing from these flags).
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tarch/riscv64/boot/linker.ld",
    "-C", "code-model=medium",
    "-C", "target-feature=+zaamo,+zalrsc",
]

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
# The profile of validation builds only (`make check-compile`, `make check0
# COMPILE_ONLY=1`, tools/gate/validate_env.sh): release's code with the default
# 16 codegen units and incremental builds, no debug info. Never the profile of the
# size budget, the unsafe budget, vsbench or any measurement row: those stay
# on `release` (Cargo.toml), whose codegen-units = 1 pins the code.
[profile.validate]
inherits = "release"
codegen-units = 16
incremental = true
debug = false
