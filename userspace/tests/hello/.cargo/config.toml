# aarch64-only build directory: hello.elf (RISC-V) is built by the Makefile
# straight through $(RISCV_AS)/$(RISCV_LD) on hello.S and never invokes
# cargo here, so this file affects nothing about the RISC-V build.
[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-Tuser_aarch64.ld",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "code-model=small",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

# x86_64 — built with an explicit `--target`, like aarch64 above. The target
# is soft-float (no SSE/x87 state in these images) and defaults to a static
# PIE in the kernel code model; see `user_x86_64.ld`'s header for the flags.
[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-Tuser_x86_64.ld",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "link-arg=-znorelro",
    "-C", "relocation-model=static",
    "-C", "code-model=small",
]
