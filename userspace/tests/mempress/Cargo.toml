[package]
name = "mempress"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Ring-3 memory pressure driver: fills past RAM under a frame budget, so the kernel's reclaim task compresses and swaps real pages, then verifies them, round-trips a purgeable object and runs into the limit."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/tests/uhello/Cargo.toml).
[workspace]

# The topology starts it on an image with reclaim that names it (Kconfig
# USERSPACE_MEMPRESS, the reclaim overlay); no preset does.
[package.metadata.azos]
images = ["MEMPRESS.ELF"]
start = "MM_RECLAIM_COMPRESS"
