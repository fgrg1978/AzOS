[package]
name = "ipctest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Ring-3 IPC probe: exercises the fast-path IPC round trip, the server-impersonation gate, and the shm/port/io_ring ownership gates that no user-space program had ever executed."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
# RFC-0040 gap 3: phases B and E construct the raw `CapHandle` their
# fork-inherited endpoint capability lands at (deterministically slot 0,
# generation 1 — see `phase_b_client`) with the real bit-packing function
# rather than a hand-copied shift, since the module doc for `CapHandle`
# states the field widths are free to move.
azos_abi = { path = "../../../crates/core/abi" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above. The root
# manifest already excludes it, but that exclusion is relative to the root, so
# it does not hold when the checkout is nested inside another workspace (a git
# worktree under .claude/worktrees). Same belt-and-braces shape as
# tests/host/cam-ring-tests.
[workspace]
