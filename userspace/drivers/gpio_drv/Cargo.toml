[package]
name = "gpio_drv"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Ring-3 GPIO device host: serves the device's runtime power (DevicePower) on its endpoint. Excluded from workspace; built standalone like reflex/uhello."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
# The wakelock quota of the runtime PM ledger (Kconfig DEVICE_WAKELOCKS).
azos_limits = { path = "../../../crates/core/limits" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above. The root
# manifest already excludes it, but that exclusion is relative to the root, so
# it does not hold when the checkout is nested inside another workspace (a git
# worktree nested inside another checkout). Same belt-and-braces shape as
# tests/host/cam-ring-tests.
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
