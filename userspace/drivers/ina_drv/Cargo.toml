[package]
name = "ina_drv"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Ring-3 host of crates/drivers/ina219 (the INA219 power monitor). Polls the chip through Cap<I2c> and serves the PowerMon interface on endpoint.powermon. Excluded from workspace; built standalone like buzz_drv."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_devif = { path = "../../../crates/core/devif" }
azos_ina219 = { path = "../../../crates/drivers/ina219" }
azos_limits = { path = "../../../crates/core/limits" }

[features]
# Gate canary: the accept thread turns without blocking (ring3_drv_smoke's
# idle entry bound must fail). Built with `make INA_DRV_FEATURES=accept-spin-canary`.
accept-spin-canary = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Standalone, as gpio_drv: see its Cargo.toml.
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
depends = "BOARD_IO"
