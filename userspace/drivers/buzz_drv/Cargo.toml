[package]
name = "buzz_drv"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Ring-3 host of crates/drivers/buzzer (the piezo buzzer). Serves the Buzzer interface on endpoint.buzzer and plays tones on one PWM channel through Cap<Pwm>. Excluded from workspace; built standalone like gpio_drv."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_devif = { path = "../../../crates/core/devif" }
azos_buzzer = { path = "../../../crates/drivers/buzzer" }
# The PC speaker as the channel (x86_64, ports its row grants).
azos_pcspk = { path = "../../../crates/drivers/pcspk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Standalone, as gpio_drv: see its Cargo.toml.
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
