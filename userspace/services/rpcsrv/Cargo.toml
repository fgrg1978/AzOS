[package]
name = "rpcsrv"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS RPC server: transparent RPC between nodes (Phase 9, step 1). Serves the proxy endpoints (endpoint.rpc-<service>) of services on other nodes and lends the endpoints its signed row exports to the peer classes of the topology, over one UDP datagram per frame, with per-peer expiring warrants. Ring 3, no authority beyond its row. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_limits = { path = "../../../crates/core/limits" }
azos_rpc = { path = "../../lib/rpc" }
azos_inspect_lib = { path = "../../lib/inspect" }
# The interface it carries today: Decisions (every op is idempotent).
azos_decisions = { path = "../../lib/decisions" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
