[package]
name = "zenohd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS Zenoh gateway (ring 3): a client of one Zenoh router over TCP that serves the Decisions ops under the Kconfig key (ZENOH_DECISIONS_KEY). A Zenoh peer asks for an op as a query; the gateway turns it into one warrant-guarded IDL op the kernel admits or refuses, and answers with the decision record that is the receipt. The kernel's decision records are published as topics. Never the warrant transport between nodes (that is rpcsrv). Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_limits = { path = "../../../crates/core/limits" }
azos_zenoh = { path = "../../lib/zenoh" }
azos_decision = { path = "../../../crates/core/decision" }
azos_decisions = { path = "../../lib/decisions" }
azos_ualloc = { path = "../../lib/ualloc" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs"). The
# built-in topology has a row for it, and the kernel starts it at boot, only
# when Kconfig ZENOH_GW is on.
[package.metadata.azos]
default = "ZENOH_GW"
start = "ZENOH_GW"
