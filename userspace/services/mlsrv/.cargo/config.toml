# Mirrors userspace/drivers/gpio_drv: build a ring-3 ELF for the kernel's exec path.
[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "code-model=medium",
    "-C", "target-feature=+zaamo,+zalrsc",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

# aarch64 parity (phase 6 prep) — built with an explicit `--target`, so
# `[build] target` above (still riscv64) stays the default for every
# existing invocation. `-zmax-page-size=4096`: see `user_aarch64.ld`'s
# header comment for why the RISC-V script's `ALIGN(4096)` alone is not
# enough on this ISA.
[target.aarch64-unknown-none]
# Rust's bundled LLD, as `tests/qemu/aarch64-smoke` already relies on: the macOS
# system `cc` is not always present in PATH and is not a cross-linker anyway.
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-Tuser_aarch64.ld",
    "-C", "link-arg=-zmax-page-size=4096",
    # rust-lld synthesizes `.eh_frame_hdr` by default on this target even
    # with `.eh_frame` discarded (the RISC-V linker does not). Suppressed so
    # the two ISAs' ELFs have the same section shape — no unwind machinery
    # in either, `panic = "abort"`.
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "code-model=small",
]
