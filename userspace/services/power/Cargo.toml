[package]
name = "power"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS power policy server and tool: applies a power profile through the kernel's Power interface (the power endpoint its topology row grants; the kernel keeps the limits), plus suspend, reboot, shutdown and the scheduler rate. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_devif = { path = "../../../crates/core/devif" }
azos_power = { path = "../../lib/power" }
azos_limits = { path = "../../../crates/core/limits" }

[features]
# Host canaries (tests/host/power-tests), never in a real build: each removes
# one decision. pw-fallback: a refusal is never answered. pw-stop: a call that
# failed outright does not stop the run. pw-nomodel: a machine with no energy
# model is asked anyway.
pw-fallback-canary = []
pw-stop-canary = []
pw-nomodel-canary = []
# Likewise for the budget: pw-budget, a refused cap or parking is not answered;
# pw-degrade, the hysteresis is not applied (a level is left the moment the charge
# is above its threshold);
# pw-monitor, the battery monitor's device is suspended at a degrade level too.
pw-budget-canary = []
pw-degrade-canary = []
pw-monitor-canary = []
# pw-levels, every degrade level asks the same 50 % of the power whatever the
# topology's rows and the kernel's reserve say.
pw-levels-canary = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
