[package]
name = "power"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS power tool (RFC-0055 S5): suspend, reboot, shutdown and the scheduler rate through SYS_POWER_TYPED under the Cap<Power> its topology row grants. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
