[package]
name = "decisd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS decision server: serves the Decisions object (the kernel's stored refusals, denials and admissions, with their provenance) over the endpoint.decisions endpoint, from the binary records of the kernel's introspection tree (the admin region, granted against the task view). Ring 3, no authority beyond serving that endpoint and reading that region. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_inspect_lib = { path = "../../lib/inspect" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_decisions = { path = "../../lib/decisions" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
# The topology starts it exactly when the kernel keeps decisions to serve
# (`set_last_task_start` of its row in crates/core/topology/src/builder.rs).
start = "DECISION_REFUSALS_DURABLE || DECISION_RECORDS_DEV"
