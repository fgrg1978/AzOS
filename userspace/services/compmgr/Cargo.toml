[package]
name = "compmgr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS component manager: the first ring-3 component. Reads the signed topology's rows from the kernel's introspection tree (topology/components), starts them with SYS_SPAWN_EX in dependency order, supervises them (one_for_one / rest_for_one, restart intensity, the IDL failure contracts) and records every start, restart and give-up. Ring 3. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_devif = { path = "../../../crates/core/devif" }
azos_limits = { path = "../../../crates/core/limits" }
azos_names = { path = "../../lib/names" }
azos_term = { path = "../../lib/term" }
azos_login = { path = "../../lib/login" }
azos_decisions = { path = "../../lib/decisions" }
azos_compositor = { path = "../../lib/compositor" }
azos_packages = { path = "../../lib/packages" }
azos_inspect_lib = { path = "../../lib/inspect" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs"). The
# built-in topology has a row for it, and the kernel starts it at boot, on
# every preset.
[package.metadata.azos]
default = "y"
start = "y"
