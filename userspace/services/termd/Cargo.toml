[package]
name = "termd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS terminal server: owns the console's input, runs the line discipline (cooked editing, echo, history, Ctrl-C as a typed event) and serves the Terminal object to one client, the shell, over the endpoint.term endpoint. Ring 3. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_idl = { path = "../../../crates/core/idl" }
azos_term = { path = "../../lib/term" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
