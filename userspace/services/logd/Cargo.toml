[package]
name = "logd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS kernel log sink (Kconfig KLOG): maps the structured log's ring (MemObj klog.ring, read-only), polls it, and appends the records to a ring of KLOGn.TXT files under the tree its row grants, rotating and keeping the number of files Kconfig LOGD_* name. Holds no endpoint and no other authority. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_limits = { path = "../../../crates/core/limits" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
topology = true
# The topology starts it exactly when the kernel keeps the structured log
# (`set_last_task_start` of its row in crates/core/topology/src/builder.rs).
start = "KLOG"
