[package]
name = "famtools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS privileged-family tools (RFC-0055 S5, wave 12): FLIGHT.ELF, BEHAVIOR.ELF, CONFIG.ELF and OTA.ELF, one binary each, each through its family's typed syscall under the capability its own topology row grants. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }

[[bin]]
name = "flight"
path = "src/bin/flight.rs"

[[bin]]
name = "behavior"
path = "src/bin/behavior.rs"

[[bin]]
name = "config"
path = "src/bin/config.rs"

[[bin]]
name = "ota"
path = "src/bin/ota.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]
