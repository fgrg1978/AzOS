[package]
name = "companion_client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
# The Infer interface the engine calls (ml.rs) and the Kconfig numbers it uses.
azos_devif = { path = "../../../crates/core/devif" }
azos_limits = { path = "../../../crates/core/limits" }
# companion_client runs the same Noise handshake and transport as the kernel's own
# companion link (`azos_crypto::secure_channel`). `azos_crypto` is
# already `#[no_std]`, `default-features = false` on its two dalek deps, and
# already builds for this exact bare-metal target as a kernel dependency —
# adding it here pulls in no new target requirement.
azos_crypto = { path = "../../../crates/core/crypto" }

# Host-suite canaries of ml.rs (tests/host/behavior-tests): known values that
# break the inference policy on purpose, never enabled by a build.
[features]
infer-refusal-canary = []
infer-model-canary = []
ml-timeout-canary = []
ml-grant-canary = []
ml-unaskable-canary = []
range-stale-canary = []
l1-start-canary = []
l1-raise-canary = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above. The root
# manifest already excludes it, but that exclusion is relative to the root, so
# it does not hold when the checkout is nested inside another workspace (a git
# worktree nested inside another checkout). Same belt-and-braces shape as
# tests/host/cam-ring-tests.
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
images = ["COMPCLI.ELF"]
# The robot extension's client of the companion: the topology has its row, and the
# volume its image, whenever USE_ROBOT is on and nowhere else (a gate
# configuration that asks for every program turns it on too).
default = "USE_ROBOT"
