[package]
name = "audiod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS audio server (ring 3): serves the Sound interface on endpoint.audio, mixes the periods its clients hand it (saturating sum, per-stream gain, the device's rate and format) into the one playback stream it holds on the kernel's sound.0, and lends the capture stream only through the kernel's microphone gate. Runs on a deadline reservation. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_devif = { path = "../../../crates/core/devif" }
azos_rings = { path = "../../../crates/core/rings" }
azos_limits = { path = "../../../crates/core/limits" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs"). The
# built-in topology has a row for it, and the kernel starts it at boot, only
# when Kconfig AUDIOD is on.
[package.metadata.azos]
default = "AUDIOD"
start = "AUDIOD"
