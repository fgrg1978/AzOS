[package]
name = "logind"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS login service: serves the Login object (endpoint.login) to the terminal server, asks the kernel's keys interface to verify the credential the secure-attention prompt made, and starts the user's shell as a session of that user (SPAWN_F_USER). Ring 3; its row holds the login op of keys and the right to start the shell, and nothing else. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_inspect_lib = { path = "../../lib/inspect" }
azos_idl = { path = "../../../crates/core/idl" }
azos_abi = { path = "../../../crates/core/abi" }
azos_login = { path = "../../lib/login" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs"). The
# built-in topology has a row for it, and the kernel starts it at boot, only
# when Kconfig CONSOLE_LOGIN is on.
[package.metadata.azos]
default = "CONSOLE_LOGIN"
start = "CONSOLE_LOGIN"
