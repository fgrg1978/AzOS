[package]
name = "pkg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The AzOS pkg tool: asks the package installer (Packages on endpoint.packages) to admit, install, list or remove signed application packages, handing it the package as a memory object. Its topology row's call capability is its whole authority. Excluded from workspace; built standalone."

[dependencies]
azos_abi = { path = "../../../crates/core/abi" }
azos_libsys = { path = "../../../crates/core/libsys" }
azos_idl = { path = "../../../crates/core/idl" }
azos_packages = { path = "../../lib/packages" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
# On every class but a small board (`PKGD_ROW`, crates/core/topology/src/builder.rs).
default = "!HWCLASS_EMBEDDED"
