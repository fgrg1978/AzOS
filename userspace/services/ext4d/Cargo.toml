[package]
name = "ext4d"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The ring-3 ext4 server: reads one partition through its block capability with the read-only parser (userspace/lib/ext4) and serves the file protocol (Node and Dir, azos_devif::fs) on endpoint.ext4, which the kernel's VFS mounts (azos_fs::endpoint::EndpointFs). The parser reads an untrusted image, so it runs here and not in the kernel. Excluded from workspace; built standalone."

[dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_abi = { path = "../../../crates/core/abi" }
azos_idl = { path = "../../../crates/core/idl" }
azos_devif = { path = "../../../crates/core/devif" }
azos_ext4 = { path = "../../lib/ext4" }
azos_srv = { path = "../../lib/srv", features = ["libsys"] }
azos_limits = { path = "../../../crates/core/limits" }

[features]
# Host canary only (tests/host/ext4-tests pulls service.rs): every read answers
# half of what was asked and never says the file ended, which the client's
# check refuses as a short read.
short-read-canary = []
# Host canaries too: the badge is the slot plus one again, and a slot whose
# revoke failed is reused (`badge-slot-canary`); a completion of an earlier
# entry is taken for a stray (`stale-completion-canary`).
badge-slot-canary = []
stale-completion-canary = []
# Host canary only: every listed entry is resolved by path, a directory scan each.
seen-resolve-canary = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# The FAT32 image(s) this crate builds and their board-volume defaults
# (tools/build/gen_userspace_kconfig.py -> make config, "Userspace programs").
[package.metadata.azos]
# On wherever the kernel mounts an ext4 volume through it (Kconfig
# `FS_EXT4_RING3`, the EXT4D.ELF row of crates/core/topology/src/builder.rs),
# and started there.
default = "FS_EXT4_RING3"
start = "FS_EXT4_RING3"
