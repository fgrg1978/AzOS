[package]
name = "azos_ualloc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The hardened allocator of native ring-3 programs (plan phase 5, item 6): size-class blocks, randomized chunk placement from the kernel entropy pool, checksummed chunk headers, a quarantine of freed chunks and guard pages. no_std; the engine is generic over a small `Sys` trait so the host tests (tests/host/ualloc-tests) run it over a model of mmap/munmap; the AzOS side (`UserAlloc`, a `GlobalAlloc`) is built only for the ring-3 targets. Standalone, not a member of the root workspace."

[dependencies]
# What a crate inside the std build graph (azos_stdrt, tools/sdk_std.py) names
# core by; unused everywhere else.
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[features]
rustc-dep-of-std = ["core"]

# Not inside a `std` build (`--cfg azos_std`, tools/sdk_cargo.py): there
# `azos_stdrt` drives the engine itself.
[target.'cfg(all(target_os = "azos", not(azos_std)))'.dependencies]
azos_libsys = { path = "../../../crates/core/libsys" }
azos_limits = { path = "../../../crates/core/limits" }

# Standalone, like the userspace images (see Cargo.toml's exclude list).
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("azos"))', 'cfg(azos_std)'] }
