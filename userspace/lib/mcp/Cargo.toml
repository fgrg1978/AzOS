[package]
name = "azos_mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Minimal JSON for the Model Context Protocol: a strict JSON value (parser and writer), the JSON-RPC 2.0 message codec (request, response, notification, error, batch) and the MCP shapes of initialize, ping, tools/list and tools/call. no_std with alloc, no transport or clock of its own; tested on the host (tests/host/mcp-tests). Standalone, not a member of the root workspace."

