[package]
name = "azos_zenoh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Our own codec of the Zenoh 1.x wire protocol (the version zenoh-pico speaks): VLE integers, the transport messages INIT/OPEN/CLOSE/KEEP_ALIVE/FRAME/FRAGMENT, the network messages DECLARE/PUSH/REQUEST/RESPONSE/RESPONSE_FINAL/INTEREST, and key-expression validity, intersection and inclusion (* and **). no_std with alloc, no link, clock or session of its own; tested on the host (tests/host/zenoh-tests). Standalone, not a member of the root workspace."

# Pure codec: no dependency, no downloaded code (owner 16-10).

# Standalone, like the userspace images (see Cargo.toml's exclude list).
[workspace]
