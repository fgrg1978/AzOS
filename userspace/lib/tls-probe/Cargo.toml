[package]
name = "tls-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Vendoring probe: links rustls (the rustls-rustcrypto provider, no aws-lc-rs, no ring) and quinn-proto (no crypto feature) into a std program for *-unknown-azos on the three ISAs, so a toolchain, std port or vendor bump that breaks either shows up in `make sdk`; the same code runs a loopback TLS handshake under `vendor.py test` on the host. Excluded from workspace; built standalone through tools/build/sdk_cargo.py --vendored."

[lib]
name = "tls_probe"
path = "src/lib.rs"

[[bin]]
name = "tls-probe"
path = "src/main.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
# rand_core 0.6 (the provider's OsRng) draws through getrandom 0.2, which has no backend for target_os = "azos";
# its `custom` hook is how the std port's random source (the kernel pool) reaches it.
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
# rand 0.10 (quinn-proto) draws through getrandom 0.4: the `custom` backend, which tools/build/sdk_cargo.py --vendored selects.
getrandom04 = { package = "getrandom", version = "0.4", default-features = false }
quinn-proto = { version = "0.11", default-features = false }

# rustls-rustcrypto 0.0.2-alpha pulls rustls-webpki 0.102 (RustSec); the local copy takes the
# algorithm identifiers from rustls-pki-types instead (third_party/patches/rustls-rustcrypto).
[patch.crates-io]
rustls-rustcrypto = { path = "../../../third_party/patches/rustls-rustcrypto" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "symbols"

# Prevents Cargo from merging this crate into the workspace above (see
# userspace/services/reflex/Cargo.toml).
[workspace]

# `azos` is not a target_os rustc knows; the program's entropy hooks are built only for it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("azos"))'] }
