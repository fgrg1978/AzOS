[package]
name = "azos_term"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The Terminal object: the typed interface (L13 IDL) between a terminal server (userspace/services/termd) and its one client (the shell), and the codec of its events. no_std; tested on the host (tests/host/term-tests). Standalone, not a member of the root workspace."

[dependencies]
azos_idl = { path = "../../../crates/core/idl" }

# Standalone, like the userspace images (see Cargo.toml's exclude list).
[workspace]
