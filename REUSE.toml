version = 1
SPDX-PackageName = "AzOS"
SPDX-PackageSupplier = "Fernando Rodriguez"

# Every file in the repository, unless the file carries its own SPDX header
# ("closest" lets an in-file header win). Covers documentation, configuration,
# generated files, images and keys, which do not take a header.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Fernando Rodriguez"
SPDX-License-Identifier = "Apache-2.0 OR GPL-2.0-only"

# The Linux driver layer. Our own code there (lx/emul: Rust, no
# Linux header) is dual-licensed like the rest of the project (owner decision,
# round 47) and falls under the catch-all above. Only the glue that includes
# Linux headers, lx/glue/, is GPL-2.0-only, including files there without an
# in-file header. Listed after the catch-all so it wins for these paths.
# third_party/linux is a submodule: Linux's own SPDX headers and COPYING
# govern it.
[[annotations]]
path = "lx/glue/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Fernando Rodriguez"
SPDX-License-Identifier = "GPL-2.0-only"

# relibc: the patch that ports Redox's libc (MIT) to the native ABI carries
# lines of the MIT tree it patches, so it is MIT, with relibc's copyright. The
# overlay beside it (userspace/lib/relibc-azos/overlay) is our own code and
# falls under the catch-all above. The relibc tree itself is not stored in
# this repository (a gitlink, tools/third_party_fetch.sh).
[[annotations]]
path = "userspace/lib/relibc-azos/patches/**"
precedence = "closest"
SPDX-FileCopyrightText = "2018 Redox OS"
SPDX-License-Identifier = "MIT"

# The Raspberry Pi 3 B device tree QEMU raspi3b boots in the gate and the host
# tests read: Linux's arch/arm/boot/dts/broadcom/bcm2837-rpi-3-b.dts and the
# .dtsi files it includes (as U-Boot 2025.07's dts/upstream carries them),
# compiled with dtc and dumped by QEMU after it patched `/memory`. Those
# sources are GPL-2.0-only, and so is the blob.
[[annotations]]
path = "tests/host/dtb-tests/fixtures/qemu-raspi3b.dtb"
precedence = "override"
SPDX-FileCopyrightText = "The Linux kernel device-tree authors (bcm283x/bcm2837 .dts/.dtsi)"
SPDX-License-Identifier = "GPL-2.0-only"

# A trimmed Raspberry Pi 5 device tree written from recollection of Linux's
# arch/arm64/boot/dts/broadcom/bcm2712.dtsi and bcm2712-rpi-5-b.dts, and its
# dtc output. Derived from GPL-2.0-only sources, so it is GPL-2.0-only too.
[[annotations]]
path = ["tests/host/dtb-tests/fixtures/rpi5-bcm2712.dts", "tests/host/dtb-tests/fixtures/rpi5-bcm2712.dtb"]
precedence = "override"
SPDX-FileCopyrightText = "The Linux kernel device-tree authors (bcm2712 .dts/.dtsi)"
SPDX-License-Identifier = "GPL-2.0-only"
