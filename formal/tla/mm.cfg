SPECIFICATION Spec

CONSTANTS
    NumFrames = 3
    NumHarts  = 2
    NumOps    = 4
    Mutant    = "none"

INVARIANT TypeOK
INVARIANT PteIsCache
INVARIANT TlbWritableImpliesSole
INVARIANT RefIsHolders
INVARIANT NoFreeWhileNamed
INVARIANT NoInstallAfterRelease
INVARIANT ZeroOnFirstUse
INVARIANT MapperIsReverse
INVARIANT ChargeAtReserve
INVARIANT FrameAccounted
INVARIANT DestroyLeavesNothing
INVARIANT LockedNeverReclaimed
INVARIANT TlbNamesSlotOrPending
INVARIANT LockOrder
INVARIANT SupplyUnlocked
INVARIANT ShootdownAfterRelease
INVARIANT FaultNeverTakesMm

\* The model ends when NumOps is spent and nothing else is enabled; TLC's
\* deadlock check would flag that, so it is off.
CHECK_DEADLOCK FALSE
