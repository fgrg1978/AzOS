[package]
name = "azos_sim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host dry boot of a topology: replays the kernel's boot admission and prints the records a real boot would write. Excluded from workspace."

# Run with `make sim SIM_DEFCONFIG=<defconfig> SIM_TOPOLOGY=<builtin|dir>
# SIM_CPUS=<n>`: the topology is a function of the .config (limits, row
# budgets) and of the kernel's features (canary and smoke rows), so the build
# takes the same KCONFIG_CONFIG and the azos_topology features those kernel
# features turn on, as `make topology-files` does for the emitter.

[lib]
path = "src/lib.rs"

[[bin]]
name = "azos_sim"
path = "src/main.rs"

[features]
# A test build embeds `tools/keys/test_pub.bin` (crates/core/topology/build.rs);
# without a key the topology crate does not build. The dry boot verifies no
# signature: it replays admission of a topology's content.
default = ["dev-key"]
dev-key = ["azos_topology/dev-key"]
# Gate canary: the dry boot counts one CPU more than it was given, so its
# records diverge from the boot's and the row "topology: dry boot matches the
# boot" must turn red. Never in a real build.
sim-cpu-canary = []

[dependencies]
azos_topology = { path = "../../crates/core/topology" }
azos_decision = { path = "../../crates/core/decision" }
azos_limits = { path = "../../crates/core/limits" }
# The image filter table (`crates/core/sched/src/seccomp.rs`, pulled in by
# `#[path]` as tests/host/seccomp-tests does) and what it is built from.
azos_abi = { path = "../../crates/core/abi" }
azos_devif = { path = "../../crates/core/devif" }
azos_crypto = { path = "../../crates/core/crypto" }
azos_linux_abi = { path = "../../crates/core/linux-abi" }
azos_linux_rt = { path = "../../userspace/lib/linux_rt" }

# The kernel's release profile: a dry boot that does not is replaying a
# different program.
[profile.release]
overflow-checks = true

# Own workspace root: not a member of the kernel workspace.
[workspace]
