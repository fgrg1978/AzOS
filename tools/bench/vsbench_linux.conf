#
# tools/bench/vsbench_linux.conf — the Linux kernel each vsbench script boots for
# its Linux column. A host setting, not a kernel option: it builds nothing into
# AzOS (it was the Kconfig strings VSBENCH_LINUX_IMAGE_<ISA> until 2026-10-22).
# One `<isa>=<path>` line per ISA; a leading `~/` is $HOME. The environment
# variable of each script overrides its line: VSBENCH_LINUX_IMAGE
# (tools/bench/vsbench_compare.sh, riscv64), VSBENCH_AARCH64_LINUX_IMAGE
# (tools/bench/vsbench_aarch64.sh), VSBENCH_X86_64_LINUX_IMAGE (tools/bench/vsbench_x86_64.sh).
# No script downloads or builds one. An absent riscv64 image fails
# vsbench_compare.sh (unless CI_SKIP_VSBENCH_LINUX=1); an absent aarch64 or
# x86_64 image skips that column and says so.
#
# Every default is Linux 6.12 LTS (EEVDF), built from the ISA's defconfig with
# virtio-mmio/pci, virtio-blk/net/rng, the serial console, vfat, devtmpfs,
# initramfs and TCP/IP built in, PREEMPT_NONE, HZ=250 (vsbench boots with no
# modules, so another image needs the same drivers built in).
#
# riscv64: the defconfig with its debug options off (DEBUG_PAGEALLOC,
#   DEBUG_VM*, spinlock/mutex/list/atomic-sleep checks), production-like as the
#   arm64 and x86_64 defconfigs already are; the plain-defconfig Image-riscv64
#   sits beside it. The previous reference, 6.4.0-rc4 (CFS), is
#   ~/devel/vms/riscv/Image.
# aarch64: an arm64 `Image` (raw or gzip) on the AzOS line's `-M
#   virt,gic-version=3` and CPU (`max,pauth=on`). The previous reference,
#   Ubuntu 20.04's 5.4.0-125-generic (CFS), needs
#   VSBENCH_AARCH64_LINUX_CPU=max,pauth=on,lpa2=off (it predates FEAT_LPA2).
# x86_64: a bzImage, x86_64_defconfig + kvm_guest.config, on the AzOS line's
#   `qemu-system-x86_64 -M microvm`.
riscv64=~/devel/vms/linux-6.12/Image-riscv64-nodebug
aarch64=~/devel/vms/linux-6.12/Image-aarch64
x86_64=~/devel/vms/linux-6.12/bzImage-x86_64
