#
# tools/bench/vsbench_linux.conf — the Linux kernel each vsbench script boots for
# its Linux column. A host setting, not a kernel option: it builds nothing into
# AzOS (it was the Kconfig strings VSBENCH_LINUX_IMAGE_<ISA>).
# One `<isa>=<path>` line per ISA; a leading `~/` is $HOME and `@OUT@/` is $AZOS_OUT. The environment
# variable of each script overrides its line: VSBENCH_LINUX_IMAGE
# (tools/bench/vsbench_compare.sh, riscv64), VSBENCH_AARCH64_LINUX_IMAGE
# (tools/bench/vsbench_aarch64.sh), VSBENCH_X86_64_LINUX_IMAGE (tools/bench/vsbench_x86_64.sh).
# The images are built from the pinned Linux tree (third_party/linux, .gitmodules) by
# `make fetch` (tools/build/lx_kbuild/run.sh vsbench, in the lx-kbuild container; the
# options are in tools/bench/vsbench_linux_in.sh, each checked in the result), so the
# Linux column's kernel is the pin's release. No script downloads one at run time. An
# absent riscv64 image fails vsbench_compare.sh (unless CI_SKIP_VSBENCH_LINUX=1); an
# absent aarch64 or x86_64 image skips that column and says so.
#
# The defconfig of the ISA with virtio-mmio/pci, virtio-blk/net/rng, the serial console,
# vfat, devtmpfs, initramfs and TCP/IP built in, PREEMPT_NONE, HZ=250 (vsbench boots with
# no modules, so another image needs the same drivers built in). riscv64 also has its
# debug options off (DEBUG_PAGEALLOC, DEBUG_VM*, spinlock/mutex/list/atomic-sleep checks),
# production-like as the arm64 and x86_64 defconfigs already are; x86_64 is
# x86_64_defconfig + kvm_guest.config on the AzOS line's `qemu-system-x86_64 -M microvm`;
# aarch64 runs on the AzOS line's `-M virt,gic-version=3` and CPU (`max,pauth=on`).
# The initramfs is packed by each script at run time from the benchmark program.
riscv64=@OUT@/build/vsbench-linux/Image-riscv64
aarch64=@OUT@/build/vsbench-linux/Image-aarch64
x86_64=@OUT@/build/vsbench-linux/bzImage-x86_64
