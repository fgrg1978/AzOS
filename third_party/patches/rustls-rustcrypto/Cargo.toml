# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Local copy of rustls-rustcrypto 0.0.2-alpha (crates.io, MIT OR Apache-2.0), patched
# in tree. Upstream depends on rustls-webpki 0.102 (RUSTSEC: fixed in >= 0.103.12)
# only for the signature AlgorithmIdentifier constants, which rustls-pki-types
# (>= 1.12) exports as pki_types::alg_id. The copy takes them from there and drops
# the webpki dependency; src/verify/{rsa,ecdsa,eddsa}.rs differ from upstream by that
# one `use` line each. Activated by [patch.crates-io] in every manifest that is a
# workspace root and builds the provider (a [patch] in a dependency is ignored).

[package]
edition = "2021"
rust-version = "1.75"
name = "rustls-rustcrypto"
version = "0.0.2-alpha"
authors = ["RustCrypto Developers"]
description = """
Pure Rust cryptography provider for the Rustls TLS library using algorithm implementations from the
RustCrypto organization
"""
readme = "README.md"
keywords = [
    "rustls",
    "tls",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/rustls-rustcrypto"
resolver = "1"

[dependencies.aead]
version = "0.5.2"
default-features = false

[dependencies.aes-gcm]
version = "0.10.3"
features = [
    "aes",
    "alloc",
]
default-features = false

[dependencies.chacha20poly1305]
version = "0.10.1"
default-features = false

[dependencies.crypto-common]
version = "0.1.6"
default-features = false

[dependencies.der]
version = "0.7.9"
default-features = false

[dependencies.digest]
version = "0.10.7"
default-features = false

[dependencies.ecdsa]
version = "0.16.8"
features = ["alloc"]
default-features = false

[dependencies.ed25519-dalek]
version = "2"
features = ["pkcs8"]
default-features = false

[dependencies.hmac]
version = "0.12.1"
default-features = false

[dependencies.p256]
version = "0.13.2"
features = [
    "pem",
    "ecdsa",
    "ecdh",
]
default-features = false

[dependencies.p384]
version = "0.13.0"
features = [
    "pem",
    "ecdsa",
    "ecdh",
]
default-features = false

[dependencies.paste]
version = "1.0.14"
default-features = false

[dependencies.pkcs8]
version = "0.10.2"
features = [
    "pem",
    "pkcs5",
]
default-features = false

[dependencies.pki-types]
version = "1.12"
default-features = false
package = "rustls-pki-types"

[dependencies.rand_core]
version = "0.6.4"
features = ["getrandom"]
default-features = false

[dependencies.rsa]
version = "0.9.2"
features = ["sha2"]
default-features = false

[dependencies.rustls]
version = "0.23.0"
default-features = false

[dependencies.sec1]
version = "0.7.3"
features = [
    "pkcs8",
    "pem",
]
default-features = false

[dependencies.sha2]
version = "0.10.7"
default-features = false

[dependencies.signature]
version = "2.1.0"
default-features = false

[dependencies.x25519-dalek]
version = "2"
default-features = false

[features]
alloc = [
    "pki-types/alloc",
    "aead/alloc",
    "ed25519-dalek/alloc",
]
default = [
    "std",
    "tls12",
    "zeroize",
]
logging = ["rustls/logging"]
std = [
    "alloc",
    "pki-types/std",
    "rustls/std",
    "ed25519-dalek/std",
]
tls12 = ["rustls/tls12"]
zeroize = [
    "ed25519-dalek/zeroize",
    "x25519-dalek/zeroize",
]
