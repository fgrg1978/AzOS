[package]
edition = "2024"
rust-version = "1.93"
name = "kibi"
version = "0.3.3"
authors = ["Ilaï Deutel"]
build = false
include = [
    "src/",
    "tests/",
    "Cargo.toml",
    "Cargo.lock",
    "COPYRIGHT",
    "LICENSE-*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A text editor in less than 1024 lines of code with syntax highlighting, search and more."
readme = "README.md"
keywords = [
    "editor",
    "terminal",
    "text-editor",
]
categories = [
    "text-editors",
    "development-tools",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ilai-deutel/kibi"

[badges.maintenance]
status = "actively-developed"

[lib]
name = "kibi"
path = "src/lib.rs"

[[bin]]
name = "kibi"
path = "src/main.rs"

[dependencies.unicode-width]
version = "0.2.2"

[target."cfg(unix)".dependencies.libc]
version = "0.2.180"

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = ["wincon"]
default-features = false

[target."cfg(windows)".dependencies.winapi-util]
version = "0.1.11"

