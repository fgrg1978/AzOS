# `irq-route-canary`: every ring-3 line is routed to the boot hart (the old
# rule), so the `riscv64 ring-3 irq` row sees the line taken on hart 0 while
# its owner is pinned to hart 3.
irq-secondary-seie-canary = ["qemu"]
irq-route-canary = ["qemu", "azos_syscall/irq-route-canary"]
# Wave 10 IRQ5 probe, riscv64: the external-interrupt handler re-runs
# `irqchip::init` on this hart right after it masks a ring-3 line. Passes
# while `plic::init` rewrites the global priorities only once; a re-init that
# rewrote them would unmask the line and fail captest's mask check.
irq-reinit-probe = ["qemu"]
# Temporary: prints how long an ARP resolution actually took, to set the
# budget from data instead of by argument.
arp-timing = ["qemu", "azos_net/arp-timing"]
# Gate row and canary (wave 15): see crates/net/net/Cargo.toml.
loopback-preempt-probe = ["qemu", "azos_net/loopback-preempt-probe"]
loopback-guard-canary = ["qemu", "azos_net/loopback-guard-canary"]
ipc-trace = ["azos_syscall/ipc-trace"]
# The vsbench SQPOLL lane: the autorun row may start an io_ring SQ poller.
# Never part of a board or default build; see crates/core/topology/Cargo.toml.
sqpoll-bench = ["azos_topology/sqpoll-bench"]
ipc-census = ["azos_syscall/ipc-census", "azos_sched/ipc-census"]
# Gate canary for the page-table free check: see crates/core/sched/Cargo.toml.
exit-satp-canary = ["azos_sched/exit-satp-canary"]
# Minimal boot for the comparative benchmark (vsbench). Never in production.
bench-minimal = ["azos_sched/bench-minimal"]
# Gate canary (wave 13): the vDSO hwcap word loses the bits lxbase.ko picks
# its CRC path by (aarch64 CRC32, riscv64 Zbc), so the module must report
# its table fallback.
hwcap-clear-canary = []
# Board images: the seccomp image table is the board volume's own (named-key ML
# service), `build/board/image_hashes.rs`. Passed by `make vf2`/`k1`/`build-fleet`,
# never by a QEMU or bare-`cargo` build. See crates/core/sched/Cargo.toml.
board-image = ["azos_sched/board-image"]
# Translation granule (config/Kconfig.arch AARCH64_PAGE_*; aarch64 only, and
# tools/kconfig_to_cargo.py emits the token). Neither = 4 KiB. The kernel
# asserts at compile time that the granule these select equals
# azos_limits::PAGE_SHIFT from `.config`, so the two cannot disagree;
# kernel/build.rs derives the linker-script page alignment from them.
page-16k = ["azos_arch_api/page-16k", "azos_sched/page-16k"]
page-64k = ["azos_arch_api/page-64k", "azos_sched/page-64k"]
# config/Kconfig.timing's `SCHED_BACKEND_APS` choice, emitted by
# `tools/kconfig_to_cargo.py`. Compiles the Adaptive Partitioning backend
# (policies, per-CPU runqueue state, the typed registry) into the kernel.
# Default OFF = Legacy priority queue, and the APS code is not linked at all:
# with `lto = false` nothing else strips it, and it cost 8.1 KB of `.text`
# plus 41,536 bytes of `.data` in every Legacy build (measured: -41,576 and
# -9,328 respectively). This feature REQUIRES the matching guards in
# `kernel/src/main.rs` — the boot-path arms that call `aps_state::smoke_test`,
# `use_aps_dispatch` and `runtime::registry` must carry the same
# `#[cfg(feature = "sched-aps")]`, or a default build does not compile.
sched-aps = ["azos_sched/sched-aps"]
# RFC-0051 E0-E2 (Kconfig ENERGY, default off): per-task and per-CPU
# utilisation tracking in the scheduler, and the energy model read at boot
# from the topology, else the DTB (`kernel/src/boot/energy.rs`). The seams
# themselves are compiled in every build, with today's behaviour.
energy = ["azos_sched/energy", "azos_topology/energy"]
# The RFC-0051 E0-E2 gate row (`kernel/src/smokes/energy_smoke.rs`): the
# built-in topology carries a fake two-domain model; checks model, refuse,
# util, and prints the hooks' cost. `-smp 2`.
energy-smoke = ["qemu", "energy", "azos_topology/energy-fake-model"]
# Its canaries, one property broken each; the named check must print FAIL.
energy-util-canary = ["energy-smoke", "azos_sched/energy-util-canary"]
energy-validate-canary = ["energy-smoke", "azos_energy/validate-canary"]
energy-switchout-canary = ["energy-smoke", "azos_sched/energy-switchout-canary"]
# Boot ignores the topology's model (resolves from DTB/none only): `model` FAIL.
energy-model-canary = ["energy-smoke"]
# RFC-0051 E3/E4 gate row: the smoke on the `balanced` fake model, adding the
# `gov` (I1, I6, schedutil) and `idle` (TEO choice, I3) checks.
energy-gov-smoke = ["energy-smoke", "azos_topology/energy-fake-balanced"]
# Its canaries: the deadline floor ignores reservations (`gov` must FAIL); the
# idle choice ignores the RT slack (`idle` must FAIL); the kernel's RT-slack
# input reads "none" (`idle` must FAIL).
# Gate row "idle keepalive (simulated WDT)": the watchdog timeout is recorded
# as armed under QEMU, so hart 0's idle keepalive runs at the derived period.
wdt-sim = ["azos_drv_sys/wdt-sim"]
energy-i1-canary = ["energy-gov-smoke", "azos_energy/i1-canary"]
energy-i3-canary = ["energy-gov-smoke", "azos_energy/i3-canary"]
energy-slack-canary = ["energy-gov-smoke", "azos_sched/energy-slack-canary"]
# U02-3 measurement: prints `[SCHED] tick instr=N` at boot under
# `-icount shift=0,sleep=off`. See `azos_sched`'s own feature doc.
sched-tick-probe = ["azos_sched/sched-tick-probe"]
# U02-3: O(NUM_PRIORITIES) placement, timer-sleeper heap,
# fast-IPC hand-off co-location. All three are in `default` above; see
# crates/core/sched/Cargo.toml.
sched-o1-placement = ["azos_sched/sched-o1-placement"]
sched-timer-heap = ["azos_sched/sched-timer-heap"]
sched-ipc-affinity = ["azos_sched/sched-ipc-affinity"]
# Event-driven K-C25 reaper (visits only slots stamped mid-switch). OFF by
# default; see crates/core/sched/Cargo.toml.
sched-reap-event = ["azos_sched/sched-reap-event"]
# VF2-only DC8200 + Innosilicon HDMI TX framebuffer driver
# (crates/drivers/display). Opt-in, not part of the `vf2` feature bundle: fixed
# resolution (HDMI_WIDTH/HDMI_HEIGHT in config/Kconfig.platform), no EDID
# negotiation, solid-color milestone only — never validated against real
# hardware (QEMU has no model for this peripheral at all).
hdmi = ["azos_display", "azos_display/vf2"]
# QEMU-only ramfb framebuffer test (crates/drivers/display/src/ramfb.rs) — a
# generic "can this kernel drive a framebuffer" check, unrelated to the
# real VF2 DC8200/HDMI TX driver (`hdmi` above), which QEMU can't
# simulate at all. Opt-in, not bundled into `qemu` — needs `-device
# ramfb -display <backend>` on the QEMU command line too (not
# `-nographic`, which every other QEMU boot this session has used).
ramfb = ["azos_display", "azos_display/qemu"]
# Wave 11 (LAT): masked-window tracer, Kconfig `LAT_TRACE` (config/Kconfig.development,
# mapped by tools/kconfig_to_cargo.py). Records per hart the longest
# interrupts-masked and preemption-disabled windows and their call sites,
# read out at `/proc/latency`. Off: no hook, no table, no procfs entry.
lat-trace = ["azos_arch/lat-trace", "azos_sync/lat-trace", "azos_mm/lat-trace"]
# Wave 15 (TRACE) gate canaries. `trace-producer-canary`: the tracer's
# producer never advances its index, so a reader sees one record per ring
# (`trace: tracectl reads live` must fail). `trace-cap-canary`: TRACECTL.ELF's
# row holds no `Cap<Trace>`, so every control call is refused and recorded.
trace-producer-canary = ["azos_trace/producer-canary"]
trace-cap-canary = ["azos_topology/trace-cap-canary"]
# Wave 15 diagnostic: `[TRACE-COST]`, the tracepoint's masked, recording and
# full-ring cost measured at boot (kernel/src/smokes/trace_cost.rs). Never shipped.
trace-cost-probe = []
# Wave 15 gate canary: the static-key patcher writes through the executable
# text mapping; the boot must die on a store fault at that address
# (`trace: static-key W^X canary`).
trace-wx-canary = ["azos_ipc/text-poke-wx-canary"]
# vsbench diagnostic: `[SPAWN-CENSUS]` per-phase spawn cost (crates/core/syscall/src/spawn.rs).
spawn-census = ["azos_syscall/spawn-census"]
# Wave 15: `azos_sched::swcensus`, the switch path phase by phase.
switch-census = ["azos_sched/switch-census"]
# Kconfig KTEST (wave 15): the in-kernel test registry's runner
# (kernel/src/ktest.rs) and every `ktest!` test. Off: none of it is compiled.
ktest = ["dep:azos_ktest"]
# Kconfig CHAOS (config/Kconfig.development): the fault-injection registry
# and its sites (crates/core/chaos). Cargo unifies the crate's `on` feature,
# so every crate that asks a point sees it on. Never with secure-boot-enforced.
chaos = ["azos_chaos/on"]
# Kconfig DECISION_RECORDS: explainable decision records and /proc/decisions
# (crates/core/decision).
decisions = ["azos_decision/on"]
# Gate canaries for two ktest tests (wave 15): the boot skips `enforce_wx`
# (the image keeps its boot-time RWX leaves) or `strip_exec_outside_image`
# (RAM outside the image stays executable). `mm_wx_image` /
# `mm_nx_outside_image` must report `not ok`.
wx-skip-canary = []
nx-skip-canary = []
# (`stack-guard-skip-canary` and `procfs-skip-canary` are runtime canaries
# now: `canary=stack-guard-skip,procfs-skip` on the command line, Kconfig
# CANARY_RUNTIME, kernel/src/canary_rt.rs.)
# riscv64: the boot ignores the DTB's Zicboz (scalar fallback):
# `mm_zicboz_zero_fill` must report `not ok`.
zicboz-skip-canary = []
# vsbench diagnostic (wave 15, SLAB): `[KHEAP-*]` kernel heap census
# (crates/core/mm/src/kheap_census.rs, crates/core/syscall/src/kheap_census.rs).
kheap-census = ["azos_syscall/kheap-census"]
# Gate canary only (wave 15, SLAB): a slab hands out a freed object without
# unlinking it. The `kheap slab` self-test rows must go red.
slab-freelist-canary = ["azos_mm/slab-freelist-canary"]
# Wave 15 (DAIF): `irq_order_probe` (kernel/src/smokes/irq_order_probe.rs), a
# function the gate's `irq order` rows disassemble; and its canary, which
# gives the interrupt-mask asm `nomem` back.
irq-order-probe = []
irq-nomem-canary = ["irq-order-probe", "azos_arch/irq-nomem-canary"]
# Debug output (owner: console output only in debug modes): a successful
# spawn's `[SPAWN] tid=...` and `[SPAWN][PRIO]` lines and every exec's
# `[VDSO] mapped` line. Refusals, floors, aborts and fallbacks print anyway.
spawn-log = ["azos_syscall/spawn-log", "azos_sched/spawn-log"]
# Wave 14 vsbench diagnostic: per-phase cost of a backend file open/read/close
# (crates/fs/fs/src/census.rs). Never in a shipped build.
file-census = ["azos_fs/file-census"]
# The worst-case wake-up latency rows (cyclictest/timerlat shape): a priority-1
# kernel task wakes on an absolute 1 ms period while kernel tasks spam the
# console and read the disk, and reports max/p99 against a per-ISA bound.
# Booted under `-icount`. See kernel/src/lat_smoke.rs. Without `lat-trace`, so
# the number is the kernel's and not the tracer's; add `lat-trace` for sites.
lat-smoke = ["qemu"]
# Its canary: a task on the same hart masks interrupts for 20 ms three times.
# The tracer must name that site and the latency row must print `[LAT] FAIL`.
lat-canary = ["lat-smoke", "lat-trace"]
# Wave 15 (VF): the lat smoke's disk load writes through FAT32 (a whole-file
# rewrite per kick: chain allocation, free, journal barriers) instead of
# reading raw sectors. The `lat: ... FAT writes` rows.
# Wave 15 (FM): it also counts FAT device I/O issued under a held PiMutex
# (`pi_io=` in `[LAT] load`; owner rule F1 wants 0).
lat-fat = ["lat-smoke", "azos_fs/fat-pi-io-probe"]
# Its canary: a `SpinLock` held across each FAT update (crates/fs/fs/src/fat32.rs).
fat-mutate-spin-canary = ["lat-fat", "lat-trace", "azos_fs/fat-mutate-spin-canary"]
# F1 canary: a `PiMutex` held across each FAT update; `pi_io=` goes non-zero.
fat-mutate-pi-canary = ["lat-fat", "azos_fs/fat-mutate-pi-canary"]
# Wave 11 (PSTORE): gate rows `pstore: ...`. After /fat mounts, a boot that
# found no RAM panic record panics with the VFS lock held and reboots warm;
# the next boot must recover the record into /fat/CRASH.LOG. See
# kernel/src/pstore.rs.
pstore-smoke = ["qemu", "azos_fs/pstore-smoke"]
# Its canary: the panic path flips one payload byte after the checksum, so the
# next boot must reject the record and say so.
pstore-corrupt-smoke = ["pstore-smoke"]
# Wave 11 ONESHOT canary: the timer arming before the one-shot change (no
# reprogram when a task blocks on a timer deadline; aarch64's tick handler
# programs `now + period` only). The `lat:` row must print `[LAT] FAIL`.
oneshot-canary = ["lat-smoke", "azos_sched/oneshot-canary"]
# Wave 11 (A64CLK): the aarch64 kernel runs on the VIRTUAL counter/timer
# (CNTVCT_EL0, CNTV_*, PPI 27), the clock ring 3's vDSO reads. Two canaries:
# `a64clk-ppi-canary` programs CNTV but enables PPI 30 (the physical timer's
# line), so no tick arrives; `a64clk-cntvoff-canary` leaves CNTVOFF_EL2 nonzero
# at the EL2 drop (boot with `-M virt,virtualization=on`), so a kernel that
# read the physical counter would stamp 2 ms (2_000_000 ticks) off the vDSO.
a64clk-ppi-canary = ["qemu"]
a64clk-cntvoff-canary = ["qemu", "azos_arch/cntvoff-canary"]
# Wave 11 (PORTWAIT) canary: a port's timer source is accepted and never
# armed; ipctest's phase P must then fail its timer check (gate rows
# `portwait: ring-3 multi-source wait`, riscv64 and aarch64).
portwait-timer-canary = ["qemu", "azos_syscall/portwait-timer-canary"]
# Wave 11 PIFAST (RFC-0052 row R4): a priority-13 kernel client calls a
# priority-24 kernel server through fast IPC (582) while a priority-18 hog
# computes in 2 ms bursts on the same hart, and reports the call latency
# against a 100 us bound. See kernel/src/smokes/pifast_smoke.rs.
pifast-smoke = ["qemu"]
# Its canary: the call never donates (`azos_syscall/pifast-donation-canary`),
# so the row must print `[PIFAST] FAIL`.
pifast-donation-canary = ["pifast-smoke", "azos_syscall/pifast-donation-canary"]
# Wave 11 SCHED-RT rows (`sched-rt:` in tools/ci_check.sh): the RT band budget,
# EDF + CBS and run-time admission measured on hart 0 under `-icount`, see
# kernel/src/rt_smoke.rs. The topology gains the two profiled rows the EDF
# check attaches to.
sched-rt-smoke = ["qemu", "domain-robot", "azos_topology/sched-rt-smoke"]
# Its canaries, one property broken each; the named check must print FAIL.
rt-band-canary = ["sched-rt-smoke", "azos_sched/rt-band-canary"]
rt-edf-canary = ["sched-rt-smoke", "azos_sched/rt-edf-canary"]
rt-cbs-canary = ["sched-rt-smoke", "azos_sched/rt-cbs-canary"]
rt-admit-canary = ["sched-rt-smoke", "azos_sched/rt-admit-canary"]
rt-exempt-canary = ["sched-rt-smoke", "azos_sched/rt-exempt-canary"]
# Wave 15 (`sched-rt-util:` rows): admitted reservations near the admission
# bound (70 % and 93 % per hart, one and two harts), an overrunner, and two
# reservations at different levels; see kernel/src/rt_util_smoke.rs.
sched-rt-util = ["qemu"]
# Its canary: no CBS budget charging, so the overrunner makes the others miss.
rt-util-cbs-canary = ["sched-rt-util", "azos_sched/rt-cbs-canary"]
# Its wake-rule canary: the CBS wake test uses q/t again, so the `suspend`
# phase's self-suspending server makes its neighbour miss.
rt-util-wake-canary = ["sched-rt-util", "azos_sched/rt-wake-rate-canary"]
# Its admission canary: every well-formed reservation is admitted, so the
# `mixed` phase's low-level reservation is admitted and misses.
rt-util-admit-canary = ["sched-rt-util", "azos_sched/rt-admit-canary"]
# RT7 (RFC-0052 §5.5, row R6): an observer on hart 1 arms the flight
# controller and a culprit kernel task on hart 0 (the control hart) panics.
# Under Kconfig PANIC_POLICY_CONTAIN the panic must be contained and the
# control loops keep their period; otherwise it takes the reset path. See
# kernel/src/smokes/rt_panic_smoke.rs.
rt-panic-canary = ["qemu", "domain-robot"]
# The same panic with a SpinLock held: must take the reset path under either
# policy (the containment predicate's depth check).
rt-panic-canary-spin = ["rt-panic-canary"]
# The panic in rt-motor itself, a registered safety task, holding no lock: the
# reset path under either policy (`reason=safety-task` under Contain), with the
# global panic latch set — the observer checks that a motor command and the
# ESC are refused after it (wave 13).
rt-panic-canary-safety = ["rt-panic-canary", "azos_safety_core?/rt-panic-canary-safety"]
# The motor-command watchdog record row (`tools/ci_check.sh`,
# `rt_watchdog_record_row`): a 5 s report window instead of 60 s, so a short
# boot closes one. Never in a default build.
rtwd-window-smoke = ["qemu", "domain-robot", "azos_safety_core?/rtwd-window-smoke"]
# Its canary: the watchdog's transitions print but are not recorded. The row
# must go red on it.
rtwd-record-canary = ["domain-robot", "azos_safety_core?/rtwd-record-canary"]
# A panic in the buzzer's kernel host (placement kernel), contained under
# Kconfig PANIC_POLICY_CONTAIN, and the supervisor's restart of the host
# (`SupOrigin::KernelHost`): kernel/src/smokes/drv_contain_smoke.rs (wave 13).
drv-contain-smoke = ["qemu", "buzzer-kernel"]
# Timer sleepers on every hart raced by early TID wakes (the interleavings
# that lost rt-motor's wake with the heap, gate 185); a stuck sleeper or a
# census `lost` count fails it: kernel/src/smokes/timer_heap_smoke.rs (wave 13).
timer-heap-smoke = ["qemu"]
# A tick deferred by a SpinLock is paid at the guard drop and counted as a
# preemption, not a voluntary switch: kernel/src/smokes/preempt_account_smoke.rs.
preempt-account-smoke = ["qemu"]
# Periodic-wake tail latency (mean/p99/p99.9/max over 10k wakes) against
# ping-pong pairs on the same hart, waker in the RT band with a CBS
# reservation and then best-effort: kernel/src/smokes/tail_smoke.rs. Linux
# counterpart: tools/lat_linux/tail.c.
tail-smoke = ["qemu"]
# Gate row only: the vDSO write window held open (crates/core/mm vdso.rs);
# abitest must still finish (no ring-3 reader may spin on an odd seq).
vdso-write-window = ["qemu", "azos_mm/vdso-write-window"]

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
# Single source for the DRV_KIND_* constants. The kernel already hand-declared
# DRV_KIND_GPIO inside gpio_user_driver_smoke_task; the capability seeding needs
# the same value, and a second local copy is how the syscall-number problem this
# tree already has got started.
azos_driver_server = { workspace = true }
azos_common = { workspace = true }
azos_arch = { workspace = true }
azos_arch_api = { workspace = true }
azos_sync = { workspace = true }
azos_percpu = { workspace = true }
azos_drv_base      = { workspace = true }
azos_drv_irqchip   = { workspace = true }
azos_drv_sys       = { workspace = true }
azos_drv_gpio      = { workspace = true }
azos_drv_bus       = { workspace = true }
azos_drv_virtio    = { workspace = true }
azos_drv_block     = { workspace = true }
azos_drv_net       = { workspace = true }
azos_drv_sensor    = { workspace = true }
azos_drv_actuator  = { workspace = true }
azos_drv_npu       = { workspace = true, optional = true }
azos_drv_power     = { workspace = true }
azos_drv_dmac      = { workspace = true }
azos_robot_drivers = { workspace = true, optional = true }
azos_drv_api       = { workspace = true }
azos_abi = { workspace = true }
azos_mm = { workspace = true }
azos_sched = { workspace = true }
# RFC-0051: the idle tasks go through `seams::IDLE_GOVERNOR`; with `energy`,
