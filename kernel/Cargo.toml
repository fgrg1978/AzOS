# DEV03 — USB MSC gadget. Pure no_std protocol crate; kernel side
# wiring lives in kernel/src/msc_gadget.rs.
azos_msc       = { workspace = true }
azos_pubsub    = { workspace = true }
azos_trace     = { workspace = true }
azos_ktest     = { workspace = true, optional = true }
azos_chaos     = { workspace = true }
azos_decision  = { workspace = true }
# Wave 15: the trace ring layout (the cost probe reads its own ring).
azos_spsc      = { workspace = true }
azos_topology  = { workspace = true }
azos_limits    = { workspace = true }
# RFC-0047: the Linux personality's numbers (the aarch64 trap snapshots a
# Linux `clone` like a native fork).
azos_linux_abi = { workspace = true }
# RFC-0040 gap 0: the safety path (domains/robot/safety-core). The kernel creates its
