[package]
name = "azos_kernel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

# Pass --features vf2 to target StarFive VisionFive 2 (JH7110).
# Pass --features k1  to target SpacemiT K1 (BananaPi BPI-F3, RV64GCVB + RVV1.0).
# Pass --features rvv to enable RISC-V Vector Extension benchmarks (QEMU only).
# vf2 and rvv are mutually exclusive (VF2 has no V extension).
# k1 includes rvv because the K1 has native RVV 1.0 (VLEN=256).
[features]
# Owner decision 2026-09-27 (after gate 184): the wave-4 scheduler changes
# are on by default once a gate is green with them. `sched-timer-heap` joined
# the list in wave 8 (owner decision round 9). It had been left out after gate
# 185 lost rt-motor's wake with it on: a retry re-armed a popped sleeper with
# a deadline read outside the heap lock, overwriting the deadline the sleeper
# had armed itself, and the next nearest-deadline query dropped the entry.
# The fix (the retry re-arm in `timer_heap::wake_due`, `TimerHeap::peek_live`)
# is in `crates/core/sched/src/timer_heap.rs`. `--no-default-features` brings back the
# pre-wave-4 placement, load-balanced IPC wakes and the per-tick sleeper sweep.
#
# Taken back out after gate 193 (2026-09-28), the heap's own gate, was not
# green: the red row was a yield-count wait in abitest, but an A/B of that row
# left one heap-on boot hung in a fast-IPC reply wait that nothing explains
# yet. The rule is a green gate with it on; it returns with its own gate.
#
# Back in (wave 13, RT7). Its own rows, `sched: timer heap raced` (rv, arm;
# kernel/src/smokes/timer_heap_smoke.rs, heap + ipc-census), fail 4/4 with
# the wave-5 bug put back and passed 20/20 per ISA twice (1-7 ms sleepers;
# then with 20-100 us sleepers added), census lost=0 and unexplained=0 in
# every boot. Gate 193's abitest boot, heap on: riscv64 20/20 ALL PASSED
# (and 20/20 with the census, lost=0); aarch64 20/20 with only its known
# `rdtime native` failure plus, once, its 20 ms wall-clock sleep bound
# (24.6 ms at host load 11; heap-off boots reached 20.3 ms at load 2-7) —
# no fast-IPC hang in 60. The vsbench spawn+wait hang (2 in 200 heap-on
# boots) was a K-C24 rescue stranded on a tickless idle hart, not the heap
# (`do_schedule`'s Blocked arm now rings the hart's doorbell): 0 in 200
# after. The full gate with it on is main's to run.
default = ["sched-o1-placement", "sched-ipc-affinity", "sched-timer-heap", "domain-robot",
           "rc-input", "geofence"]
# The Robot application domain (wave 11, DOMAIN; config/Kconfig.domain
# DOMAIN_ROBOT). Links the robot crates under domains/robot/ — behavior and
# the brain link, the motor/sensor/flight stack, the robot safety layer
# (safety-core), the robot shell commands, the in-kernel benches — and the
# kernel tasks and call sites that use them (`#[cfg(feature =
# "domain-robot")]` in kernel/src). Without it the image is a general-purpose
# kernel: same scheduler, IPC, file systems, network, drivers and the shared
# actuation authority (crates/core/actuation: e-stop latch, flight recorder,
# sys-wdt), and none of those crates.
#
# In `default` so every build that names its features by hand (the gate's
# rows, `--features qemu,...`) keeps building the robot image it always
# built. A build driven by a .config (`make build`, the board and fleet
# targets, the gate's board rows) goes through tools/kconfig_to_cargo.py,
# which emits `--no-default-features` plus the rest of `default` for every
# domain except Robot. kernel/src/main.rs refuses (compile error) a .config
# that selects DOMAIN_ROBOT without this feature.
domain-robot = [
    "dep:azos_behavior", "dep:azos_robot", "dep:azos_safety_core",
    "dep:azos_flight", "dep:azos_nav", "dep:azos_gps",
    "dep:azos_imu", "dep:azos_baro", "dep:azos_ahrs",
    "dep:azos_telemetry", "dep:azos_bench", "dep:azos_multi_stream",
    "dep:azos_camera", "dep:azos_robot_drivers",
    "azos_shell/domain-robot", "azos_syscall/domain-robot",
]
# Wave 15 (config/Kconfig.robot RC_INPUT, GEOFENCE; owner decision: robot
# domain default y, off = compiled out). `rc-input`: the RC receiver feeds the
# safety path (link loss / kill switch latch the e-stop, the sticks drive
# through L0 and the motor envelope) — kernel/src/tasks/rc_safety.rs and
# azos_behavior::rc_link. `geofence`: the on-board fence, armed at the first
# trusted fix, whose breach latches the e-stop — azos_behavior::safety's E03
# section and its kernel hook. In `default` for the same reason as
# `domain-robot`; tools/kconfig_to_cargo.py drops each one whose symbol a
# .config leaves n.
rc-input = ["domain-robot", "azos_behavior?/rc-input"]
geofence = ["domain-robot", "azos_behavior?/geofence"]
# Bring up the CSI camera at boot in an image without the Robot domain
# (config/Kconfig.drivers DRV_CAMERA; implied by DOMAIN_IOT_HMI). A robot image
# brings it up with its sensors. Ring 3 reads frames through
# `SYS_SENSOR_READ_TYPED` (SENSOR_TYPE_CAMERA) either way.
camera = []
# Board builds REQUIRE the authenticated brain link (owner decision 2026-09-13).
# Without `link-encrypt-enforced` a keyless boot ran the brain link in
# plaintext, where seven bytes -- `PKT_MODE 0xFF` plus a CRC-8 -- clear a
# latched e-stop, and the UART bridge carried every frame with no envelope.
# Enforced: no `/fat/LINK.KEY` means no brain link, and `bridge_policy_permits()`
# holds the UART bridge down in both directions. Provision the key per robot.
# `azos_crypto/no-bitmanip`: the VF2 kernel carries no bit-manipulation
# instruction, not even behind runtime detection (gate row `vf2: no B
# extension`); its SHA-256 is the generic one.
vf2 = [
    "azos_drv_base/vf2", "azos_drv_irqchip/vf2", "azos_drv_sys/vf2",
    "azos_drv_gpio/vf2", "azos_drv_bus/vf2", "azos_drv_virtio/vf2",
    "azos_drv_block/vf2", "azos_drv_net/vf2", "azos_drv_sensor/vf2",
    "azos_drv_actuator/vf2", "azos_drv_power/vf2", "azos_drv_dmac/vf2",
    "azos_robot_drivers?/vf2", "azos_ota/vf2", "link-encrypt-enforced",
    "azos_crypto/no-bitmanip",
]
# Composes `rvv` rather than re-listing its members. It used to hand-copy four
# of the five (`arch`, `shell`, `ml`, `camera`) and drop two things: the
# KERNEL's own `rvv` feature, which is what selects `context_switch_rvv.S`
# over the scalar one in `main.rs`, and `azos_sched/rvv`. So a
# `--features k1` build emitted vector instructions from `arch-riscv64`'s
# kernels (reached by `ml` and `camera`) while linking a context switch that
# leaves `v0`-`v31` untouched across a preemption — on the one board with real
# vector hardware. The gate could not see it: `build_board "k1 (+linker)"`
# checks that it compiles, and it does.
#
# Composing used to pull `azos_sched/rvv` in as well, which compiled the
# K-C24 double-dispatch protection OUT of the scheduler — and because `k1`
# composes `rvv`, the board with real vector hardware selected that build
# transitively. `context_switch_rvv.S` now clears `context_saving` itself
# (K-C23 tail), the `azos_sched/rvv` feature is deleted, and both builds
# run the identical scheduler. Nothing here exempts anything any more.
k1 = [
    "rvv", "azos_drv_base/k1", "azos_drv_irqchip/k1", "azos_drv_sys/k1",
    "azos_drv_gpio/k1", "azos_drv_bus/k1", "azos_drv_virtio/k1",
    "azos_drv_block/k1", "azos_drv_sensor/k1", "azos_drv_actuator/k1",
    "azos_drv_dmac/k1", "dep:azos_drv_npu", "azos_drv_npu/k1",
    "azos_robot_drivers?/k1", "azos_ota/k1", "link-encrypt-enforced",
]
# Raspberry Pi 5 (BOARD_RPI5): selectable, not ported; see entry/aarch64.rs.
rpi5 = ["azos_robot_drivers?/rpi5"]
rvv  = ["azos_arch/rvv", "azos_shell/rvv", "azos_ml?/rvv", "azos_camera?/rvv"]
# RFC-0046 stage 1a canary (aarch64): see crates/core/arch-aarch64/Cargo.toml.
its-skip-mapti = ["azos_arch/its-skip-mapti"]
# Relaxed timing bounds for QEMU emulation (timer ISR ~100x slower than hardware).
# `cap-refusal-canary`: the default topology declares `pwm.0`/`gpio.0` only
# here, so the `userspace: capabilities` scenario can hold the capability the
# actuation guards refuse. A board build must not carry that grant — see
# `crates/core/topology/src/builder.rs`.
qemu = ["azos_drv_irqchip/qemu", "azos_drv_sys/qemu", "azos_net/qemu",
        "azos_topology/cap-refusal-canary",
        # `ipc-endpoint-canary`: `endpoint.demo` and `endpoint.bench` exist to
        # test capability-addressed IPC. A board build must declare no endpoint
        # it does not serve — the topology is the authority graph a reader
        # audits, and two services the robot does not run do not belong in it.
        "azos_topology/ipc-endpoint-canary",
        # `profile-actuation`: the gate's scenarios drive motors, so the QEMU
        # build declares a drivetrain. A deployment profile, not a canary —
        # `vf2`/`k1` deliberately do NOT enable it, because a board is not a
        # domain. See `crates/core/topology/Cargo.toml`.
        "azos_topology/profile-actuation",
        # `ring3-driver-start`: `start = true` on the ring-3 driver rows
        # (BUZZDRV.ELF, INADRV.ELF). Only the QEMU drivers disks carry the
        # images, so only a boot from them starts anything. Not on boards.
        "azos_topology/ring3-driver-start",
        # `dev-key`: the QEMU build verifies CONFIG.SIG against the TEST key
        # (`tools/keys/test_pub.bin`), and says so by this feature. A board
        # build has no default and fails without `TOPOLOGY_PUBKEY_PATH`
        # (`crates/core/topology/build.rs`).
        "azos_topology/dev-key",
        "azos_ipc/profile-actuation",
        # `legacy-tid-ipc`: syscall 108 exists only for `ipctest`, whose peers
        # are forked children. A board kernel does not compile the arm.
        "azos_syscall/legacy-tid-ipc",
        "azos_actuation/qemu",
        "azos_gps?/simulated-fix"]
# `deadline-refusal-canary`: the default topology declares two 60% `hard_rt`
# tasks on one CPU, so boot must stop at "Topology install FAILED: Deadline(..)".
# Its own feature, not part of `qemu`: `qemu` must still boot.
deadline-refusal-canary = ["azos_topology/deadline-refusal-canary"]

# `mem-quota-canary`: the autorun task's frame budget drops from 2048 pages to
# 64 (image, stack and page tables included since RFC-0049 M1), so `abitest`'s
# 256-page brk probe reaches it instead of needing 8 MiB. The budget is owner decision 102; without a canary nothing in the gate
# ever OBSERVES it refusing, and a quota that never refuses is indistinguishable
# from one that is not wired.
mem-quota-canary = ["azos_topology/mem-quota-canary"]
# RFC-0049 M1c gate row: an `UHELLO.ELF` topology row marked `mem = "locked"`;
# the task reports `faults=` at exit and the row requires 0.
mem-locked-smoke = ["azos_topology/mem-locked-smoke"]
# Kconfig LOCKED_HUGE_LEAVES (riscv64) gate row: the locked UHELLO.ELF row gets a
# 4 MiB region mapped with 2 MiB leaves; `huge-leaves-canary` maps the same
# region with page leaves, so the walk marker must report them.
huge-leaves-smoke = ["mem-locked-smoke", "azos_topology/huge-leaves-smoke"]
huge-leaves-canary = ["huge-leaves-smoke", "azos_sched/huge-leaves-canary"]
# Its canary: the loader maps every user stack lazily (demand markers), so the
# locked task takes stack faults and the row above must go red.
mem-locked-canary = ["mem-locked-smoke", "azos_sched/mem-locked-canary"]
# RFC-0049 P2 canary: an `ABITEST.ELF` row marked locked; its audit-mode
# profile can fork, so the autorun loader must refuse to exec it.
mem-locked-refusal-canary = ["azos_topology/mem-locked-refusal-canary"]
# RFC-0049 M1b canary: a ring-3 row with a 4 GiB ceiling; memory admission
# must refuse the topology and halt before the first ring-3 task.
mem-admission-canary = ["azos_topology/mem-admission-canary"]
# RFC-0055 canary: tools out-rank the user shell; `sh: ctrl-c on one hart`
# must fail (a CPU-bound tool starves the shell on `-smp 1`).
ushell-prio-canary = ["azos_topology/ushell-prio-canary"]
# RFC-0055 canary: `POWER.ELF` holds no `Cap<Power>`; `SYS_POWER_TYPED` must
# refuse and record every operation.
power-cap-canary = ["azos_topology/power-cap-canary"]
# Wave 12 canary: the four family tools hold no capability; their typed calls
# must refuse and record every operation.
family-cap-canary = ["azos_topology/family-cap-canary"]
# Wave 12 gate row: the drivetrain belongs to FLIGHT.ELF, not to the autorun
# row, so the user shell's `flight arm` runs (`sh: family tools` rows).
flight-tool-drivetrain = ["azos_topology/flight-tool-drivetrain"]
# RFC-0047 (wave 12): the Linux personality's gate rows. `linux-abi-test` adds
# the `LXHELLO.ELF` row (abi = "linux") and the shell's grant to start it.
# Canaries: `linux-abi-caps-canary` grants that row `/fat` read-write (its
# create is no longer refused); `linux-abi-tag-canary` never tags a Linux task
# (its numbers go to the native table). Never in a real build.
linux-abi-test = ["azos_topology/linux-abi-test"]
linux-abi-caps-canary = ["azos_topology/linux-abi-caps-canary"]
linux-abi-tag-canary = ["azos_sched/linux-abi-tag-canary", "azos_topology/linux-abi-test"]
# Wave 12 canary (owner round 48): `/proc/tasks` and `/proc/<tid>` unfiltered,
# every reader sees every task (the hidepid rows go red). Never in a real build.
proc-hidepid-canary = ["azos_sched/proc-hidepid-canary"]
# Wave 13 canary: orphans are not re-parented (the orphan rows go red).
# Never in a real build.
orphan-reparent-canary = ["azos_sched/orphan-reparent-canary"]
# Wave 13 canary: the subreaper mark is never set (the shell's orphan rows go
# red). Never in a real build.
subreaper-mark-canary = ["azos_sched/subreaper-mark-canary"]
linux-abi-fork-canary = ["azos_syscall/linux-abi-fork-canary", "azos_topology/linux-abi-test"]
linux-busybox-test = ["azos_topology/linux-busybox-test"]
linux-threads-test = ["azos_topology/linux-threads-test", "linux-abi-test"]
# RFC-0047 stage 3: a streamed image changed between its two reads (refused,
# recorded), and the same with the check compiled out (gate canary).
fd-private-offset-canary = ["azos_fs/fd-private-offset-canary", "azos_topology/linux-abi-test"]
fd-private-offset-busybox-canary = ["azos_fs/fd-private-offset-canary", "linux-busybox-test"]
linux-stream-tamper-test = ["linux-busybox-test", "azos_syscall/stream-hash-flip-canary"]
linux-stream-tamper-canary = ["linux-busybox-test", "azos_syscall/stream-hash-nocheck-canary"]
linux-abi-fp-canary = ["azos_sched/linux-abi-fp-canary", "azos_topology/linux-abi-test"]
linux-busybox-fork-canary = ["linux-busybox-test", "azos_syscall/linux-abi-fork-canary"]
# Wave 13 (SIGNALS): signal delivery, console input and execve across rows.
# `linux-exec-row-test` gives BUSYBOX.ELF's row `/fat` and the grant to exec
# LXHELLO.ELF. Canaries (never in a real build): no delivery, no SIGPIPE, no
# SIGCHLD, console read EOF, `^C` not a signal, execve's launch check skipped.
linux-exec-row-test = ["azos_topology/linux-exec-row-test", "linux-busybox-test"]
linux-signal-canary = ["azos_syscall/linux-signal-canary", "azos_topology/linux-abi-test"]
linux-sigpipe-canary = ["azos_syscall/linux-sigpipe-canary", "azos_topology/linux-abi-test"]
linux-sigchld-canary = ["azos_sched/linux-sigchld-canary", "azos_topology/linux-abi-test"]
linux-console-eof-canary = ["azos_syscall/linux-console-eof-canary", "linux-busybox-test"]
console-isig-canary = ["azos_drv_sys/console-isig-canary", "linux-busybox-test"]
linux-exec-row-canary = ["azos_syscall/linux-exec-row-canary", "linux-busybox-test"]
# Signals and threads (wave 13): canaries over the LXTHR row and LXHELLO.
linux-sig-thread-canary = ["azos_sched/linux-sig-thread-canary", "linux-threads-test"]
linux-tkill-process-canary = ["azos_syscall/linux-tkill-process-canary", "linux-threads-test"]
linux-wait-exited-canary = ["azos_syscall/linux-wait-exited-canary", "linux-threads-test"]
# Wave 13 (NATFORK) canaries, see `crates/core/syscall/Cargo.toml`.
native-fork-no-inherit-canary = ["azos_syscall/native-fork-no-inherit-canary"]
native-fork-copy-canary = ["azos_syscall/native-fork-copy-canary"]
fork-profile = ["azos_sched/fork-profile"]
cow-ro-canary = ["azos_mm/cow-ro-canary"]
# Gate canary only (wave 14, security): a fork child's mprotect(RW) of a page
# its parent shares read-only writes the parent's frame again.
mprotect-shared-canary = ["azos_mm/mprotect-shared-canary"]
# Gate canary only (wave 15, security): mprotect(RW) on the vDSO page is
# granted again (in place while the frame has no other counted holder).
vdso-write-canary = ["azos_mm/vdso-write-canary"]
# Gate canary only (wave 15, security): a sibling thread's shm release keeps
# the lease seal, whose end then widens the next mapping at that address.
lease-forget-tid-canary = ["azos_ipc/lease-forget-tid-canary"]
# Gate canary only (wave 15, security): a sibling thread of a sealed lease's
# lessor maps the sealed region writable.
lease-sealed-by-thread-canary = ["azos_ipc/lease-sealed-by-thread-canary"]
fork-demand-canary = ["azos_mm/fork-demand-canary"]
cow-reuse-canary = ["azos_mm/cow-reuse-canary"]
cow-spurious-canary = ["azos_mm/cow-spurious-canary"]
fork-commit-race-canary = ["azos_mm/fork-commit-race-canary"]
mmap-prot-canary = ["azos_syscall/mmap-prot-canary"]
demand-region-canary = ["azos_mm/demand-region-canary"]
# Plan item 7 (coherence) canaries, see `crates/core/{sched,ipc}/Cargo.toml`.
kill-wake-timer-only-canary = ["azos_sched/kill-wake-timer-only-canary"]
kill-reblock-canary = ["azos_sched/kill-reblock-canary", "azos_ipc/kill-reblock-canary"]
pipe-nonblock-canary = ["azos_ipc/pipe-nonblock-canary"]
# Wave 13 (THREADS) canaries, see `crates/core/sched/Cargo.toml`.
futex-wake-noop-canary = ["azos_sched/futex-wake-noop-canary"]
threads-no-cleartid-canary = ["azos_sched/threads-no-cleartid-canary"]
leader-cleartid-canary = ["azos_sched/leader-cleartid-canary"]
commander-exit-nostop-canary = ["azos_syscall/commander-exit-nostop-canary"]
threads-tls-canary = ["azos_sched/threads-tls-canary"]
# Wave 15 canaries, see `crates/core/sched/Cargo.toml`.
robust-list-canary = ["azos_sched/robust-list-canary", "linux-abi-test"]
sig-exit-retarget-canary = ["azos_sched/sig-exit-retarget-canary", "linux-abi-test"]
elf-mixed-page-canary = ["azos_sched/elf-mixed-page-canary"]
rodata-exec-canary = ["azos_sched/rodata-exec-canary"]
exec-sig-handover-canary = ["azos_sched/exec-sig-handover-canary"]
threads-late-start-canary = ["azos_sched/threads-late-start-canary"]
# Wave 15 (plan 4a) canaries: an exec leaves the other threads running
# (`azos_sched`); an object a thread creates is booked to the thread, not to
# its process, and dies with it (`azos_syscall`); a thread that is not the
# leader is refused its exec (`azos_sched`); an exec ends the other threads
# before it checks the image (`azos_syscall`).
exec-no-dethread-canary = ["azos_sched/exec-no-dethread-canary"]
thread-objects-canary = ["azos_syscall/thread-objects-canary"]
exec-no-pid-swap-canary = ["azos_sched/exec-no-pid-swap-canary"]
exec-validate-late-canary = ["azos_syscall/exec-validate-late-canary"]
# Wave 15 gate canary (aarch64): a native thread's argument is not written
# into its third argument register, so it arrives as 0.
thread-regs-canary = ["azos_sched/thread-regs-canary"]
reap-window-canary = ["azos_sched/reap-window-canary"]
ctx-probe = ["azos_sched/ctx-probe"]
exit-stale-hart-canary = ["azos_sched/exit-stale-hart-canary"]
orphan-late-adopter-canary = ["azos_sched/orphan-late-adopter-canary"]
threads-private-table-canary = ["azos_sched/threads-private-table-canary"]
natfork-template-tamper-canary = ["azos_syscall/natfork-template-tamper-canary"]
natfork-template-noseal-canary = ["azos_syscall/natfork-template-noseal-canary"]
# RFC-0053 stage L0/L0b (Kconfig LINUX_DRIVERS + LX_SERVER_SKELETON): the
# module loader's two syscalls and digest table (`azos_syscall/lx-loader`)
# and `LXSRV.ELF`'s topology row with `start = true`
# (`azos_topology/lx-server`). The server is the
# empty skeleton: no Linux object is linked anywhere. Off by default: the
# default kernel neither starts LXSRV.ELF (no row) nor can make ring-3 memory
# executable (630/631 unassigned).
lx-server = ["azos_syscall/lx-loader", "azos_topology/lx-server"]
# Gate canary only: the same kernel with `SYS_MODULE_VERIFY` granting a
# token for ANY bytes under a listed name (the digest compare skipped). The
# tamper row must fail with it: `lx: module tamper refused` passes only if
# the digest is what refuses.
lx-verify-canary = ["lx-server", "azos_syscall/lx-verify-canary"]
# Gate canary only: the module text is mapped writable AND executable; the
# kernel's own readback in `SYS_MODULE_MAP_X` must refuse and say so.
lx-wx-canary = ["lx-server", "azos_mm/lx-wx-canary"]
# `deadline-hart-canary`: a task pinned to CPU 3, refused by `kernel_main`'s
# second admission (with the real hart count) when booted `-smp 1`.
deadline-hart-canary = ["azos_topology/deadline-hart-canary"]
# `dma-contig-canary`: the boot's first topology admission reserves its DMA
# pool with one free frame in every pool-length taken (frames enough, no run
# long enough); reserving the pool must refuse it. Gate rows "topology: DMA
# pool needs a run".
dma-contig-canary = []
# Wave 15 TOPOSIGN canary: the signed-topology loader skips both signature
# checks (`azos_topology::signed::fill_signed`), so a tampered CAPS.TOM that
# still parses is installed. The gate's tampered-topology rows must turn red.
topo-verify-skip-canary = ["azos_topology/topo-verify-skip-canary"]
topo-sched-hash-canary = ["azos_topology/topo-sched-hash-canary"]
topo-device-canary = ["azos_topology/topo-device-canary"]
topo-replay-canary = ["azos_topology/topo-replay-canary"]
# RFC-0027: per-function `#[wcet(...)]` runtime telemetry. Default OFF (CI gate
# rejected, KILL2). Opt-in on real hardware (VF2/K1) where rdcycle is reliable.
wcet = ["azos_drv_sys/wcet"]
# F4 (wave 3): irq-in-syscall-probe -- a syscall the ecall arm intercepts
# before normal dispatch, which spins ~50 ms reading `time` while the timer
# fires (-smp 1), to prove the O3.1 nested-trap fix in
# kernel/src/entry/riscv64/asm/trap_entry.S (trap_return's sstatus-before-
# sscratch ordering) actually closes the corruption window: it must FAIL
# against the old asm with enable_all() on, and PASS against the fixed asm.
# Opt-in only -- not part of `qemu` or any board feature.
irq-in-syscall-probe = []
# RFC-0046 stage 1 — native PCI/ECAM enumeration + virtio-pci modern
# transport. QEMU `virt` only today (both ISAs): the ECAM base wired in
# `main.rs` is a QEMU-`virt` constant behind this feature, not a DTB
