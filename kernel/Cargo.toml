azos_pci   = { workspace = true, optional = true }
azos_iommu = { workspace = true, optional = true }
azos_config = { workspace = true }
azos_imu    = { workspace = true, optional = true }
azos_baro   = { workspace = true, optional = true }
azos_dtb      = { workspace = true }
azos_behavior = { workspace = true, optional = true }
