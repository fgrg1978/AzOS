decisions-durable = ["azos_decision/durable"]
# Kconfig EFFECT_WRITE_AHEAD: a ring-3 motor op is issued by the effect gate
# after its record is on the flight recorder's ring (crates/core/actuation
# effect_gate.rs). A `base` tag: emitted unless the symbol is n.
effect-gate = ["azos_actuation/effect-gate"]
# Kconfig SOC_FRAMEWORKS: the clock, reset, regulator and power-domain managers
# built from the device tree at boot (kernel/src/boot/soc.rs). Every change is
# an effect of the write-ahead gate, so it needs `effect-gate`.
soc = ["effect-gate", "dep:azos_soc"]
# Kconfig SOC_JH7110: the StarFive JH7110 providers.
soc-jh7110 = ["soc"]
# Kconfig SOC_K1: the SpacemiT K1 providers (CPU cluster clocks and PLL tree).
soc-k1 = ["soc"]
# (`stack-guard-skip`, `wx-skip`, `nx-skip`, `ro-seal-skip` and `zicboz-skip`
# are runtime canaries: `canary=<name>` on the command line, Kconfig
# CANARY_RUNTIME, kernel/src/canary_rt.rs.)
# vsbench diagnostic (wave 15, SLAB): `[KHEAP-*]` kernel heap census
# (crates/core/mm/src/kheap_census.rs, crates/core/syscall/src/kheap_census.rs).
kheap-census = ["azos_syscall/kheap-census"]
# Gate canary only (wave 15, SLAB): a slab hands out a freed object without
# unlinking it. The `kheap slab` self-test rows must go red.
slab-freelist-canary = ["azos_mm/slab-freelist-canary"]
# Gate canary only (Kconfig PMM_TYPE_ZONES): a freed page-table frame loses its
# zone and goes to the cache and the buddy lists. The `mm_zone_no_cross_type_reuse`
# ktest must go red.
zone-share-canary = ["azos_mm/zone-share-canary"]
# Wave 15 (DAIF): `irq_order_probe` (kernel/src/smokes/irq_order_probe.rs), a
# function the gate's `irq order` rows disassemble; and its canary, which
# gives the interrupt-mask asm `nomem` back.
irq-order-probe = []
irq-nomem-canary = ["irq-order-probe", "azos_arch/irq-nomem-canary"]
# Debug output (owner: console output only in debug modes): a successful
# spawn's `[SPAWN] tid=...` and `[SPAWN][PRIO]` lines and every exec's
# `[VDSO] mapped` line. Refusals, floors, aborts and fallbacks print anyway.
spawn-log = ["azos_syscall/spawn-log", "azos_sched/spawn-log"]
# Wave 14 vsbench diagnostic: per-phase cost of a backend file open/read/close
# (crates/fs/src/census.rs). Never in a shipped build.
file-census = ["azos_fs/file-census"]
# Wave 15 (FW) canaries, for a before/after vsbench `disk` run: an in-place
# write closes an epoch for its own entry again; a full hold table frees one
# chain per barrier again.
fw-entry-per-write-canary = ["azos_fs/fw-entry-per-write-canary"]
fw-free-one-held-canary = ["azos_fs/fw-free-one-held-canary"]
fw-chain-walk-canary = ["azos_fs/fw-chain-walk-canary"]
# The worst-case wake-up latency rows (cyclictest/timerlat shape): a priority-1
# kernel task wakes on an absolute 1 ms period while kernel tasks spam the
# console and read the disk, and reports max/p99 against a per-ISA bound.
# Booted under `-icount`. See kernel/src/lat_smoke.rs. Without `lat-trace`, so
# the number is the kernel's and not the tracer's; add `lat-trace` for sites.
lat-smoke = ["qemu"]
# Its canary: a task on the same hart masks interrupts for 20 ms three times.
# The tracer must name that site and the latency row must print `[LAT] FAIL`.
lat-canary = ["lat-smoke", "lat-trace"]
# Gate canary (`lat: <isa> irq-off canary`): task creation's masked POOL_LOCK
# step held twice Kconfig LOCK_MAX_HOLD_US; the smoke's irqsoff verdict must
# FAIL at that site (kernel/src/lat_smoke.rs).
lat-irqsoff-canary = ["lat-smoke", "lat-trace", "azos_sched/pool-lock-spin-canary"]
# Wave 15 (VF): the lat smoke's disk load writes through FAT32 (a whole-file
# rewrite per kick: chain allocation, free, journal barriers) instead of
# reading raw sectors. The `lat: ... FAT writes` rows.
# Wave 15 (FM): it also counts FAT device I/O issued under a held Mutex
# (`pi_io=` in `[LAT] load`; owner rule F1 wants 0).
lat-fat = ["lat-smoke", "azos_fs/fat-pi-io-probe", "azos_drv_virtio/blk-wait-probe"]
# Its canary: a `SpinLock` held across each FAT update (crates/fs/src/fat32.rs).
fat-mutate-spin-canary = ["lat-fat", "lat-trace", "azos_fs/fat-mutate-spin-canary"]
# F1 canary: a `Mutex` held across each FAT update; `pi_io=` goes non-zero.
fat-mutate-pi-canary = ["lat-fat", "azos_fs/fat-mutate-pi-canary"]
# Wave 15 (RL), owner rule F1: virtio-blk holds `BLK_LOCK` across each
# completion wait again; `[LAT] blk waits_locked=` goes non-zero.
blk-lock-wait-canary = ["lat-fat", "azos_drv_virtio/blk-lock-wait-canary"]
# Wave 15 canary: virtio-blk stays polled (its waiters spin) although its
# interrupt line is wired: the `[VIRTIO-BLK] completions by interrupt` line
# says NOT taken, and blk_irq_counts stays (0, 0).
blk-poll-canary = ["azos_drv_virtio/blk-poll-canary"]
# Gate canary: virtio-blk's command budget is wall-clock again (no stall credit).
blk-stall-canary = ["azos_drv_virtio/blk-stall-canary"]
# Gate canary: a virtio-blk discard sets `unmap`, which the device refuses.
blk-discard-unmap-canary = ["azos_drv_virtio/blk-discard-unmap-canary"]
# Wave 15 (RL), owner rule "an RT task never does block I/O": the flight
# recorder treats every caller as non-RT, so rt-motor's durable SAFE STOP
# record flushes in rt-motor and RT_BLOCK_IO_CHECK must panic naming it.
rt-io-canary = ["azos_actuation/rt-flush-canary"]
# Wave 11 (PSTORE): gate rows `pstore: ...`. After /fat mounts, a boot that
# found no RAM panic record panics with the VFS lock held and reboots warm;
# the next boot must recover the record into /fat/CRASH.LOG. See
# kernel/src/pstore.rs. The gate builds it with `qemu`; the farm builds it
# without (`make vf2-pstore`, a board image).
pstore-smoke = ["azos_fs/pstore-smoke"]
# Its canary: the panic path flips one payload byte after the checksum, so the
# next boot must reject the record and say so.
pstore-corrupt-smoke = ["pstore-smoke"]
# Wave 11 ONESHOT canary: the timer arming before the one-shot change (no
# reprogram when a task blocks on a timer deadline; aarch64's tick handler
# programs `now + period` only). The `lat:` row must print `[LAT] FAIL`.
oneshot-canary = ["lat-smoke", "azos_sched/oneshot-canary"]
# Wave 11 (A64CLK): the aarch64 kernel runs on the VIRTUAL counter/timer
# (CNTVCT_EL0, CNTV_*, PPI 27), the clock ring 3's vDSO reads. Two canaries:
# `a64clk-ppi-canary` programs CNTV but enables PPI 30 (the physical timer's
# line), so no tick arrives; `a64clk-cntvoff-canary` leaves CNTVOFF_EL2 nonzero
# at the EL2 drop (boot with `-M virt,virtualization=on`), so a kernel that
# read the physical counter would stamp 2 ms (2_000_000 ticks) off the vDSO.
a64clk-ppi-canary = ["qemu"]
a64clk-cntvoff-canary = ["qemu", "azos_arch/cntvoff-canary"]
# tls-hygiene / el0-state-audit canary: the ring-3-visible per-CPU state no
# task owns keeps a stand-in for its reset value (aarch64: boot.S's SCTLR_EL1
# write skipped, `sysregs::init_el0_state`; riscv64: `ext::senvcfg`; x86_64:
# IA32_TSC_AUX not written, `cpu_init`). ktest
# `user_visible_state_is_set_on_every_cpu` must go red, naming each register.
el0-state-canary = ["azos_arch/el0-state-canary"]
# Wave 11 (PORTWAIT) canary: a port's timer source is accepted and never
# armed; ipctest's phase P must then fail its timer check (gate rows
# `portwait: ring-3 multi-source wait`, riscv64 and aarch64).
portwait-timer-canary = ["qemu", "azos_syscall/portwait-timer-canary"]
# Wave 11 PIFAST: a priority-13 kernel client calls a
# priority-24 kernel server through fast IPC (582) while a priority-18 hog
# computes in 2 ms bursts on the same hart, and reports the call latency
# against a 100 us bound. See kernel/src/smokes/pifast_smoke.rs.
pifast-smoke = ["qemu"]
# Its canary: the call never donates (`azos_syscall/pifast-donation-canary`),
# so the row must print `[PIFAST] FAIL`.
pifast-donation-canary = ["pifast-smoke", "azos_syscall/pifast-donation-canary"]
# Wave 11 SCHED-RT rows (`sched-rt:` in tools/gate/ci_check.sh): the RT band budget,
# EDF + CBS and run-time admission measured on hart 0 under `-icount`, see
# kernel/src/rt_smoke.rs. The topology gains the two profiled rows the EDF
# check attaches to.
sched-rt-smoke = ["qemu", "use-robot", "azos_topology/sched-rt-smoke"]
# Its canaries, one property broken each; the named check must print FAIL.
rt-band-canary = ["sched-rt-smoke", "azos_sched/rt-band-canary"]
rt-edf-canary = ["sched-rt-smoke", "azos_sched/rt-edf-canary"]
rt-cbs-canary = ["sched-rt-smoke", "azos_sched/rt-cbs-canary"]
rt-admit-canary = ["sched-rt-smoke", "azos_sched/rt-admit-canary"]
rt-exempt-canary = ["sched-rt-smoke", "azos_sched/rt-exempt-canary"]
# Wave 15 (`sched-rt-util:` rows): admitted reservations near the admission
# bound (70 % and 93 % per hart, one and two harts), an overrunner, and two
# reservations at different levels; see kernel/src/rt_util_smoke.rs.
sched-rt-util = ["qemu"]
# Its canary: no CBS budget charging, so the overrunner makes the others miss.
rt-util-cbs-canary = ["sched-rt-util", "azos_sched/rt-cbs-canary"]
# Its wake-rule canary: the CBS wake test uses q/t again, so the `suspend`
# phase's self-suspending server makes its neighbour miss.
rt-util-wake-canary = ["sched-rt-util", "azos_sched/rt-wake-rate-canary"]
# RT7: an observer on hart 1 arms the flight
# controller and a culprit kernel task on hart 0 (the control hart) panics.
# Under Kconfig PANIC_POLICY_CONTAIN the panic must be contained and the
# control loops keep their period; otherwise it takes the reset path. See
# kernel/src/smokes/rt_panic_smoke.rs.
rt-panic-canary = ["qemu", "use-robot"]
# I-13 canary (aarch64): the trap entry routes an EL1 Alignment fault the old
# way, to the page-fault policy, never to the rollback: the control task's
# injected fault in ktest `txn_rolls_back_an_el1_alignment_fault` is then the
# fatal kernel page fault (`[FATAL] ... kernel page fault`, no TAP summary).
txn-align-route-canary = ["use-robot"]
# The same panic with a SpinLock held: must take the reset path under either
# policy (the containment predicate's depth check).
rt-panic-canary-spin = ["rt-panic-canary"]
# The panic in rt-motor itself, a registered safety task, holding no lock: the
# reset path under either policy (`reason=safety-task` under Contain), with the
# global panic latch set — the observer checks that a motor command and the
# ESC are refused after it (wave 13).
rt-panic-canary-safety = ["rt-panic-canary", "azos_safety_core?/rt-panic-canary-safety"]
# Wave 15 GR5: a kernel task on CPU 1 floods the console (kernel and ring-3
# paths) while one on CPU 0 panics; the report must come out whole (Kconfig
# PANIC_QUIESCE). Rows `panic: report not spliced by a console flood`; see
# kernel/src/smokes/panic_splice_smoke.rs. No `qemu`: x86_64 builds it too.
panic-splice-smoke = []
# The motor-command watchdog record row (`tools/gate/ci_check.sh`,
# `rt_watchdog_record_row`): a 5 s report window instead of 60 s, so a short
# boot closes one. Never in a default build.
rtwd-window-smoke = ["qemu", "use-robot", "azos_safety_core?/rtwd-window-smoke"]
# Its canary: the watchdog's transitions print but are not recorded. The row
# must go red on it.
rtwd-record-canary = ["use-robot", "azos_safety_core?/rtwd-record-canary"]
# The buzzer's placement through a fault and a deadline
# (kernel/src/smokes/drv_contain_smoke.rs, wave 13 and Phase 4): a panic in
# the kernel host is contained under Kconfig PANIC_POLICY_CONTAIN, and the
# driver restarts in ring 3 behind the same endpoint; with
# DRV_BUZZER_CALL_BUDGET_US set, ring-3 calls that break it move the driver
# into the kernel, and a move back is refused after the fault. Every move and
# refusal leaves a placement decision record the smoke reads. Boots the drivers
# disk; the starting host is the build's (Kconfig DRV_BUZZER_PLACEMENT,
# feature `buzzer-kernel`).
drv-contain-smoke = ["qemu"]
# Timer sleepers on every hart raced by early TID wakes (the interleavings
# that lost rt-motor's wake with the heap, gate 185); a stuck sleeper or a
# census `lost` count fails it: kernel/src/smokes/timer_heap_smoke.rs (wave 13).
timer-heap-smoke = ["qemu"]
# A tick deferred by a SpinLock is paid at the guard drop and counted as a
# preemption, not a voluntary switch: kernel/src/smokes/preempt_account_smoke.rs.
preempt-account-smoke = ["qemu"]
# Periodic-wake tail latency (mean/p99/p99.9/max over 10k wakes) against
# ping-pong pairs on the same hart, waker in the RT band with a CBS
# reservation and then best-effort: kernel/src/smokes/tail_smoke.rs. Linux
# counterpart: tools/bench/lat_linux/tail.c.
tail-smoke = ["qemu"]
# Gate row only: the vDSO write window held open (crates/core/mm vdso.rs);
# abitest must still finish (no ring-3 reader may spin on an odd seq).
vdso-write-window = ["qemu", "azos_mm/vdso-write-window"]

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
# Single source for the DRV_KIND_* constants. The kernel already hand-declared
# DRV_KIND_GPIO inside gpio_user_driver_smoke_task; the capability seeding needs
# the same value, and a second local copy is how the syscall-number problem this
# tree already has got started.
azos_driver_server = { workspace = true }
azos_common = { workspace = true }
azos_arch = { workspace = true }
azos_arch_api = { workspace = true }
azos_sync = { workspace = true }
azos_percpu = { workspace = true }
azos_drv_base      = { workspace = true }
azos_drv_irqchip   = { workspace = true }
azos_drv_sys       = { workspace = true }
azos_drv_gpio      = { workspace = true }
azos_drv_bus       = { workspace = true }
azos_drv_input     = { workspace = true }
azos_input_wire    = { workspace = true }
azos_drv_virtio    = { workspace = true }
azos_drv_block     = { workspace = true }
azos_drv_net       = { workspace = true }
azos_drv_sensor    = { workspace = true }
azos_cam_ring      = { workspace = true }
azos_drv_actuator  = { workspace = true }
azos_drv_power     = { workspace = true }
azos_robot_drivers = { workspace = true, optional = true }
azos_drv_api       = { workspace = true }
azos_abi = { workspace = true }
azos_bytepipe = { workspace = true }
azos_mm = { workspace = true }
azos_sched = { workspace = true }
# The idle tasks go through `seams::IDLE_GOVERNOR`; with `energy`,
# the boot-time model resolution.
azos_energy = { workspace = true }
azos_syscall = { workspace = true }
azos_fs = { workspace = true }
azos_net = { workspace = true }
azos_multi_stream = { workspace = true, optional = true }
azos_ipc = { workspace = true }
azos_robot = { workspace = true, optional = true }
azos_recovery  = { workspace = true }
azos_camera = { workspace = true, optional = true }
azos_display = { workspace = true, optional = true }
azos_fb = { workspace = true, optional = true }
# See the `pci`/`iommu` feature docs above.
azos_pci   = { workspace = true, optional = true }
azos_iommu = { workspace = true, optional = true }
# The DMA domains every driver maps its buffers through (always built).
azos_dma   = { workspace = true }
azos_usb   = { workspace = true, optional = true }
azos_usb_hid = { workspace = true, optional = true }
azos_config = { workspace = true }
azos_imu    = { workspace = true, optional = true }
azos_baro   = { workspace = true, optional = true }
azos_dtb      = { workspace = true }
azos_thermal  = { workspace = true, optional = true }
azos_firmware = { workspace = true, optional = true }
azos_soc      = { workspace = true, optional = true }
azos_behavior = { workspace = true, optional = true }
azos_ahrs     = { workspace = true, optional = true }
azos_gps       = { workspace = true, optional = true }
azos_flight    = { workspace = true, optional = true }
azos_telemetry = { workspace = true, optional = true }
azos_nav       = { workspace = true, optional = true }
azos_ota       = { workspace = true }
# Synthetic per-subsystem microbenches.  `cfg(feature = "qemu")`
# triggers a one-shot `run_all` from behavior_task post-boot so the
# bench harness scrapes [BENCH-RES] lines without needing shell input
# (which is unreliable end-to-end under QEMU TCG SMP).
azos_bench     = { path = "../crates/domains/robot/bench", features = ["all"], optional = true }
azos_trace     = { workspace = true }
azos_ktest     = { workspace = true, optional = true }
azos_chaos     = { workspace = true }
azos_decision  = { workspace = true }
azos_inspect   = { workspace = true, optional = true }
azos_tpm       = { workspace = true, optional = true }
azos_rtc       = { workspace = true, optional = true }
azos_hv        = { workspace = true, optional = true }
azos_devif     = { workspace = true }
# Wave 15: the trace ring layout (the cost probe reads its own ring).
azos_rings      = { workspace = true }
azos_topology  = { workspace = true }
# The boot-time apply of staged packages (kernel/src/boot/pkg_apply.rs).
azos_pkg       = { workspace = true }
azos_limits    = { workspace = true }
# The Linux personality's numbers (the aarch64 trap snapshots a
# Linux `clone` like a native fork).
azos_linux_abi = { workspace = true }
# The safety path (crates/domains/robot/safety-core). The kernel creates its
# tasks, calls its ISR-side functions and installs its OTA boot-good hook.
azos_safety_core = { path = "../crates/domains/robot/safety-core", optional = true }
# Wave 11 (DOMAIN): the actuation authority every domain shares — e-stop latch,
# release authority, safe mode, flight recorder, sys-wdt, the timer-ISR feed.
azos_actuation = { workspace = true }
# The entropy pool's boot-side helpers (kernel/src/boot/entropy_pool.rs).
azos_crypto    = { workspace = true }
