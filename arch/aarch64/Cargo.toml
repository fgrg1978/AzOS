[package]
name = "azos_arch_aarch64"
version = "0.1.0"
edition = "2021"
description = "aarch64 ISA crate behind azos_arch: the azos_arch_api contract (Cpu / Interrupts / Mmu / Boot) for VMSAv8-64, PSCI, GICv2, GICv3 with the ITS, and the generic timer."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
repository = "https://github.com/azos-project/azos"

[lib]
name = "azos_arch_aarch64"

# A workspace member so its types and struct definitions are always available
# (the arch-api trait surface is target-agnostic). The asm bodies are cfg-gated
# to `target_arch = "aarch64"` — on the workspace's default riscv64 target the
# crate compiles cleanly as essentially-empty.
#
# Built for two targets. `aarch64-unknown-none` (hard-float, where NEON is
# part of the target; the level is Kconfig AARCH64_LEVEL) for this crate's own
# gate row; `aarch64-unknown-none-softfloat` as part
# of the kernel, which is FP-free so that user FP state can be saved lazily
# (kernel/src/entry/aarch64/fp.rs). No `#[target_feature(enable =
# "neon")]` anywhere: rustc calls it unsound on a soft-float ABI; the NEON
# `dot_f32` is compiled only where NEON is part of the target.
#
# Build and test:
#   rustup target add aarch64-unknown-none
#   cargo build --release --target aarch64-unknown-none -p azos_arch_aarch64
#
# `tools/gate/ci_check.sh` does both, so this cannot rot the way the parked copy did.

[dependencies]
azos_common = { workspace = true }
azos_arch_api = { workspace = true }
# The logical-CPU <-> MPIDR-affinity map (IPI and PSCI targets).
azos_percpu   = { workspace = true }
azos_limits       = { workspace = true }
bitflags          = { workspace = true }

[features]
# Wave-4 canary hook for the ITS acceptance test (see
# `arch/aarch64/src/irq/its.rs`'s `ItsDriver::map_vector`): skips the
# `MAPTI` command a real mapping would issue, so a PCI device's MSI-X
# vector is never actually wired to an LPI. `tools/gate/ci_check.sh`'s negative
# row builds with this on and asserts the per-vector LPI count stays 0 —
# proving the positive row's count-moved assertion actually discriminates,
# not just "the kernel booted". `kernel/Cargo.toml` needs to forward this
# (`its-skip-mapti = ["azos_arch_aarch64/its-skip-mapti"]`) for
# `cargo build -p azos_kernel --features its-skip-mapti` to reach it —
# not added here, see A2-ci_check.diff.
its-skip-mapti = []
# Host-test canary: the WFxT, TLBIRANGE and PMUVer ID-field tests use the
# `>= 1` rule that is wrong for them (`features.rs`); their test must go red.
a64-id-canary = []
# Host-test canary: the range shootdown's NUM is one too large (`ext/tlbi_range.rs`).
a64-tlbi-canary = []
# Host-test canaries of tests/host/hv-tests (guest PSCI and the virtual timer
# under `ext/hv/`): each breaks one rule on purpose so the test that guards it
# goes red. Never enabled in a build.
# A guest's CPU_ON / SYSTEM_OFF is passed on to the firmware, not emulated.
canary-psci-forwarded = []
# Kconfig HV (derived from VIRT): the resident EL2 stub and the guest entry
# (`ext/hv/stub.rs`, `vcpu.rs`). `_azos_drop_to_el1` keeps EL2 only with it; an
# image without it drops to EL1 as it did before the hypervisor.
hv = []
# The timer PPI is listed again over one the guest is handling.
canary-ppi-listed-twice = []
# Each vCPU of a VM gets its own CNTVOFF_EL2.
canary-cntvoff-per-vcpu = []
# An asserted guest timer leaves the physical PPI enabled for the run.
canary-ppi-not-silenced = []
# Gate canary for the TLB shootdown: non-broadcast TLBI (see api_impl.rs).
tlb-local-only = []
# Masked-window tracer hooks (`src/lat_hook.rs`); Kconfig `LAT_TRACE`.
lat-trace = ["azos_arch_api/lat-trace"]
# Gate canary only (wave 15): the interrupt-mask asm gets `nomem` back, so
# it stops being a compiler barrier. The `irq order` rows must go red.
irq-nomem-canary = []
# Gate canary for the one-clock property: `_azos_drop_to_el1` sets
# `CNTVOFF_EL2` to a large nonzero value (the stand-in for firmware that did),
# so only a kernel whose stamps, deadlines and ring 3's vDSO all read the
# VIRTUAL counter still agrees with itself (needs a boot at EL2).
cntvoff-canary = []
# Canary: the GIC's 32-bit register write is post-indexed, so a hypervisor gets
# it with ISV=0: HVF aborts the VM at the first one, TCG boots on (gate row
# `aarch64 hvf: a writeback store on a device aborts`).
mmio-writeback-canary = []
# tls-hygiene gate canary, never in a real build: `sysregs::init_el0_state`
# keeps CNTKCTL_EL1's EL0 bits and writes a non-zero TPIDRRO_EL0, standing for
# the UNKNOWN reset values on silicon, and leaves MDSCR_EL1 at its reset value
# (boot.S, through the kernel's feature, also skips its SCTLR_EL1 write). The
# ktest `user_visible_state_is_set_on_every_cpu` must go red.
el0-state-canary = []
