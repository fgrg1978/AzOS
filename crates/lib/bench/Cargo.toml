[package]
name = "azos_bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Synthetic microbenchmarks for kernel subsystems (ipc, mm, sched, net, fs, crypto). Runs in-kernel via shell `bench` command; emits parseable [BENCH-RES] lines for the companion bench collector to ingest."

[dependencies]
# Subsystems we bench.  Add deps as we add per-subsystem modules.
azos_drv_sys = { workspace = true }
azos_ipc     = { path = "../../core/ipc" }
azos_sched   = { path = "../../core/sched" }
azos_sync    = { path = "../../core/sync" }
azos_net     = { path = "../../net/stack" }
azos_crypto  = { path = "../../core/crypto" }
azos_fs      = { path = "../../fs" }
azos_mm      = { path = "../../core/mm" }
azos_ota     = { path = "../../core/ota" }

[features]
default = []
# Each subsystem gateable independently so build-time exclusion is trivial.
ipc      = []
mm       = []
sched    = []
net      = []
fs       = []
crypto   = []
cap      = []
ota      = []
asyncrt  = []
# Convenience: enable everything.
all      = ["ipc", "mm", "sched", "net", "fs", "crypto", "cap", "ota", "asyncrt"]
