[package]
name = "azos_behavior"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[features]
# Features of config/subsys/Kconfig.robot RC_INPUT / GEOFENCE, forwarded from the
# kernel's features of the same names. `rc-input` compiles `rc_link` (the RC
# receiver's safety policy); `geofence` compiles the E03 fence in `safety`.
rc-input = []
geofence = []

[dependencies]
azos_sync         = { workspace = true }
azos_rings        = { workspace = true }
azos_drv_sys      = { workspace = true }
azos_drv_base     = { workspace = true }
azos_robot_sensors = { workspace = true }
azos_abi          = { workspace = true }
azos_drv_gpio     = { workspace = true }
azos_drv_actuator = { workspace = true }
# Graded degrade level — motor_envelope reads degrade_level() from
# ipc and level_cap_pct() from the dep-free degrade-policy leaf.
azos_ipc          = { workspace = true }
# Degrade taxonomy + speed-ceiling constants (motor-actuation policy).
azos_degrade_policy = { workspace = true }
# Kconfig ROBOT_TYPE_ID (config/subsys/Kconfig.robot): the robot type the safety
# envelope starts with (safety.rs, ROBOT_TYPE).
azos_limits       = { workspace = true }
azos_actuation    = { workspace = true }
# The companion's pinned Noise key is the signed topology's `[peer.companion]` row.
azos_topology     = { workspace = true }
# #[wcet(N_us)] proc-macro for per-function WCET budget annotations.
# Host-built proc-macro; Cargo resolves it correctly for cross-compilation
# because proc-macros are always built for the host (build target).
wcet-macro = { path = "../../../../crates/core/wcet-macro" }
