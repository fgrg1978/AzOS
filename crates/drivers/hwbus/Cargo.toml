[package]
name = "azos_hwbus"
version = "0.1.0"
edition = "2021"
description = "The runtime hardware bus: device objects from PCI, the device tree and virtio-mmio, the driver match tables, the bind policy, unbind and rebind. Pure no_std, host-tested."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
build = "build.rs"

[dependencies]
azos_limits = { workspace = true }

[build-dependencies]
# Host-only, used by build.rs to read `.config` (the native table keeps the
# entries of the drivers the image compiles).
azos-config = { path = "../../core/azos-config" }

[features]
# Gate canary only: the bind policy ignores the topology-only setting and
# admits everything the tables match. The host rows that pin the policy must
# fail with this on. Never enabled in a shipping build.
policy-canary = []
# Gate canary only: an unbind is taken on the driver's word, so a device
# whose interrupt line, DMA or window is still held reads as released. The
# host rows that pin the post-unbind check must fail with this on.
unbind-canary = []
# Gate canary only: a device-tree node no list names reads as a peripheral (the old
# fail-open default). The host rows that pin the classification must fail.
dt-unknown-peripheral-canary = []
# Canary: a bare peripheral token in a compatible (i2c, uart) makes a peripheral of it.
dt-bare-token-canary = []
# Canary: a listed generic fallback after an unknown specific compatible makes a peripheral.
dt-fallback-canary = []
# Canary: a window overlapping RAM, the kernel image, an interrupt controller or an IOMMU is still ring 3's.
window-overlap-canary = []
# Canary: a cut or non-UTF-8 compatible string is ignored, so the kept strings alone classify the node.
dt-lossy-compatible-canary = []
# Canary: a dma-coherent inherited from a bus above the node makes it a bus master.
dt-inherited-coherent-canary = []
# Gate canary only: opening a bus master's I/O ports books nothing, so a native driver can
# still bind it. The host row that pins the booking must fail.
ports-claim-canary = []
