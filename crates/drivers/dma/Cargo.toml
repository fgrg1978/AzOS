[package]
name = "azos_dma"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = """
DMA domains: the `DmaDomain` a driver maps its buffers through,
the identity and software-checked domains for boards with no IOMMU, the
registry of which domain a device sits in, cache maintenance for
non-coherent masters and the bounce-buffer decision.
no_std, no allocator, no locks, host-tested via tests/host/dma-tests.
"""

[dependencies]
azos_common = { path = "../../core/common" }

[features]
# Gate canary: a ring-3 object is recorded as bound without entering its
# device's domain (`bind::map`), so behind an IOMMU the device's first access
# faults and the host test of the binding sees the page missing.
dma-bind-skip-map-canary = []
# Host canaries (tests/host/iommu-tests, syscall-tests): the kernel reuses a
# device's IOMMU domain for ring 3 only when it is empty, so ring 3's second
# map of a live device is refused (`reuse_for_ring3`); a parked binding's
# record is freed instead (`Table::finish`).
ring3-reuse-canary = []
park-drop-canary = []
# Host canary (tests/host/dma-tests): a block whose map the unit did not confirm taking back
# is freed like any other failed map.
map-failed-frees-canary = []
