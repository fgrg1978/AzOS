[package]
name = "azos_drv_base"
version = "0.1.0"
edition = "2021"
description = "Driver base: board description (platform::hw), the in-kernel driver registry, resource decoding."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[features]
# Board selection, forwarded by the kernel's own `vf2` / `k1`.
vf2 = []
k1  = []
# Canaries of `instances.rs` (built by tests/host/drivers-tests): a freed
# instance number goes to another device; an unregistration does not wait for
# the ops in flight.
instances-reuse-canary = []
instances-no-drain-canary = []
# Canary of `Instances::reserve_boards` (built by tests/host/drivers-tests): the
# reservation takes no slot.
sensor-reserve-canary = []
# Canary of `sensors.rs` (built by tests/host/drivers-tests and the kernel's
# `sensor-drop-canary`): a producer drops every 10th sample.
sensor-drop-canary = []

[dependencies]
azos_abi     = { workspace = true }
azos_arch    = { workspace = true }
azos_sync    = { workspace = true }
azos_limits  = { workspace = true }
azos_drv_api = { workspace = true }
azos_devif   = { workspace = true }
azos_rings   = { workspace = true }
