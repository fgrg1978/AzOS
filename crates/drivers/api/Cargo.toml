[package]
name = "azos_drv_api"
version = "0.1.0"
edition = "2021"
description = "Driver framework surface and the per-class driver traits (block, console, net). Pure no_std + host-compatible — no RISC-V dependencies. Modular-pattern surface."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
repository = "https://github.com/azos-project/azos"

[lib]
name = "azos_drv_api"

[dependencies]
azos_abi = { workspace = true }
# `recovery`'s sink is an ro_after_init hook.
azos_common = { workspace = true }
