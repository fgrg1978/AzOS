[package]
name = "azos_drv_bus"
version = "0.1.0"
edition = "2021"
description = "Buses: I2C, SPI, CAN, USB, the UART bridge, and the kernel's hardware bus instance (azos_hwbus)."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[features]
# Board selection, forwarded by the kernel's own `vf2` / `k1`.
vf2 = []
k1  = []
# Kconfig I2C_DESIGNWARE: the Synopsys DesignWare I2C controllers (the
# VisionFive 2's, the Raspberry Pi 5 RP1's, Intel LPSS) instead of the QEMU
# simulation (src/i2c.rs).
i2c-dw = []

[dependencies]
azos_common = { workspace = true }
azos_abi      = { workspace = true }
azos_sync     = { workspace = true }
azos_limits   = { workspace = true }
azos_devif    = { workspace = true }
azos_drv_api  = { workspace = true }
azos_drv_base = { workspace = true }
azos_drv_sys  = { workspace = true }
azos_hwbus    = { workspace = true }
