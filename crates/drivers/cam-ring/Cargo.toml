[package]
name = "azos_cam_ring"
version = "0.1.0"
edition = "2021"
description = "The frame class's pool: refcounted frame buffers, a Log of frame ids for the fan-out to many readers, two lag policies, and the producer's FrameSink. Pure no_std; no heap; buffers are injected. Host-testable via tests/host/cam-ring-tests."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[lib]
name = "azos_cam_ring"

[features]
# Canaries of tests/host/cam-ring-tests; each breaks one guarantee so the row
# that guards it must go red. Never enabled by the kernel build.
#
# A reader's view of a frame writes into it.
canary-reader-writes = []
# Backpressure overwrites an owed frame and counts nothing.
canary-backpressure-drops = []
# Overwrite-oldest refuses a frame while a reader lags.
canary-overwrite-refuses = []
# A dropped frame reference is never given back.
canary-reference-leaks = []
# A detached reader still holds the producer back.
canary-detach-keeps = []

[dependencies]
azos_rings = { workspace = true }
