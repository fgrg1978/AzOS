[package]
name = "azos_iommu"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = """
IOMMU support behind one domain interface: the RISC-V
IOMMU, Arm SMMUv3, Intel VT-d and AMD-Vi units (register bring-up, device
table entries, command and fault/event records), the I/O page-table formats
they walk, and the domain that owns one device's page table. One stage,
per-device bypass / block / single-stage translation; no ATS, no PASID, no
nested translation, no interrupt remapping. Field layouts were checked
against the public specifications and the Linux and QEMU headers, and are
tested against hand-computed vectors. no_std, no allocator, host-tested via
tests/host/iommu-tests.
"""

[dependencies]
azos_dma = { path = "../dma" }
azos_drvkit = { path = "../kit" }

[features]
# Gate canary only: registers past the mapped window are accessed anyway.
vtd-window-canary = []
# Host canary only: `IoDomain::is_empty` answers true with mappings in the
# table (`a_domain_with_a_mapping_left_is_not_handed_to_ring_3` goes red).
domain-empty-canary = []
# Host canary only: a failed flush leaves the domain reading empty
# (`a_failed_flush_leaves_the_domain_not_empty` goes red).
domain-stale-canary = []
# Host canary only: a map whose flush failed twice answers a plain error, as if
# nothing were mapped (`a_map_whose_flush_fails_twice_may_still_be_mapped` goes red).
map-keeps-frames-canary = []
# Host canary only: a function the log never saw, or saw in pass-through, reads as confined
# (`a_function_the_unit_did_not_block_is_not_confined` goes red).
attach-assumed-canary = []
# Canary: a domain is noted as translating before the unit took it.
translate-assumed-canary = []
