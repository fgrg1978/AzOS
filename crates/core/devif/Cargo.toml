[package]
name = "azos_devif"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The interfaces of the services the kernel hosts and of the devices a driver endpoint serves (D6 part A): entropy, link key, power, block, time, GPIO, I2C, PWM, ADC, buzzer, motor, sensor, behavior, configuration, OTA, flight and sound (a PCM stream over a queue of memory-object periods). Each is an #[azos_interface] trait (crates/core/idl): the kernel serves it from the endpoint a topology row grants, a ring-3 driver serves the same trait from its own endpoint, and the client stub does not know which. no_std; shared by the kernel, libsys and the userspace images."

[dependencies]
azos_abi = { path = "../abi" }
azos_idl = { path = "../idl" }
azos_rings = { path = "../rings" }

[features]
# Canary: `gpio::badge` drops the controller, so a capability on controller
# 1's pin names controller 0's (the cross-controller refusal tests go red).
badge-without-controller-canary = []
# Canary: `call_slot::park_until` sleeps for ever, so a wake lost between the
# call task's look at the slot and its sleep is never made up (the host test
# `a_wake_lost_before_the_sleep_costs_a_bounded_wait` goes red).
call-slot-park-canary = []
# Canary: a client that joins a call posted and not yet taken does not wake the
# call task (`a_client_that_joins_a_posted_call_wakes_the_task` goes red).
call-slot-joiner-canary = []
