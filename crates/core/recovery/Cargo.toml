[package]
name = "azos_recovery"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[features]
no-ml   = ["azos_behavior?/no-ml"]
# The robot crates the family bodies (`families`, behind the ring-3 typed
# calls) and `security`/`bench` call. Without it they answer ENOSYS / say the
# image has no Robot domain.
use-robot = [
    "dep:azos_robot", "dep:azos_behavior", "dep:azos_flight",
    "dep:azos_bench", "dep:azos_robot_drivers",
]

[dependencies]
azos_fs = { workspace = true }
azos_net = { workspace = true }
azos_sched = { workspace = true }
azos_mm = { workspace = true }
azos_drv_base      = { workspace = true }
azos_drv_sys       = { workspace = true }
azos_drv_api       = { workspace = true }
azos_robot_drivers = { workspace = true, optional = true }
azos_robot = { workspace = true, optional = true }
azos_arch = { workspace = true }
azos_config = { workspace = true }
azos_behavior = { workspace = true, optional = true }
azos_flight    = { workspace = true, optional = true }
azos_ota       = { workspace = true }
azos_ipc       = { workspace = true }
azos_abi       = { workspace = true }
# `CONSOLE_LOCKDOWN` (config/Kconfig.mitigations), read by `authority.rs`.
azos_limits    = { workspace = true }
# `wcet`/`bench` (tools/bench_e2e.sh).
azos_bench     = { path = "../../../domains/robot/bench", features = ["all"], optional = true }
azos_actuation = { workspace = true }
# `why`: the decision query.
azos_decision  = { workspace = true }
