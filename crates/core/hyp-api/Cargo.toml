[package]
name = "azos_hyp_api"
version = "0.1.0"
edition = "2021"
description = "The resident monitor's ABI: call ids, errors, invariants, the violation record"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[lib]
name = "azos_hyp_api"
path = "src/lib.rs"

[features]
# Each removes one rule from a pure check so its host test goes red
# (tests/host/hv-tests forwards them). Never set in a real build.
canary-guard-pool = []
canary-derive-no-ram = []
canary-latch-first = []
canary-missing-inv = []
canary-rd-lpi-open = []
