[package]
name = "azos_pubsub"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[dependencies]
azos_sync = { workspace = true }
azos_limits = { workspace = true }

[features]
# Wave 15 canary, never in a real build: an exiting task keeps its
# subscriptions (`tests/host/sync-tests`, `pubsub_exit`).
pubsub-exit-keep-canary = []
