[package]
name = "azos_ipc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }

[features]
# Host canary (tests/host/topology-tests): a writable window is granted on a
# device that masters the bus whatever the kernel's policy says.
writable-master-canary = []
# Host canary (tests/host/syscall-tests `mmio_map.rs`): ring 3 is given memory
# for a device no IOMMU confines whatever Kconfig DMA_RING3_WITHOUT_IOMMU says.
dma-ring3-unconfined-canary = []
# Kconfig KTEST: the hooks only the in-kernel tests use (`irq_bind::canary_storm`,
# the `irq-storm` canary of ktest `irq_storm_is_contained`). Off: compiled out.
ktest = []
# Canary only: capability tables come from a cache of another type, not the retained cell cache
# (ktest `cap_table_cache_is_type_stable` goes red).
cap-table-cross-type-canary = []
# Gate canary (D3/L4 lazy revocation, `cap.rs` `revocation_in_flight`): a
# capability derived from a revoked one is not refused before the sweep frees
# it. Never in a real build.
revoke-chain-canary = []
# `cap_store.rs` `grant_like`: the copy of a fork is not checked against a revoke
# that finished while it was being made (host test in tests/host/cap-tests).
fork-revoke-canary = []
# Wave 15 gate canary: a static-key write goes through the EXECUTABLE text
# mapping instead of the alias; W^X must stop it with a store fault.
text-poke-wx-canary = []
# Gate canary of the introspection regions (`inspect_region.rs`): every view
# region is granted with the public one, to a row that declares none of them.
# The `inspect: views need their grant` rows must fail with it. Never in a
# real build.
inspect-view-canary = []
default = []
# M40 (audit U10-6): gates `seed_one_cap_outcome`'s actuation arms the
# same way `crates/core/topology`'s parser and builder already gate the word
# "motor" / the `CapSpec` rows — a non-actuating build must have ZERO live
# paths to mint a drivetrain capability, not just zero declared ones.
profile-actuation = []
# `port.rs`'s lost-wakeup canary. Only its host suite (`tests/host/ipc-tests`)
# acts on it (`cfg(all(test, ...))`); declared here so the cfg is known.
port-recheck-canary = []
# io_ring K1 canary: OP_FSYNC completes in the submit (the synchronous answer),
# so `a_write_is_queued_and_its_fsync_completes_only_after_the_flush` goes red.
ioring-sync-fsync-canary = []
# io_ring registered buffers: a vacated ring forgets the pins its buffers hold,
# so `a_vacated_ring_gives_every_pin_back` goes red. Host suite only.
ioring-regbuf-leak-canary = []
# `port.rs`'s capability-binding canary (wave 11): `port_cap_event`
# ignores every event, so a binding outlives a revoke. Host suite only.
port-revoke-canary = []
# `ep_queue.rs`'s call-source canary: a call that finds its queue empty hands
# back no port link, so a server that waits on its port for calls never
# hears of one. Host suites only (`tests/host/ipc-fast-tests`, `srv-tests`).
port-calls-canary = []
# `ep_queue.rs` `keep_link_for`'s canary: a change of owner always drops the
# call link (a live update's successor loses it; a same-owner grant unbinds).
call-link-drop-canary = []
# `endpoint.rs` `calls_set_link`'s canary: any holder of a READ capability binds
# an endpoint's calls (syscall-tests' only_the_server_binds_an_endpoints_calls).
calls-any-binder-canary = []
# `port.rs`'s doorbell canary: no futex wake reaches a doorbell source, so
# `a_doorbell_reaches_the_ports_bound_to_its_word` goes red. Host suite only.
port-doorbell-canary = []
# `port.rs`'s doorbell accounting canaries: a freed doorbell leaves its count
# in the filter (`a_freed_doorbell_leaves_the_filter_with_nothing_to_look_up`),
# and the machine shares one port's worth of doorbells
# (`a_full_port_does_not_take_another_tasks_doorbell`).
port-bell-leak-canary = []
port-bells-shared-canary = []

# MemObj host canaries (tests/host/ipc-tests, syscall-tests): the object table is in `azos_mm`.
memobj-move-keeps-map-canary = ["azos_mm/memobj-move-keeps-map-canary"]
memobj-share-no-narrow-canary = ["azos_mm/memobj-share-no-narrow-canary"]
memobj-charge-stays-canary = ["azos_mm/memobj-charge-stays-canary"]
memobj-protect-max-canary = ["azos_mm/memobj-protect-max-canary"]
memobj-cow-no-break-canary = ["azos_mm/memobj-cow-no-break-canary"]
memobj-no-kernel-map-canary = ["azos_mm/memobj-no-kernel-map-canary"]
memobj-refcount-wrap-canary = ["azos_mm/memobj-refcount-wrap-canary"]
memobj-sweep-no-hook-canary = ["azos_mm/memobj-sweep-no-hook-canary"]
memobj-sweep-no-retain-canary = ["azos_mm/memobj-sweep-no-retain-canary"]
memobj-sweep-every-domain-canary = ["azos_mm/memobj-sweep-every-domain-canary"]
memobj-purge-held-canary = ["azos_mm/memobj-purge-held-canary"]
memobj-purge-kernel-held-canary = ["azos_mm/memobj-purge-kernel-held-canary"]
memobj-purge-locked-canary = ["azos_mm/memobj-purge-locked-canary"]
memobj-word-unlocked-canary = ["azos_mm/memobj-word-unlocked-canary"]
memobj-word-spin-canary = ["azos_mm/memobj-word-spin-canary"]
memobj-resolve-stale-canary = ["azos_mm/memobj-resolve-stale-canary"]
memobj-hold-canary = ["azos_mm/memobj-hold-canary"]
memobj-map-unrecorded-canary = ["azos_mm/memobj-map-unrecorded-canary"]
memobj-inherit-unmarked-canary = ["azos_mm/memobj-inherit-unmarked-canary"]
memobj-resolve-one-answer-canary = ["azos_mm/memobj-resolve-one-answer-canary"]
# Delete is not revoke (20-10): a delete revokes the copies of the slot again.
delete-revokes-canary = []
# A move of a slot with copies lifts them a level (as a delete does) again.
move-lifts-depth-canary = []

[dependencies]
azos_abi = { workspace = true }
azos_sched = { workspace = true }
azos_decision = { workspace = true }
azos_devif = { workspace = true }
azos_sync = { workspace = true }
azos_common = { workspace = true }
azos_mm = { workspace = true }
azos_drv_base     = { workspace = true }
azos_drv_sys      = { workspace = true }
azos_drv_bus      = { workspace = true }
azos_dma          = { workspace = true }
azos_drv_block    = { workspace = true }
azos_arch = { workspace = true }
# `ioport_cap`: the ISA's port space (`azos_arch_api::ioport::PORTS`).
azos_arch_api = { workspace = true }
azos_limits = { workspace = true }
azos_chaos = { workspace = true }
azos_rings = { workspace = true }
azos_bytepipe = { workspace = true }
azos_trace = { workspace = true }
wcet-macro = { path = "../wcet-macro" }
