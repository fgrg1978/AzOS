[package]
name = "azos_actuation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The actuation authority every domain shares: e-stop latch, release authority, safe mode, the latch-and-stop sequence, the flight recorder, the system watchdog."

[features]
# `qemu`: sys_wdt's frozen-timer threshold for a TCG guest (see sys_wdt.rs).
qemu = []

[dependencies]
azos_arch     = { workspace = true }
azos_common   = { workspace = true }
azos_sync     = { workspace = true }
azos_drv_sys  = { workspace = true }
azos_drv_gpio = { workspace = true }
azos_sched    = { workspace = true }
azos_ipc      = { workspace = true }
azos_syscall  = { workspace = true }
azos_config   = { workspace = true }
azos_limits   = { workspace = true }
azos_crypto   = { workspace = true }
