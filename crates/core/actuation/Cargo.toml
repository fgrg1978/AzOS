[package]
name = "azos_actuation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The actuation authority every domain shares: e-stop latch, release authority, safe mode, the latch-and-stop sequence, the effect interface and its provider table, the flight recorder, the system watchdog."

[features]
# `qemu`: sys_wdt's frozen-timer threshold for a TCG guest (see sys_wdt.rs).
qemu = []
# Gate canary only (host suite `actuation-tests`): the devices phase is not
# entered in order.
devices-phase-canary = []
# Gate canary only (kernel `rt-io-canary`): the RT-caller probe is ignored,
# so an RT task's `logger_flush` does the block I/O itself.
rt-flush-canary = []
# Gate canaries only (host suite `behavior-tests`): the replay does not end its
# walk at a file's state records; a rotation leaves the latch out of the new
# file's state records; the replay takes the last name, not the newest serial,
# once the names have wrapped.
replay-snapshot-canary = []
rotate-latch-canary = []
wrap-tail-canary = []
# Kconfig EFFECT_WRITE_AHEAD (kernel feature `effect-gate`): a ring-3 motor op
# is issued by the effect gate (`effect_gate.rs`), after its record is on the
# flight recorder's ring. Off: the gate is not linked or installed.
effect-gate = []
# Gate canary only (host suite `actuation-tests`): the effect gate issues the
# device op BEFORE committing its record, so the write-ahead tests must go red.
effect-issue-before-commit-canary = []
# Gate canary only (host suite `actuation-tests`): the effect gate ignores the
# Domain's envelope rows for storage deletes and network egress, so the refusal
# tests must go red.
envelope-row-canary = []
# Gate canary only (host suite `actuation-tests`): effect and ordinary records
# may use the queues' safety reserve, so a full queue has no slot for the
# e-stop record and the reserve tests must go red.
ring-reserve-canary = []
# Gate canaries only (host suites `actuation-tests`, `behavior-tests`): the
# flusher writes the per-CPU queues one after another instead of in push
# order; a full queue answers as if it took the record and drops it.
durable-merge-canary = []
durable-full-canary = []
# Gate canary only (host suite `behavior-tests`): the telemetry encoders push
# onto the flight recorder's ring instead of the record region's, so a flood of
# telemetry takes the queues' room and the telemetry tests must go red.
telemetry-ring-canary = []
# Gate canary only (host suites `behavior-tests`, `actuation-tests`): a release
# proof is accepted with no durable recorder in every build, so the fail-closed
# release tests must go red.
estop-unrecorded-canary = []

[dependencies]
azos_arch     = { workspace = true }
azos_common   = { workspace = true }
azos_ext_api  = { workspace = true }
azos_sync     = { workspace = true }
azos_drv_sys  = { workspace = true }
azos_sched    = { workspace = true }
azos_ipc      = { workspace = true }
azos_syscall  = { workspace = true }
azos_config   = { workspace = true }
azos_limits   = { workspace = true }
azos_decision = { workspace = true }
azos_records  = { workspace = true }
azos_rings    = { workspace = true }
azos_crypto   = { workspace = true }
azos_net      = { workspace = true }
azos_topology = { workspace = true }
