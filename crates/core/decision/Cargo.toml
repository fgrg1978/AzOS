[package]
name = "azos_decision"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Explainable decision records (Kconfig DECISION_RECORDS): admission, placement and refusal paths write one fixed-size record naming the rule, its numbers and the alternative it rejected, into a small lock-free ring the kernel renders at /proc/decisions. Without the `on` feature `record` is empty."

[dependencies]
azos_limits = { workspace = true }

[features]
# Kernel feature `decisions` (Kconfig DECISION_RECORDS). Off: `record` compiles to nothing.
on = []
