[package]
name = "azos_decision"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Explainable decision records (Kconfig DECISION_RECORDS_DEV, DECISION_REFUSALS_DURABLE): admission, placement and refusal paths write one fixed-size record naming the rule, its numbers and the alternative it rejected, into the record substrate's decision ring (azos_records), which the kernel publishes in its introspection tree's admin region and logd reads. Refusals, and capability denials under a per-subject rate limit (DECISION_DENY_DURABLE_PER_SEC), also go to a durable sink the kernel installs. Without the `on` and `durable` features `record` is empty."

[dependencies]
azos_common = { workspace = true }
azos_limits = { workspace = true }
azos_records = { workspace = true, optional = true }

[features]
# Kernel feature `decisions` (Kconfig DECISION_RECORDS_DEV): the ring.
on = ["dep:azos_records"]
# Kernel feature `decisions-durable` (Kconfig DECISION_REFUSALS_DURABLE): a
# refusal also goes to the durable sink. Independent of `on`. Neither feature:
# `record` compiles to nothing.
durable = []
# Host canary (decisions-tests), never in a real build: a memory kill writes no record.
mem-kill-unrecorded-canary = []
