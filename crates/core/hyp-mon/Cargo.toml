#
# The resident monitor (VIRT_SPLIT): a separately linked flat image, not a
# workspace member. It is built by `mk/` (hyp-mon-<isa>), objcopy'd flat and
# `.incbin`'d into the kernel's `.hyp` section. Its own `[workspace]` keeps it
# out of the kernel's build graph, so a monitor reference to a kernel symbol is
# a link error, not a review item. Its dependencies are the ISA-neutral ABI and
# the RustCrypto crates azos_crypto's SHA-256/HMAC/HKDF sources are built on.
[package]
name = "azos_hyp_mon"
version = "0.1.0"
edition = "2021"
description = "AzOS resident monitor (EL2 on aarch64): host stage-2, PSCI filter, self-protection"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[workspace]

[[bin]]
name = "hyp-mon"
path = "src/main.rs"

[dependencies]
azos_hyp_api = { path = "../hyp-api" }
digest = { version = "0.10", default-features = false, features = ["core-api"] }
sha2 = { version = "0.10", default-features = false, features = ["compress", "force-soft"] }

[features]
# One variant per gate canary: each removes exactly one mechanism so its row
# turns red. Built by the monitor's make target (HYP_MON_FEATURES), never named
# in a kernel cargo build.
hyp-mmu-off-canary = []
hyp-no-secondary-init-canary = []
hyp-hole-mapped-canary = []
hyp-tsc-off-canary = []
hyp-text-rw-canary = []
hyp-text-site-skip-canary = []
hyp-guard-skip-canary = []
hyp-pin-off-canary = []
hyp-kdf-salt-canary = []
hyp-smmu-window-canary = []
hyp-its-window-canary = []
hyp-rd-open-canary = []
hyp-its-skip-mapti-canary = []

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
