[package]
name = "azos_trace"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The kernel event tracer (Kconfig KTRACE): per-CPU lock-free record rings in one shared region, a runtime class mask and the tracepoints. Below sched, ipc and syscall: depends only on the ring layout, the ABI, the Kconfig constants and, on an x86_64 kernel, the arch crate (the CPU id and the scaled TSC clock)."

[dependencies]
azos_abi    = { workspace = true }
azos_rings  = { workspace = true }
azos_limits = { workspace = true }
azos_percpu = { workspace = true }

# x86_64's CPU id (`%gs:0`) and clock (the TSC scaled to TIMER_FREQ).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
azos_arch_x86_64 = { path = "../arch-x86_64" }

[features]
# Gate canary: the producer never advances its head, so every record lands
# on one slot and a reader sees one record per ring; `trace: tracectl reads
# live` must fail.
producer-canary = ["azos_rings/trace-producer-canary"]
