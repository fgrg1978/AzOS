[package]
name = "azos_energy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Energy-aware scheduling: utilisation tracking, the energy model and the scheduler seams. Pure no_std, host-tested in tests/host/energy-tests."

[lib]
name = "azos_energy"

[features]
# Gate canary (the E2 QEMU row): `EnergyModel::validate` accepts every
# model, so the smoke's `refuse` check (an invalid model must be refused and
# fall back to none) must print FAIL. Never in a real build.
validate-canary = []
# Host canaries for the E3/E4 invariants (tests/host/energy-tests): each
# removes one floor, and the named invariant test must fail. Never in a real
# build. I1: `DeadlineFloor` ignores the admitted reservations. I6: the WCET
# floor is the slowest OPP. I3: the idle choice ignores the real-time slack.
i1-canary = []
i6-canary = []
i3-canary = []
# Host canary for the real-time CPU rule (tests/host/energy-tests): `idle::allowed`
# keeps the states that lose the CPU's context for a CPU with real-time state,
# and the test that a real-time CPU never picks one must fail. Never in a real
# build.
rt-powerdown-canary = []
# Host canaries for the policy limits (tests/host/energy-tests): each removes
# one enforcement. pl-floor: the OPP-range setter ignores the safety and
# deadline floors. pl-clamp: the evaluation-time clamp lets the user's cap
# lower the floors. pl-record: a refusal leaves no record. Never in a real
# build.
pl-floor-canary = []
pl-clamp-canary = []
pl-record-canary = []
# Host canaries for the limits added with the power service's ring-3 policy
# (tests/host/energy-tests, power_ring3): pl-limit removes the floors and
# structural checks of the power-cap, parking and QoS setters; pl-reserve never
# holds the battery reserve at the charge. Never in a real build.
pl-limit-canary = []
pl-reserve-canary = []
# pl-stale: a report never goes stale, so a service that stopped reporting
# leaves its last charge in force.
pl-stale-canary = []
# Host canary for the thermal cap (tests/host/thermal-tests): `Thermal::limit`
# lowers the OPP below the deadline and safety floors, and the floor
# invariant test must fail. Never in a real build.
thermal-floor-canary = []
# Host canary for the firmware-derived table (tests/host/energy-tests,
# `firmware`): `EnergyModel::from_clock_range` makes a table of a degenerate
# range, and ends it on the step grid instead of at the firmware's maximum.
# Never in a real build.
firmware-model-canary = []
# Host canaries for the governor's apply assertion (tests/host/energy-tests,
# `apply`): apply-canary makes `opp::check_applied` take every answer of the
# actuator, a refusal included, as applied; apply-overdue-canary makes
# `opp::apply_overdue` never fire, so a choice no apply step answers is never
# reported. The named tests must fail. Never in a real build.
apply-canary = []
apply-overdue-canary = []

[dependencies]
azos_abi = { workspace = true }
# `dt.rs` turns the raw operating-points-v2 / idle-states tables that
# `azos_dtb::dtb_energy` extracts into an `EnergyModel`. The DTB crate has
# no dependencies of its own, so this closes no cycle.
azos_dtb = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("azos"))'] }
