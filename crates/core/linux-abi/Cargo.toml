[package]
name = "azos_linux_abi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The Linux personality's pure half: Linux syscall numbers, errno mapping, the wire layouts the translation writes (stat, dirent64, termios, utsname, the initial stack) and the native numbers each Linux call reaches. No kernel state; the translation itself is crates/core/syscall/src/linux.rs."

[dependencies]
azos_abi = { path = "../abi" }
azos_image = { path = "../image" }

[features]
# Gate canary (K2): writev makes one write per iovec again, so another
# writer can land between two segments; the writev atomicity host test and
# the Linux personality row fail.
writev-per-segment-canary = []
# Gate canary (ns-asid): the in-kernel table takes riscv64's layouts on
# x86_64 again, so a Linux row the ring-3 runtime does not host is admitted
# and mistranslated; `x86_64_has_no_in_kernel_table` fails.
x86-in-kernel-table-canary = []
# Gate canary: `st_size` is the plain cast and `st_blocks` the unchecked sum,
# which overflows for a size near `i64::MAX`; `a_huge_size_does_not_overflow_stat` fails.
stat-size-wrap-canary = []
# Gate canary: the unanswered-call tally counts nothing; `the_tally_counts_each_number` fails.
tally-unrecorded-canary = []
# Gate canary: `rt_sigreturn` restores any program counter, kernel addresses
# included; `a_frame_with_a_kernel_pc_is_not_restored` fails.
sigreturn-pc-unbounded-canary = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("azos"))'] }
