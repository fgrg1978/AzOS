[package]
name = "azos_crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "AZOS crypto primitives. Hand-rolled SHA-256 + AES-128 + X25519 (task #212), the Noise handshakes and the brain link's secure_channel (Noise transport). Ed25519 verify is via the vetted ed25519-dalek crate (no_std) to avoid the HMAC-SHA256 stub trap (task #213)."

[features]
# Boards whose kernel must contain no bit-manipulation instruction at all, not
# even behind runtime detection (VF2: the gate's `vf2: no B extension` row):
# the riscv64 Zbb/Zknh SHA-256 paths are not compiled, the generic one runs.
no-bitmanip = []
# Kconfig `LINK_PROVISIONING_ENFORCED`. The brain link's provisioning hardening: a
# boot without a link key halts, a handshake without seeded entropy is
# refused, the UART bridge is down. Compile-time only, no runtime override:
# same shape as `secure-boot-enforced`. See the module doc of
# src/secure_channel.rs.
link-provisioning-enforced = []
# `Clone` for `CipherState` and `Link`, for the brain-link fuzz target
# (tests/fuzz/brain-link-fuzz): one handshake per process, a copy per input. A
# copy of a live cipher state reuses its nonces, so no kernel or ring-3 build
# enables it.
fuzz-clone = []

[dependencies]
azos_common = { path = "../common" }
# Vetted X25519 + Ed25519 (tasks #212/#213). `default-features = false`
# strips std + rand_core; we only need the verifier + scalar-mult paths
# which are pure no_std.
curve25519-dalek = { version = "4", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# The symmetric primitives: the RustCrypto crates the ring-3 TLS/QUIC stack
# links (userspace/lib/quic), no_std and without alloc.
chacha20 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
ctr = { version = "0.9", default-features = false, features = ["zeroize"] }

# Bare metal (the kernels, the resident monitor): sha2's portable backend.
# On x86_64 it would otherwise run SHA-NI / AVX2 picked from CPUID at CPL0,
# where the kernel keeps no SIMD state; ed25519-dalek's SHA-512 included.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(chacha20_force_soft)', 'cfg(poly1305_force_soft)', 'cfg(aes_force_soft)'] }
