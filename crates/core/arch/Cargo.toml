[package]
name = "azos_arch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "target_arch facade: re-exports the ISA crate of the build (azos_arch_riscv64, azos_arch_aarch64 or azos_arch_x86_64); the kernel reaches its ISA only through it."

[lib]
name = "azos_arch"

# The riscv feature flags (rvv) are forwarded so existing kernel
# Cargo.tomls that turn them on via azos_arch still affect the
# underlying impl.
[features]
rvv     = ["azos_arch_riscv64/rvv"]
# Board selection for the PLIC (riscv64 only; no effect on the other ISAs).
vf2     = ["azos_arch_riscv64/vf2"]
k1      = ["azos_arch_riscv64/k1"]
# ITS canary: the ITS skips MAPTI, so a device's MSI never
# becomes an LPI (aarch64 only: the dependency is target-specific, so a riscv64 build never compiles it).
its-skip-mapti = ["azos_arch_aarch64/its-skip-mapti"]
tlb-local-only = ["azos_arch_riscv64/tlb-local-only", "azos_arch_aarch64/tlb-local-only", "azos_arch_x86_64?/tlb-local-only"]
tlb-bound-canary = ["azos_arch_riscv64/tlb-bound-canary"]
# One-clock canary: CNTVOFF_EL2 left nonzero at the EL2 drop (aarch64 only).
cntvoff-canary = ["azos_arch_aarch64/cntvoff-canary"]
# tls-hygiene / el0-state-audit canary: the EL0-visible per-PE state keeps a
# stand-in for its UNKNOWN reset value (aarch64 only, `sysregs::init_el0_state`).
el0-state-canary = ["azos_arch_aarch64/el0-state-canary"]
# Kconfig HV: keep EL2 at the boot drop and run guests (aarch64 only; the
# dependency is target-specific, so the other ISAs never see it).
hv = ["azos_arch_aarch64/hv"]
# Masked-window tracer (Kconfig `LAT_TRACE`): hooks in both ISA crates.
lat-trace = ["azos_arch_riscv64/lat-trace", "azos_arch_aarch64/lat-trace"]
irq-nomem-canary = ["azos_arch_riscv64/irq-nomem-canary", "azos_arch_aarch64/irq-nomem-canary"]
# The x86_64 crate as the host-side fake ISA (off x86_64 its contract
# methods are todo!()): host checks only, never a kernel build. On a
# bare-metal x86_64 target the real port is selected without the feature.
stub = ["dep:azos_arch_x86_64"]

# Per-target_arch deps: each is only pulled in for builds whose
# target arch matches, so a kernel build compiles one ISA crate.
[target.'cfg(target_arch = "riscv64")'.dependencies]
azos_arch_riscv64 = { workspace = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
azos_arch_aarch64 = { workspace = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
azos_arch_x86_64 = { path = "../arch-x86_64" }

[dependencies]
azos_arch_x86_64 = { path = "../arch-x86_64", optional = true }
