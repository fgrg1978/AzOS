[package]
name = "azos_abi"
version = "1.0.0"
edition = "2021"
description = "AZOS frozen ABI — syscall numbers, error codes, repr(C) types crossing the user/kernel boundary. Stable v1.x."
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
repository = "https://github.com/azos-project/azos"

[lib]
name = "azos_abi"

[dependencies]
# What a crate inside the std build graph (azos_stdrt, tools/sdk_std.py) names
# core by; unused everywhere else.
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[features]
default = []
rustc-dep-of-std = ["core"]
