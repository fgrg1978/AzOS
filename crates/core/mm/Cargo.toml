[package]
name = "azos_mm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[dependencies]
azos_percpu = { workspace = true }
azos_abi = { workspace = true }
azos_arch = { workspace = true }
azos_arch_api = { workspace = true }
azos_sync = { workspace = true }
azos_common = { workspace = true }
azos_limits = { workspace = true }
azos_chaos = { workspace = true }
azos_crypto = { workspace = true }
azos_bytepipe = { workspace = true }
azos_decision = { workspace = true }

[features]
# Kconfig KASAN: the sanitizer's hooks and shadow (src/kasan.rs); the kernel is built with -Zsanitizer=kernel-address.
kasan = []
# vsbench diagnostic only (wave 15, SLAB): count and time every kernel heap
# alloc/free by size bucket and by syscall (src/kheap_census.rs). Never shipped.
kheap-census = []
# Canary only (x86_64): the heap's interrupt token says interrupts were on whatever the
# flags were, as it did before it read RFLAGS.IF; ktest `kheap_irq_token_follows_the_interrupt_state`.
kheap-token-canary = []
kheap-guard-hold-canary = []
exec-reclaim-canary = []
# A range unmap holds its frames on the stack, one shootdown per 32 pages;
# `a_release_unmaps_a_region_with_one_shootdown_per_batch` goes red.
unmap-stack-batch-canary = []
# A promotion frees its table after a flush of the block's range;
# `a_promotion_flushes_the_whole_space_before_its_table_goes` goes red.
promote-ranged-flush-canary = []
# The masked-window tracer (kernel `lat-trace`): the heap's size-class cache
# masks interrupts through the arch calls the tracer hooks, not its own asm.
lat-trace = []
# Canaries only (wave 15, SLAB), host rows in tests/host/mm-tests: a slab hands
# a freed object out without unlinking it; objects are carved off alignment.
slab-freelist-canary = []
# Canaries only (L2, physical memory): blocks never merge; a split drops the
# upper half; a cache refill is one frame short; a cache drain loses the
# frames; two frames share a descriptor; the second-to-last COW holder frees.
# Host rows in tests/host/mm-tests must go red.
buddy-merge-canary = []
buddy-split-canary = []
# The buddy lists rotate on the allocation path again (the `buddy rotate` ktest and host row go red).
buddy-rotate-hot-canary = []
# The kernel heap ceiling (KERNEL_HEAP_SIZE) is not checked: the `kheap ceiling` ktest goes red.
kheap-ceiling-canary = []
# A typed cache accepts an object that belongs to another cache (the block's tag is
# not compared): the `kmem cache cross type` ktest goes red.
kmem-cache-cross-type-canary = []
# Boot caches are not filled and sealed on a preloading preset: the `kmem preload` ktest goes red.
kmem-preload-canary = []
# Reaped stack slots are reused without the TLB invalidation on every CPU (the `kstack reuse` ktest goes red).
kstack-reuse-no-shootdown-canary = []
pcp-refill-canary = []
pcp-drain-canary = []
frame-index-canary = []
refcount-canary = []
# Canary only: `free_pages` leaves out the frames a cache refill or flush has in
# flight; ktest `pmm_free_pages_counts_frames_in_flight` goes red.
pmm-inflight-canary = []
# Canary only: the frame budget's charge tests the limit and stores in two steps (host row, tests/host/mm-tests).
budget-racy-charge-canary = []
slab-align-canary = []
# Gate row only (wave 13): `vdso_update` holds its write open longer, so an
# interrupt inside it is all but certain were the write not masked. The
# `vdso: write window` row boots abitest with it.
vdso-write-window = []
# Gate canary only: `set_user_range_exec` maps the module
# text read-write-EXECUTE. `lx: module text W^X` must go red with it on.
lx-wx-canary = []
# Gate canary only (wave 13): a fork marks read-only and executable pages
# copy-on-write again, so a store to one gets a writable copy that keeps its
# execute bit. The `wx:` abitest checks must go red with it on.
cow-ro-canary = []
# Gate canary only (wave 14, FORKSPAWN): a fork's child takes the parent's
# committed-page counter instead of counting its own pages, so a page a
# sibling thread commits during the fork is left out of the child's charge.
fork-commit-race-canary = []
# Host-suite canary: `aspace::destroy` leaves the space's records in the
# object, so the next space made from it starts with them: `syscall-tests`'
# `aspace_life` fails.
as-stale-root-canary = []
# Host-suite and gate canary: a fault on an anonymous page believes the page's
# leaf over its object's slot (`slot::resolve`): a leaf over an empty slot is
# taken as resident and a compressed page comes back as zeros. Red:
# `syscall-tests` pte_truth.rs, `mm-tests` marker_pte.rs, the ktest
# `anon_fault_decides_from_the_slot_not_the_leaf`.
mm-pte-truth-canary = []
# Host-suite canary: an anonymous fault takes a block leaf's word (a promoted
# block's) for the page's own 4 KiB leaf and installs one into it:
# `syscall-tests` thp_vmm.rs `a_fault_on_a_promoted_block_leaves_its_leaf_alone` fails.
fault-block-leaf-canary = []
# Host-suite canary: the reclaimer's failed store writes the page's leaf back
# before it looks at the slot, so a range unmapped meanwhile gets a leaf on a
# frame about to be freed: `mm-tests` marker_pte.rs
# `a_failed_store_writes_no_leaf_for_a_slot_that_is_not_its_own` fails.
keep-leaf-first-canary = []
# Host-suite canary: a fork's hold on its parent ends with the walk, before the
# child's mappings are cloned, so a sibling's restore or the reclaimer's store
# runs while the markers are copied: `syscall-tests` pte_truth.rs fork rows fail.
fork-hold-canary = []
# Host-suite canary: a demand reservation (`brk`) is written over a page of a
# mapping, whose state is its object's slot: `syscall-tests` pte_truth.rs
# `a_heap_reservation_skips_the_pages_of_a_mapping` fails.
demand-over-mapping-canary = []
# Host-suite canary: `SpaceRef::lock` does not compare the root, so a reference
# kept past its space's end reaches the next space made from the object:
# `syscall-tests`' `aspace_life` fails.
as-stale-ref-canary = []
# Host-suite canary: `SpaceRef::lock` compares the root, not the generation, so
# a reference kept past its space reaches the next space made from the same
# object over the same root: `syscall-tests`' `aspace_life` fails.
as-gen-unchecked-canary = []
# Host-suite canary: a space's pool key is its object alone, so a store that
# outlived its space lands on the next space's entry: `syscall-tests`'
# `aspace_life` (compressed pool on) fails.
as-key-no-gen-canary = []
# Host-suite canary (front uaccess-pin): `uaccess::wait_readers` returns at
# once, as before the access sections; `syscall-tests`' `uaccess_race` fails.
uaccess-race-canary = []
# Canary (front t1-reclaim-fixes): `pager`'s fault walks with a table refusable
# like any other, so a touch of a reserved page at the Domain's limit dies for
# its table: `syscall-tests`' `table_promised` fails.
table-refusable-canary = []
# Canary (front uaccess-mmio-buffer): `vmm::kernel_reaches` answers `true`,
# so a user device window passes the user walk again: `syscall-tests`'
# `uaccess_mmio` and ktest `uaccess_refuses_a_user_device_window` fail.
uaccess-mmio-canary = []
# Canary only (wave 14, DEMANDPAGE): the fault path never asks the region
# pagers, so the first touch of a demand-paged `mmap` page kills the task
# (and a kernel copy into one fails). Host rows in syscall-tests must go red.
demand-region-canary = []
# Gate canary only (wave 14): a fork leaves the parent's demand markers out
# of the child again, so a child's first touch of a reserved page (a `brk`
# heap page it never touched) kills it.
fork-demand-canary = []
# Gate canary only (wave 14): a COW break always copies, also when the
# breaking task is the frame's last holder.
cow-reuse-canary = []
# A store fault on a COW page another thread already broke answers
# "not COW" (the trap kills the thread), as before CTXHUNT.
cow-spurious-canary = []
# Canary only (wave 14, SPAWNCACHE): the verified-image cache shares every
# page of a kept image, writable data included (`image_frames.rs`). The
# syscall-tests shared-text rows must go red.
image-share-all-canary = []
# Gate canary only (wave 14, security): adding write to a read-only leaf whose
# frame another space maps sets the bit again (`vmm::rewrite_leaf_write`), so a
# fork child's mprotect(RW) writes its parent's page. The `linux: fork child
# mprotect` rows and syscall-tests `mprotect_shared` must go red.
mprotect-shared-canary = []
vdso-write-canary = []
# Canary only (Kconfig PMM_TYPE_ZONES): `pmm::free` drops a zoned frame's tag and
# gives it to the cache and the buddy lists, so a freed page-table frame is
# handed out as a general page. Host rows in tests/host/mm-tests and the
# kernel's `mm_zone_no_cross_type_reuse` ktest must go red.
zone-share-canary = []
# A `ktest` kernel runs the frame zones whatever Kconfig PMM_TYPE_ZONES says
# (as LOCKDEP_KTEST does for lockdep): `mm_zone_no_cross_type_reuse` and its
# canary row need them on in the gate's ktest build.
ktest = []
# Canary only (Kconfig MM_SWAP_BACKEND): the swap-out storm asks the pool for a
# segment as if no Domain were pinned. Host rows in tests/host/mm-tests (swap.rs).
swap-pinned-canary = []
# Canary only (MM_SWAP_BACKEND): `swap_in` hands the segment on without
# comparing its tag. The tamper rows in tests/host/mm-tests (swap.rs) must go red.
swap-verify-canary = []
# Gate canaries of the reclaim rows (kernel features of the same name):
# a segment leaves unencrypted; a restored page has one bit changed; a locked
# Domain's storm starts.
swap-plain-canary = []
restore-flip-canary = []
storm-ignore-locked-canary = []
# A storm cut short by a full pool does not go on below the high watermark
# (host row, tests/host/mm-tests).
storm-no-resume-canary = []
# A store takes the last resident slot, which a restore wrote a segment out for.
swap-no-restore-slot-canary = []
# A swap step told Busy rings the faults that wait for a step to end.
swap-busy-rings-canary = []

# MemObj host canaries (tests/host/ipc-tests, syscall-tests): each puts one
# hole back so the test that guards it goes red. Never in a real build.
memobj-move-keeps-map-canary = []
memobj-share-no-narrow-canary = []
memobj-charge-stays-canary = []
memobj-protect-max-canary = []
memobj-cow-no-break-canary = []
memobj-no-kernel-map-canary = []
memobj-anon-uncharged-canary = []
memobj-refcount-wrap-canary = []
memobj-sweep-no-hook-canary = []
memobj-sweep-no-retain-canary = []
memobj-sweep-every-domain-canary = []
memobj-purge-held-canary = []
memobj-purge-kernel-held-canary = []
memobj-purge-locked-canary = []
# Front futex-shm-word: a futex's shm word is used with the table unlocked
# (the frame may change owner under it), and a new mapping leaves a cached
# "no mapping" answer standing.
memobj-word-unlocked-canary = []
memobj-word-spin-canary = []
memobj-resolve-stale-canary = []
# Front memobj-multihart: the futex paths' lookups hold the region table for
# a few thousand spins more, a lock that serialises futex calls. Its user is
# the `scale` lanes (tools/vsbench_*.sh VSBENCH_AZOS_EXTRA_FEATURES): their
# host-timed `over floor` did not move with it on a shared host (see their
# section comment). Never in a real build.
memobj-hold-canary = []
# A map or unmap in flight (its leaves exist, its record does not say so) does
# not count for a clone, a break, a release or a purge.
memobj-map-unrecorded-canary = []
# A fork child's copied leaves do not count for a clone before its booking.
memobj-inherit-unmarked-canary = []
# Front memobj-multihart: the resolution cache keeps one answer a process, so a
# shm word and a private word evict each other's
# (a_process_alternating_a_shm_word_and_a_private_word_keeps_both_answers).
memobj-resolve-one-answer-canary = []
