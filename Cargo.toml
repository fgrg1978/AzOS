[workspace]
resolver = "2"
exclude = [
    "userspace/services/brain_client",
    "userspace/services/reflex",
    # uhello — minimal Rust user-space ELF (E11.AQ3 phase-1 de-risk).
    "userspace/tests/uhello",
    # gpio_drv — userspace GPIO driver process (E11.AQ3).
    "userspace/drivers/gpio_drv",
    # infsrv — ring-3 inference service: the broker behind the Infer interface,
    # and the behavior task's MLP (it replaced mlsrv; the image is MLSRV.ELF).
    "userspace/services/infsrv",
    # azos_ml — the MLP/GGUF/bundle library infsrv links; no_std, no dependencies.
    "userspace/lib/ml",
    # azos_ualloc — the hardened allocator of native ring-3 programs; no_std.
    "userspace/lib/ualloc",
    # buzz_drv / ina_drv — ring-3 buzzer and INA219 drivers.
    "userspace/drivers/buzz_drv",
    "userspace/drivers/ina_drv",
    # captest — ring-3 capability + syscall ABI test. Asserts both halves:
    # a granted resource works, an ungranted one is still denied.
    "userspace/tests/captest",
    # latbench — ring-3 syscall latency microbenchmark.
    "userspace/bench/latbench",
    "userspace/tests/abitest",
    # ipctest — ring-3 IPC probe: fast-path round trip, server impersonation,
    # and the shm/port/io_ring ownership gates.
    "userspace/tests/ipctest",
    # vsbench — the same ring-3 work measured on Azos and on Linux/riscv64.
    # One shared core, two syscall backends; the binaries differ only in which
    # kernel they call.
    "userspace/bench/vsbench",
    # hello_aarch64 / syscall_test_aarch64 — aarch64 counterparts of hello.S
    # and test.S (phase 6 prep, aarch64 parity). Not members: like every
    # other userspace crate here, each carries its own `[workspace]` marker.
    "userspace/tests/hello",
    "userspace/tests/syscall_test",
    # flight-sim is a host-side (std) test crate — run separately:
    #   cargo test --target aarch64-apple-darwin -p azos_flight_sim
    # It cannot be a workspace member because the workspace target is riscv64-none-elf.
    "tests/host/flight-sim",
    # ota-tests is a host-side test crate for the pure OTA logic (OT01).
    # Run with:  cd tests/host/ota-tests && cargo test
    "tests/host/ota-tests",
    # scsi-tests: the SCSI initiator against the target, CBW/CSW both ways.
    # Run with:  cd tests/host/scsi-tests && cargo test
    "tests/host/scsi-tests",
    # crypto-tests — host-side NIST/RFC vectors for SHA-256, AES-128,
    # X25519. Pins current HMAC-stub sig_verify behaviour until task
    # #212 replaces it with real Ed25519.
    # Run with:  cd tests/host/crypto-tests && cargo test
    "tests/host/crypto-tests",
    # dtb-tests — host-side tests for the Flattened Device Tree parser.
    # Run with:  cd tests/host/dtb-tests && cargo test
    "tests/host/dtb-tests",
    # gguf-tests — host-side tests for the GGUF model-file parser.
    # Run with:  cd tests/host/gguf-tests && cargo test
    "tests/host/gguf-tests",
    # infsrv-tests — host-side tests for the inference service's broker:
    # bundle loading, admission against the signed cost table, the energy
    # quota, receipts and the verdict log.
    # Run with:  cd tests/host/infsrv-tests && cargo test
    "tests/host/infsrv-tests",
    # config-tests — host-side tests for INI parser + runtime atomics.
    # Run with:  cd tests/host/config-tests && cargo test
    "tests/host/config-tests",
    # arch-api-tests — host-side tests for the cross-ISA trait surface
    # + PagePerms constants + arch_name strings. Includes a Stub impl
    # that proves the traits are dyn-compatible and self-consistent.
    # Run with:  cd tests/host/arch-api-tests && cargo test
    "tests/host/arch-api-tests",
    # kaslr-tests — host-side tests for virtual KASLR: slide choice, policy,
    # relocation walk, device-tree seed, the aarch64 layout.
    # Run with:  cd tests/host/kaslr-tests && cargo test
    "tests/host/kaslr-tests",
    # regression-tests pins specific bug fixes so future refactors can't
    # silently reintroduce them. Run with:  cd tests/host/regression-tests && cargo test
    "tests/host/regression-tests",
    # topology-tests is a host-side test crate for the W2 topology parser.
    # Run with:  cd tests/host/topology-tests && cargo test
    "tests/host/topology-tests",
    # abi-tests is a host-side test crate for the W1 ABI freeze.
    # Run with:  cd tests/host/abi-tests && cargo +stable test
    "tests/host/abi-tests",
    # cap-tests pulls crates/core/ipc/src/cap.rs into a host crate so the
    # embedded #[cfg(test)] suite runs on the developer host.
    # Run with:  cd tests/host/cap-tests && cargo +stable test
    "tests/host/cap-tests",
    # actuation-tests: write-ahead receipts (the effect gate over the real
    # flight-recorder ring, with a power-cut model). Run with:
    #   cd tests/host/actuation-tests && cargo test --release
    "tests/host/actuation-tests",
    # fs-tests drives the REAL fat32.rs against hand-built volume images, via a
    # host shim for the RV64-only block device. Same exclusion reason as
    # cap-tests: it depends on std and on a shim crate that shadows a kernel
    # crate name.
    "tests/host/fs-tests",
    # arch-tests pulls the pure halves of arch-riscv64 (Sv39 arithmetic, PMP
    # encoding) via #[path]; the rest of that crate is inline asm.
    "tests/host/arch-tests",
    # x86-platform-tests pulls the pure halves of arch-x86_64 (ACPI tables,
    # PVH boot information, APIC/IOAPIC words, clock scaling) via #[path].
    "tests/host/x86-platform-tests",
    # drivers-tests pulls driver modules via #[path]; their `crate::` paths
    # resolve to the test crate, which provides root-level stand-ins for the
    # MMIO modules.
    "tests/host/drivers-tests",
    "tests/host/drivers-tests/shims/mm",
    "tests/host/drivers-tests/shims/arch",
    # mm-tests covers the physical page allocator; its arch shim re-exports the
    # real Sv39 mmu module rather than stubbing it.
    "tests/host/behavior-tests",
    "tests/host/net-tests",
    "tests/host/behavior-tests/shims/ipc",
    "tests/host/behavior-tests/shims/drivers",
    "tests/host/behavior-tests/shims/robot",
    "tests/host/behavior-tests/shims/robot_sync",
    "tests/host/behavior-tests/shims/ota",
    "tests/host/behavior-tests/shims/fs",
    "tests/host/libsys-tests",
    # relibc-azos-tests — the pure helpers of the relibc platform layer.
    "tests/host/relibc-azos-tests",
    # The user shell's pure modules, and the shell and
    # tool images themselves (each carries its own `[workspace]` marker).
    "tests/host/sh-tests",
    "userspace/services/sh",
    # The Terminal object: its interface, the ring-3 terminal server that
    # owns the console, and the host tests of both.
    "tests/host/term-tests",
    "userspace/lib/term",
    "userspace/services/termd",
    # The compositor's pixel engine (layers, damage, blit/scale, cursor plane)
    # and its host tests; the compositor server links it.
    "tests/host/compose-tests",
    "userspace/lib/compose",
    # The compositor: the Compositor object (userspace/lib/compositor), its
    # ring-3 server (the sole holder of the Display interface, the Secure
    # Attention Key's trusted surface) and the host tests of both.
    "userspace/lib/compositor",
    "userspace/services/compositor",
    "tests/host/compositor-tests",
    # The Names object: its interface, the ring-3 name server that answers
    # the signed rows' imports, and the host tests of both.
    "tests/host/names-tests",
    "tests/host/devif-tests",
    "userspace/lib/names",
    "userspace/services/namesd",
    # The Decisions object (the decision query): its interface, the ring-3
    # decision server and its client tool `why`, and the host tests of all.
    "tests/host/decisions-tests",
    "userspace/lib/decisions",
    # The console login: the Login object (userspace/lib/login), the login
    # service (a ring-3 image with its own [workspace]) and its host suite.
    "userspace/lib/login",
    "userspace/services/logind",
    "tests/host/logind-tests",
    # The introspection tree's ring-3 reader and its host tests (the crate is
    # crates/core/inspect, a member).
    "userspace/lib/inspect",
    "tests/host/inspect-tests",
    "userspace/services/decisd",
    "userspace/services/why",
    # The input server (the Input object: focus is a warrant) and the host
    # tests of its decisions and interface.
    "userspace/services/inputd",
    "tests/host/inputd-tests",
    # Transparent RPC (Phase 9, step 1): the engine, the ring-3 RPC server and
    # the host tests of the engine over two servers.
    "tests/host/rpc-tests",
    "userspace/lib/rpc",
    "userspace/services/rpcsrv",
    "userspace/services/toolbox",
    "userspace/services/power",
    "tests/host/mm-tests",
    "tests/host/percpu-tests",
    "tests/host/trace-tests",
    "tests/host/fb-tests",
    "tests/host/mm-tests/shims/arch",

    # seccomp-tests covers the syscall filter (AQ11). Its `numbers` shim is
    # not a stub: it re-exports the REAL crates/core/syscall/src/numbers.rs so the
    # suite can catch drift against the copies seccomp.rs is forced to keep
    # (azos_syscall depends on azos_sched, so seccomp.rs cannot
    # import them without closing a dependency cycle).
    "tests/host/seccomp-tests",
    "tests/host/seccomp-tests/shims/numbers",
    "tests/host/fs-tests/shims/drivers",
    # sched-policy-tests pulls W4 scheduler sources via #[path] so the
    # policy + APS suites run on the developer host.
    # Run with:  cd tests/host/sched-policy-tests && cargo +stable test
    "tests/host/sched-policy-tests",
    # drv-api-tests exercises the host-compatible
    # `azos_drv_api` crate.
    # Run with:  cd tests/host/drv-api-tests && cargo +stable test \
    #              --target aarch64-apple-darwin
    "tests/host/drv-api-tests",
    # tftp-tests exercises the host-compatible `azos_tftp` crate.
    # Run with:  cd tests/host/tftp-tests && cargo +stable test \
    #              --target aarch64-apple-darwin
    "tests/host/tftp-tests",
    # ethercat-tests: host suite of `azos_ethercat` with a scripted ESC chain model.
    # Run with:  cd tests/host/ethercat-tests && cargo test
    "tests/host/ethercat-tests",
    # flight-math-tests — host-side tests for the pure drone math (D04 trig +
    # wind estimator). Run with:  cd tests/host/flight-math-tests && cargo test
    "tests/host/flight-math-tests",
    # aead-link-tests — host-side cross-side compat pin for the encrypted-link AEAD
    # link. Verifies that frames produced by AzOSRobotBrain/secure_channel.py
    # decrypt correctly with crates/core/crypto::secure_channel.
    # Run with:  cd tests/host/aead-link-tests && cargo +stable test --release
    "tests/host/aead-link-tests",
    # cam-ring-tests — host-side SPSC frame ring tests (S1/S6 multi-stream).
    # Run with:  cd tests/host/cam-ring-tests && cargo +stable test
    "tests/host/cam-ring-tests",
    # rings-tests — host-side tests for azos_rings (Queue, Log), with the
    # compile-fail proof that a second writer cannot be made.
    # Run with:  cd tests/host/rings-tests && cargo test --release
    "tests/host/rings-tests",
    # bytepipe-tests — host-side tests for azos_bytepipe (the POSIX byte pipe
    # over a shared byte ring): EOF, EPIPE, O_NONBLOCK, PIPE_BUF, poll, fork.
    # Run with:  cd tests/host/bytepipe-tests && cargo test --release
    "tests/host/bytepipe-tests",
    # hv-tests — host-side tests for azos_hv (the hypervisor core) and for the
    # three ISA glues of azos_arch_api::Hypervisor: stage-2 mapping from MemObj
    # frames, the exit decode, admission of the guest rows, the VM and vCPU objects.
    # Run with:  cd tests/host/hv-tests && cargo test --release
    "tests/host/hv-tests",
    # multi-stream-tests — host-side multi-stream wire format tests.
    # Run with:  cd tests/host/multi-stream-tests && cargo +stable test
    "tests/host/multi-stream-tests",
    # azos-config — build-time Kconfig reader + Rust const emitter.
    # Host-only (std); excluded from riscv64-none-elf workspace compilation.
    # Run with:  cd crates/core/azos-config && cargo test
    "crates/core/azos-config",
    # RT7 panic-policy predicate tests (host-only).
    "tests/host/panic-policy-tests",
    # wcet-macro — proc-macro for #[wcet(N_us)] WCET budget annotations.
    # Host-only (proc-macro); excluded from riscv64-none-elf workspace compilation.
    # Run with:  cd crates/core/wcet-macro && cargo test
    "crates/core/wcet-macro",
    # idl / idl-macros — the AzOS IDL (L13): `#[azos_interface]` and its no_std
    # runtime. The macro half is host-built, so both stay out of the riscv64
    # workspace; userspace images depend on `azos_idl` by path (ipctest).
    # Run with:  cd crates/core/idl-macros && cargo test --offline
    #            cd crates/core/idl && cargo +stable test --offline --target aarch64-apple-darwin
    "crates/core/idl",
    "crates/core/idl-macros",
    # libsys-macros — the SDK's `#[azos::main]` and `#[azos::test]`, a proc-macro
    # libsys re-exports. Host-built, so out of the riscv64 workspace.
    # Run with:  cd crates/core/libsys-macros && cargo test --offline
    "crates/core/libsys-macros",
    # stdrt — the std port layer of the native SDK (*-unknown-azos), built into
    # `std` by tools/sdk_std.py; host tests in tests/host/stdrt-tests.
    "crates/core/stdrt",
    # ── Host suites for the IPC subsystem (audit 2026-08-22) ──
    # Same pattern as cap-tests: the whole `azos_ipc` crate does not build
    # for the host (it drags in RV64-only dependencies), so each suite pulls
    # the module it needs with `#[path]` and runs its `#[cfg(test)] mod tests`.
    # Run with:  cd crates/<suite> && cargo test
    "tests/host/ipc-fast-tests",
    "tests/host/ipc-tests",
    "tests/host/sched-wake-tests",
    # syscall-tests pulls crates/core/syscall/src/handlers.rs whole via #[path] --
    # host coverage for the errno_for_*_err functions, cap_kind_for_driver,
    # and socket_access_ok. Same exclusion reason as cap-tests: it depends on
    # std and on shim crates that shadow kernel crate names.
    # Run with:  cd tests/host/syscall-tests && cargo test --release
    "tests/host/syscall-tests",
    # trap-tests pulls kernel/src/trap/{frame,syscall,fault,irq}.rs and
    # crates/core/sched/src/domain.rs unmodified and runs them against fake
    # frames of the three ISAs and a fake kernel.
    # Run with:  cd tests/host/trap-tests && cargo test
    "tests/host/trap-tests",
    "tests/host/trap-tests/shims/mm",
    "tests/host/trap-tests/shims/sync",
    "tests/host/sync-tests",
    "tests/host/sync-tests/shims/arch",
    # pci-tests / dma-tests / iommu-tests — host-side tests for the new
    # crates (crates/drivers/pci, crates/drivers/dma, crates/drivers/iommu),
    # same pattern as drivers-tests: pulled #[path] modules + fakes.
    # Run with:  cd crates/<name> && cargo test --release
    "tests/host/pci-tests",
    # nvme-tests: the NVMe wire protocol (crates/drivers/nvme). Run with:
    #   cd tests/host/nvme-tests && cargo test --release
    "tests/host/nvme-tests",
    "tests/host/lx-loader-tests",
    # The Linux layer (GPL-2.0-only): never a member, so no workspace build
    # can link it into the kernel or a dual-licensed image.
    "lx/emul",
    "tests/host/dma-tests",
    "tests/host/iommu-tests",
    "tests/host/tpm-tests",
    # soc-tests / compmgr-tests: host suites; compmgr is a ring-3 image with its own [workspace].
    "tests/host/soc-tests",
    "tests/host/compmgr-tests",
    # cfi-tests: the hardware CFI layer (Kconfig flags, landing pads, key mix).
    "tests/host/cfi-tests",
    # zenohd: the Zenoh gateway, a ring-3 image with its own [workspace]; zenohd-tests is its host suite.
    "userspace/services/zenohd",
    "tests/host/zenohd-tests",
    "userspace/services/compmgr",
    "tests/host/shell-tests",
    # linux-abi-tests: the Linux personality's pure half.
    # Run with:  cd tests/host/linux-abi-tests && cargo test --release
    "tests/host/linux-abi-tests",
    # linux-rt-tests: the Linux personality's ring-3 runtime.
    # Run with:  cd tests/host/linux-rt-tests && cargo test --release
    "tests/host/linux-rt-tests",
    # ualloc-tests: the hardened ring-3 allocator (userspace/lib/ualloc).
    # Run with:  cd tests/host/ualloc-tests && cargo test --release
    "tests/host/ualloc-tests",
    # stdrt-tests: the std port layer of the native SDK (crates/core/stdrt).
    # Run with:  cd tests/host/stdrt-tests && cargo test --release
    "tests/host/stdrt-tests",
    # sdktest: the SDK's own test, a std program for *-unknown-azos; built by
    # `make sdk` (tools/sdk_cargo.py), never by the root workspace.
    "tests/sdk/sdktest",
    # energy-tests — crates/core/energy, the SCHED.TOML energy sections and
    # the DTB energy tables. Run with:  cd tests/host/energy-tests && cargo test --release
    "tests/host/energy-tests",
    # pkg / pkg-tests — signed application packages: the container,
    # verification against the topology's signers and admission as a topology
    # delta; the ring-3 installer (userspace/services/pkgd) links it by path.
    # Run with:  cd tests/host/pkg-tests && cargo test --offline
    "crates/core/pkg",
    "tests/host/pkg-tests",
    # TLS in ring 3 (userspace/lib/tls): certificate pinning over loopback TCP.
    # Run with:  cd tests/host/tls-tests && cargo test --release --offline
    "tests/host/tls-tests",
    # ptpd: the PTP slave, a ring-3 image with its own [workspace]; ptpd-tests is its host suite.
    "userspace/services/ptpd",
    "tests/host/ptpd-tests",
    # audiod: the audio server, a ring-3 image with its own [workspace]; audiod-tests is its host suite.
    "userspace/services/audiod",
    "tests/host/audiod-tests",
    # quic / rpcquic: QUIC in ring 3 for the RPC link (std crates, built through
    # tools/sdk_cargo.py); quic-tests is the host suite.
    "userspace/lib/quic",
    "userspace/services/rpcquic",
    "tests/host/quic-tests",
    # mcpd: the MCP bridge, a ring-3 image with its own [workspace]; mcpd-tests is its host suite.
    "userspace/services/mcpd",
    "tests/host/mcpd-tests",
    # sshd: the SSH server, a ring-3 image with its own [workspace]; sshd-tests is its host suite.
    "userspace/services/sshd",
    "tests/host/sshd-tests",
    # vmmd: the virtual-machine monitor, a ring-3 image with its own [workspace]; vmmd-tests is its host suite.
    "userspace/services/vmmd",
    "tests/host/vmmd-tests",
    # Zenoh 1.x wire codec and MCP/JSON-RPC shapes: no_std libraries and their
    # host suites, built on their own.
    "tests/host/zenoh-tests",
    "userspace/lib/zenoh",
    "tests/host/mcp-tests",
    "userspace/lib/mcp",
    # The Packages object (the installer's interface and pure half) and the
    # ring-3 installer that serves it.
    "userspace/lib/packages",
    "userspace/services/pkgd",
    # AzOS-micro, the MCU kernel: a riscv32 M-mode image in a workspace of its
    # own (`make micro`), and the host suite that drives it over a fake machine.
    # Run with:  make micro-test
    "micro",
    "tests/host/micro-tests",
    # thermal-tests: the thermal framework (crates/core/energy::{thermal,opp},
    # crates/drivers/{thermal,firmware}, the DTB thermal-zones reader).
    # Run with:  cd tests/host/thermal-tests && cargo test --release
    "tests/host/thermal-tests",
    # usb-tests: the USB host (xHCI + core + hubs + class interface) against a
    # register-level xHCI mock. Run with:
    #   cd tests/host/usb-tests && CARGO_TARGET_DIR=~/azos-out/usb-tests cargo test --release --target aarch64-apple-darwin
    "tests/host/usb-tests",
    # usb-hid-tests: the HID class driver (report descriptor parser, decoder,
    #   authorization, the driver over the xHCI mock of usb-tests). Run with:
    #   cd tests/host/usb-hid-tests && CARGO_TARGET_DIR=~/azos-out/usb-hid-tests cargo test --release --target aarch64-apple-darwin
    "tests/host/usb-hid-tests",
    # usb-cdc-tests: the CDC class drivers (ECM, NCM with its NTB-16 parser, ACM
    #   as a Uart), the kernel's NIC adapter, over the xHCI mock of usb-tests.
    #   Run with:
    #   cd tests/host/usb-cdc-tests && CARGO_TARGET_DIR=~/azos-out/usb-cdc-tests cargo test --release --target aarch64-apple-darwin
    "tests/host/usb-cdc-tests",
]
members = [
    "kernel",
    "crates/core/abi",
    # The Linux personality's pure half (numbers, layouts).
    "crates/core/linux-abi",
    "crates/core/topology",
    "crates/core/common",
    "crates/core/arch",
    "crates/core/sync",
    "crates/core/percpu",
    "crates/drivers/base",
    "crates/drivers/irqchip",
    "crates/drivers/sys",
    "crates/drivers/gpio",
    "crates/drivers/bus",
    "crates/drivers/hwbus",
    # The native USB host: xHCI, the USB core, the class-driver interface.
    "crates/drivers/usb",
    # The USB HID class driver: keyboards and mice on the USB host.
    "crates/drivers/usb-hid",
    "crates/drivers/input",
    "crates/drivers/virtio",
    "crates/drivers/block",
    "crates/drivers/net",
    "crates/drivers/sensor",
    "crates/drivers/actuator",
    "crates/drivers/npu",
    "crates/drivers/power",
    "domains/robot/drivers",
    "crates/core/mm",
    "crates/core/sched",
    # Utilisation tracking, energy model, scheduler energy seams.
    "crates/core/energy",
    "crates/core/syscall",
    "crates/fs/fs",
    "crates/net/net",
    "crates/core/ipc",
    "domains/robot/robot",
    "crates/core/recovery",
    "domains/robot/bench",
    "crates/drivers/camera",
    "crates/drivers/display",
    "crates/drivers/fb",
    "crates/core/config",
    "crates/drivers/imu",
    "crates/drivers/baro",
    "crates/drivers/dtb",
    # Thermal framework: the Raspberry Pi VideoCore mailbox and the runtime
    # that joins azos_energy::thermal to a board's sensor and clock.
    "crates/drivers/firmware",
    "crates/drivers/thermal",
    "domains/robot/behavior",
    "crates/core/channel",
    "crates/core/rings",
    "crates/core/bytepipe",
    "crates/core/hv",
    "domains/robot/ahrs",
    "crates/drivers/gps",
    "domains/robot/flight",
    # Pure no_std drone math (D04 trig + wind), host-tested via flight-math-tests.
    "domains/robot/flight-math",
    "domains/robot/telemetry",
    "domains/robot/nav",
    "crates/core/libsys",
    "crates/core/ota",
    "crates/core/crypto",
    "crates/core/trace",
    "crates/core/ktest",
    "crates/core/chaos",
    "crates/core/decision",
    # The introspection tree: the format, the kernel's writer, the reader.
    "crates/core/inspect",
    # The interfaces of what the kernel hosts and of what a driver endpoint serves (D6 A).
    "crates/core/devif",
    "crates/drivers/driver_server",
    # Driver framework API surface (host-testable, no riscv deps).
    "crates/drivers/api",
    "crates/drivers/ina219",
    "crates/drivers/buzzer",
    "crates/drivers/pcspk",
    # RFC 1350 TFTP client: the package installer's development package source
    # (userspace/services/pkgd) and the host suites build it by path.
    "crates/net/tftp",
    # EtherCAT master codec, AL sequencer and DC arithmetic (pure no_std; user: ECAT-CYCLIC).
    "crates/net/ethercat",
    # SCSI over USB Bulk-Only Transport, target and initiator (USB mass-storage host).
    "crates/drivers/scsi",
    # Cross-ISA arch trait surface (B0 — Phase 2 prep for aarch64/x86_64).
    "crates/core/arch-api",
    # B1 — aarch64 ISA impl. Real code is cfg(target_arch="aarch64");
    # on the workspace's riscv64 target this builds as essentially empty.
    # Item 2 Stage 1/2 — riscv64 ISA impl moved out of crates/core/arch;
    # crates/core/arch is now a per-target_arch facade re-exporting one of
    # the per-ISA crates (arch-riscv64, arch-aarch64).
    "crates/core/arch-riscv64",
    # aarch64 (baseline: Kconfig AARCH64_LEVEL). Compiles to near-nothing on
    # riscv64; `tools/ci_check.sh` builds and tests it for aarch64 so it cannot
    # rot unnoticed the way the parked copy did for a month.
    "crates/core/arch-aarch64",
    # S1/S6 — lock-free SPSC camera frame ring for zero-copy pipelines.
    # Pure no_std; host-tested via tests/host/cam-ring-tests.
    "crates/drivers/cam-ring",
    # Stream-ID-prefixed wire multiplexer for the brain↔kernel link.
    # Pure no_std; host-tested via tests/host/multi-stream-tests.
    "crates/net/multi-stream",
    # Generated compile-time constants from .config.
    # no_std; build.rs reads .config via azos-config and emits generated.rs.
    "crates/core/limits",
    # Degrade taxonomy + speed-ceiling mapping. Dep-free leaf crate;
    # owned here so both ipc (TCB) and behavior (safety domain) can depend on it
    # without putting motor policy in the TCB.
    "domains/robot/degrade-policy",
    # The actuation safety path (gate, e-stop seams, rt-motor,
    # sys-wdt, flight-ctrl, I-13, WDT feed), out of the kernel composition root.
    "domains/robot/safety-core",
    # Wave 11 (DOMAIN): the actuation authority every domain shares (e-stop
    # latch, release authority, flight recorder, sys-wdt), out of the robot
    # crates so a non-robot image keeps it.
    "crates/core/actuation",
    # Native PCI/ECAM enumeration (bus 0, MSI/MSI-X
    # capability parse, BAR sizing). no_std, host-tested via tests/host/pci-tests.
    "crates/drivers/pci",
    "crates/drivers/nvme",
    # DMA mapping API (map/unmap single,
    # bounce decision). no_std, host-tested via tests/host/dma-tests.
    "crates/drivers/dma",
    # Minimal IOMMU support (RISC-V IOMMU + SMMUv3
    # device-context/fault-record encode-decode). no_std, host-tested via
    # tests/host/iommu-tests.
    "crates/drivers/iommu",
    # TPM 2.0 driver core (TIS over MMIO/SPI, commands, rollback floor); no_std,
    # host-tested via tests/host/tpm-tests. Kernel user: kernel/src/boot/tpm.rs (Kconfig TPM).
    "crates/drivers/tpm",
    # SoC frameworks (clock, reset, regulator, power domain, pin control, DT reader);
    # no_std, host-tested via tests/host/soc-tests. Kernel consumer: boot/soc.rs (SOC_FRAMEWORKS).
    "crates/drivers/soc",
    # Real-time clocks (goldfish, PL031, MC146818, PCF8563); no_std, pure, host-tested via
    # tests/host/drivers-tests. Kernel consumer: boot/rtc.rs (Kconfig DRV_RTC).
    "crates/drivers/rtc",
    # The relocatable-module loader the Linux server uses.
    # no_std, no Linux code; host-tested via tests/host/lx-loader-tests.
    "crates/core/lx-loader",
]

