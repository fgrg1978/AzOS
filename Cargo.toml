[profile.release]
opt-level = 2
debug = true       # Keep debug info for GDB
# LTO breaks global_asm sometimes. ALSO load-bearing for correctness:
# `cap_store::resolve_only_untrusted` (crates/core/ipc/src/cap_store.rs) relies on
# its two `idx_for_tid` scans surviving as two distinct scans — verified on
# the release artifact under lto = false. Enabling LTO could let the compiler
# CSE the confirmation pass into nothing; re-audit that function before
# flipping this.
lto = false
panic = "abort"
overflow-checks = true   # Detect integer overflow at runtime (safety > speed)

[profile.dev]
opt-level = 1      # Some optimization even in debug (kernel needs it)
panic = "abort"
