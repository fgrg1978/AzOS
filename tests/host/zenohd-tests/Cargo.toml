[package]
name = "azos_zenohd_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the Zenoh gateway (userspace/services/zenohd): its engine and its key rule, pulled in with #[path] so the code under test is the code ZENOHD.ELF is built from, driven by a scripted router (the handshake, the declarations, a query that becomes a warrant-guarded IDL op and is answered with the kernel's receipt, a refused op that is answered with the refusal receipt, the decision records published as topics) over a model of the kernel's decision journal behind the real Decisions interface. Excluded from workspace."

# Run with:  cd tests/host/zenohd-tests && cargo test --release

[dependencies]
azos_idl = { path = "../../../crates/core/idl" }
azos_zenoh = { path = "../../../userspace/lib/zenoh" }
azos_decisions = { path = "../../../userspace/lib/decisions" }
# `durable`: the records under test go down the durable path, as in every preset.
azos_decision = { path = "../../../crates/core/decision", features = ["durable"] }

[profile.release]
overflow-checks = true

[workspace]
