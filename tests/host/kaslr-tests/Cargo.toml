[package]
name = "azos_kaslr_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for virtual KASLR (azos_arch_api::kaslr and the aarch64 layout): slide alignment and range, policy outcomes, the relocation walk on a synthetic image, the device-tree seed. Excluded from the workspace like the other *-tests crates."

# Run with:  cd tests/host/kaslr-tests && cargo test

[dependencies]
azos_arch_api = { path = "../../../crates/core/arch-api" }
azos_limits = { path = "../../../crates/core/limits" }
# arch-riscv64/src/mmu.rs (pulled in by path) uses bitflags, arch-x86_64/src/mmu.rs azos_limits,
# as tests/host/arch-tests does.
bitflags = "2"
