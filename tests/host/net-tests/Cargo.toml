[package]
name = "azos_net_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/net/net: TCP, UDP, IP, ARP, IGMP, DHCP, DNS, NTP and sockets, including wire-conformance modules. Excluded from workspace."

# Run with:  cd tests/host/net-tests && cargo test --release

[dependencies]
azos_sync = { path = "../cap-tests/shims/sync", package = "cap_test_sync" }
# Reused rather than duplicated: behavior-tests' drivers shim already has the
# settable clock this needs, and `tcp.rs` reaches for
# `azos_drv_irqchip::clint::get_time()` in six places -- retransmit timing,
# activity deadlines. A wall clock would make the RTO tests measure the host.
beh_test_drivers = { path = "../behavior-tests/shims/drivers" }
# Real crates: TCP_MAX_CONNS sizes the connection table under test, and the
# wcet attribute is on the functions being pulled in.
azos_limits = { path = "../../../crates/core/limits" }
# Real crate, not a shim: it is the wire-format half of TFTP and has its own
# host suite already in the gate, so the client under test parses with the
# kernel's own parser.
azos_tftp = { path = "../../../crates/net/tftp" }
# Real crate: `tcp.rs::generate_isn` (U06-6) calls
# `azos_crypto::entropy::hmac_sha256` directly, so the pulled-in file
# needs the real HMAC-SHA256, not a shim.
azos_crypto = { path = "../../../crates/core/crypto" }
wcet-macro = { path = "../../../crates/core/wcet-macro" }

# Reproduce the kernel's release profile: overflow-checks is exactly what turns
# a non-wrapping sequence comparison into a panic, and these functions exist to
# avoid one.
[profile.release]
overflow-checks = true

# `tcp.rs` carries a `qemu`-gated RX trace probe that the net crate declares as
# a feature. Declared rather than silenced, so the condition stays visible.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("qemu"))', 'cfg(feature, values("arp-timing"))', 'cfg(feature, values("loopback-preempt-probe"))', 'cfg(feature, values("loopback-guard-canary"))', 'cfg(feature, values("tcp-handle-gen-canary"))', 'cfg(feature, values("tcp-ephemeral-port-canary"))', 'cfg(fuzzing)'] }
