[package]
name = "syscall_test_mm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host stand-in for azos_mm, used only by tests/host/syscall-tests. NOT part of the kernel."

[dependencies]
# Kconfig CHAOS sites in the #[path]-pulled sources (off on the host).
azos_chaos = { path = "../../../../../crates/core/chaos" }
# Renamed so the pulled `crates/core/mm/src/*.rs` files' own `use azos_arch::…`
# resolve unchanged.
azos_arch = { path = "../arch", package = "syscall_test_arch" }
# Real crate: `vmm.rs`/`cow.rs`/`demand.rs`/`wx.rs` (pulled by path below)
# type against `azos_arch_api::{Mmu, PagePerms, PAGE_SIZE}` directly
# since the page-table abstraction (B2); pure no_std, host-clean.
azos_arch_api = { path = "../../../../../crates/core/arch-api" }
# Real crates, not shims — same set `tests/host/mm-tests` already builds the real
# `pmm.rs` against on a host target. `azos_limits` is generated from
# `.config`, so `MAX_PAGES` cannot drift from the kernel's.
azos_common = { path = "../../../../../crates/core/common" }
azos_limits = { path = "../../../../../crates/core/limits" }
azos_sync = { path = "../../../cap-tests/shims/sync", package = "cap_test_sync" }
# Real, pure, host-buildable, zero deps of its own -- `vdso.rs` (pulled
# below) re-exports `azos_abi::vdso::VDSO_USER_BASE` (2026-09-22 vDSO
# placement fix) rather than declaring its own constant.
azos_abi = { path = "../../../../../crates/core/abi" }

[lints.rust]
# `pmm.rs` carries a `small-mem` cfg the `mm` crate declares as a feature;
# echoed here rather than silenced so the condition stays visible. Same
# reasoning, same line, as `tests/host/mm-tests/Cargo.toml`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("small-mem"))', 'cfg(feature, values("no-mmu"))'] }

[features]
# Mirrors azos_mm's gate canary so `cfg(feature = "lx-wx-canary")` in
# the #[path]-pulled vmm.rs is a known feature here.
lx-wx-canary = []
# ... and `cfg(feature = "cow-ro-canary")` in the pulled-in `cow.rs` (wave 13).
cow-ro-canary = []
# ... and the wave 14 (FORKSPAWN) `pager.rs` canary.
fork-commit-race-canary = []
# ... and `cfg!(feature = "demand-region-canary")` in the pulled-in `vmm.rs`
# (wave 14, DEMANDPAGE).
demand-region-canary = []
# ... and the wave 14 (FORKSPAWN) canaries in the pulled-in `cow.rs`.
fork-demand-canary = []
cow-reuse-canary = []
# ... and `cfg(feature = "cow-spurious-canary")` in the pulled-in `cow.rs` (CTXHUNT).
cow-spurious-canary = []
# ... and the wave 14 (SPAWNCACHE) canary in the pulled-in `image_frames.rs`.
image-share-all-canary = []
# ... and the wave 14 security canary in the pulled-in `vmm.rs`.
mprotect-shared-canary = []
vdso-write-canary = []
# ... and `cfg(feature = "vdso-write-window")` in the pulled-in `vdso.rs`
# (wave 13, RT7). Off: the real write.
vdso-write-window = []
