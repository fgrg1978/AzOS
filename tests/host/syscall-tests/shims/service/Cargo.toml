[package]
name = "syscall_test_service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "azos_service for tests/host/syscall-tests: the real crates/core/service/src/lib.rs, built against host stand-ins for its two dependencies. NOT part of the kernel."

# The real registry, not a stand-in. It was `todo!()` stubs until the service
# syscalls got host tests: what those tests assert (which TID a name resolves
# to, who may stop a service) is decided by the registry, so a model of it
# would have proved only the model. The file needs exactly `azos_sync`
# and `azos_limits`; its manifest's other dependencies are unused by it.
[lib]
path = "../../../../../crates/core/service/src/lib.rs"

[dependencies]
azos_sync = { path = "../../../cap-tests/shims/sync", package = "cap_test_sync" }
azos_limits = { path = "../../../../../crates/core/limits" }
