[package]
name = "azos_syscall_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/core/syscall/src/handlers.rs. Excluded from workspace."

# Run with:  cd tests/host/syscall-tests && cargo test --release

[features]
# The syscall sources pulled in below name the robot crates through the shims
# in `shims/` (robot, imu, gps); `use-robot` is what makes them do so
# instead of importing `crates/core/syscall/src/no_robot.rs` (wave 11).
default = ["use-robot", "virtio-snd", "linux-abi"]
use-robot = []
# Mirrors azos_syscall's `virtio-snd`: the pulled-in khost.rs serves the `sound` key.
virtio-snd = []
# Mirrors azos_syscall's `linux-abi` (the pulled-in handlers.rs): on, because
# the tests drive the file helpers the Linux personality calls.
linux-abi = []
# Mirrors azos_syscall's `energy` (the pulled-in power.rs): off here, so the
# energy policy operations answer -ENOSYS (the host has no governor).
energy = []
# Mirrors azos_syscall's `hv` (the pulled-in khost.rs): off here, so the `vm` and
# `vcpu` keys answer as an interface this build does not host.
hv = []
# Mirrors azos_syscall's gate canary (wave 13): `cfg!(feature =
# "mmap-prot-canary")` in the pulled-in handlers.rs. Off: the real behaviour.
mmap-prot-canary = []
# Mirror azos_syscall's mmap-hint canaries (the pulled-in handlers.rs): the
# rows of src/mmap_hint.rs go red under each. Off: the real behaviour.
mmap-hint-canary = []
mmap-noreplace-canary = []
mmap-hint-window-canary = []
mmap-brk-apart-canary = []
# Mirrors azos_syscall's gate canary (wave 15, plan 4a) in the pulled-in
# ipc_handlers.rs. Off: the real behaviour.
thread-objects-canary = []
# Mirrors azos_syscall's `lx-loader` in the pulled-in invoke.rs (the module ops
# of the domain). Off: the host has no module loader.
lx-loader = []
# Wave 14 (DEMANDPAGE): the region pagers never resolve a fault.
demand-region-canary = ["azos_mm/demand-region-canary"]
# Wave 14 (SPAWNCACHE): mirrors azos_syscall's canaries of the same names
# (the pulled-in image_cache.rs).
digest-cache-stale-canary = []
digest-recheck-canary = []
# ... and the kept-frames canary of the pulled-in `image_frames.rs`.
image-share-all-canary = ["azos_mm/image-share-all-canary"]
mprotect-shared-canary = ["azos_mm/mprotect-shared-canary"]
vdso-write-canary = ["azos_mm/vdso-write-canary"]
uaccess-race-canary = ["azos_mm/uaccess-race-canary"]
uaccess-mmio-canary = ["azos_mm/uaccess-mmio-canary"]
memobj-move-keeps-map-canary = ["azos_ipc/memobj-move-keeps-map-canary"]
memobj-share-no-narrow-canary = ["azos_ipc/memobj-share-no-narrow-canary"]
memobj-charge-stays-canary = ["azos_ipc/memobj-charge-stays-canary"]
memobj-protect-max-canary = ["azos_ipc/memobj-protect-max-canary"]
memobj-cow-no-break-canary = ["azos_ipc/memobj-cow-no-break-canary"]
memobj-no-kernel-map-canary = ["azos_ipc/memobj-no-kernel-map-canary"]
memobj-anon-uncharged-canary = ["azos_ipc/memobj-anon-uncharged-canary"]
memobj-refcount-wrap-canary = ["azos_ipc/memobj-refcount-wrap-canary"]
memobj-sweep-no-hook-canary = ["azos_ipc/memobj-sweep-no-hook-canary"]
memobj-sweep-no-retain-canary = ["azos_ipc/memobj-sweep-no-retain-canary"]
memobj-sweep-every-domain-canary = ["azos_ipc/memobj-sweep-every-domain-canary"]
memobj-purge-held-canary = ["azos_ipc/memobj-purge-held-canary"]
memobj-purge-kernel-held-canary = ["azos_ipc/memobj-purge-kernel-held-canary"]
memobj-purge-locked-canary = ["azos_ipc/memobj-purge-locked-canary"]
memobj-word-unlocked-canary = ["azos_ipc/memobj-word-unlocked-canary"]
# Front futex-single-section: the wait's key from a lookup before its look, and
# no identity check on a PI step's shm word (src/futex_one_look.rs).
futex-key-outside-canary = []
delete-revokes-canary = ["azos_ipc/delete-revokes-canary"]
move-lifts-depth-canary = ["azos_ipc/move-lifts-depth-canary"]
# SUBTREE-POLICY: mirrors azos_syscall's gate canary in the pulled-in
# families.rs. Off: the real behaviour.
subtree-gate-canary = []
# Mirrors azos_syscall's deadline admission canary in the pulled-in
# ipc_deadline.rs: every call is admitted. Off: the real behaviour.
ipc-admit-canary = []
# Mirrors azos_syscall's partition scope canary in the pulled-in
# block_host.rs: the end of the partition is not checked. Off: the real behaviour.
block-scope-canary = []
# Wave 15: mirrors azos_syscall's canary of the same name (the pulled-in
# module_tokens.rs): a dead task's module tokens are kept.
module-token-leak-canary = []
# ... and its digest-table verdict: a module name with no row is admitted.
module-unlisted-canary = []
# ... and the pulled-in motor_commander.rs's gate canary (exercised by the
# kernel ktest, declared here so the host build knows the name).
commander-exit-nostop-canary = []

[dependencies]
# Kconfig CHAOS / DECISION_RECORDS_DEV sites in the #[path]-pulled sources
# (off on the host: the `on` feature is not enabled).
# `on`: the ring is live, so `ipc_deadline_tests` can read back the record a
# refused call writes (off, `record` is empty and that test is vacuous).
azos_decision = { path = "../../../crates/core/decision", features = ["on"] }
# Real, pure, no_std, host-buildable as-is (crates/core/abi has zero dependencies).
azos_abi = { path = "../../../crates/core/abi" }
# `file_ops.rs` and `handlers.rs` join a name beneath a directory with its
# `path::join_beneath` (the filesystem's own join). Pure, no_std.
azos_common = { path = "../../../crates/core/common" }
azos_devif = { path = "../../../crates/core/devif" }
azos_idl = { path = "../../../crates/core/idl" }
# The scanout, the EDID parser and the copy `display.rs` serves the `Display` interface from.
azos_fb = { path = "../../../crates/drivers/fb" }
# The region rings the `Uart` and `Adc` servers push into (`devices.rs`).
azos_rings = { path = "../../../crates/core/rings" }
# Wave 14 (SPAWNCACHE): `image_cache.rs` sizes its kept frames by Kconfig
# `EXEC_IMAGE_CACHE_KB` (generated from the tree's .config, as the mm shim's).
azos_limits = { path = "../../../crates/core/limits" }
# Wave 15: the real tracer (host-buildable: abi, rings and limits only), for
# the pulled-in `trace_ctl.rs`.
azos_trace = { path = "../../../crates/core/trace" }
# The real topology, for `families::install_policy`: it reads the `[policy.NAME]`
# rows of the installed topology (`dev-key`: a test build, as topology-tests).
azos_topology = { path = "../../../crates/core/topology", features = ["dev-key"] }

# Host stand-ins. Renamed via Cargo dependency rename so `handlers.rs`'s own
# `use azos_x::...` statements resolve unchanged; the kernel never sees
# any of these.
# Reused, not duplicated: tests/host/cap-tests already built the host stand-in
# for azos_sync (a std::sync::Mutex-backed SpinLock) that net-tests and
# drivers-tests also depend on. Same crate, same reasons.
# `link_key.rs` derives the node identity (DICE-ID): the real crypto, not a stand-in.
azos_crypto = { path = "../../../crates/core/crypto" }
azos_sync = { path = "../cap-tests/shims/sync", package = "cap_test_sync" }
azos_sched = { path = "shims/sched", package = "syscall_test_sched" }
azos_ipc = { path = "shims/ipc", package = "syscall_test_ipc" }
syscall_test_drivers = { path = "shims/drivers" }
azos_drv_api = { path = "../../../crates/drivers/api" }
azos_net = { path = "shims/net", package = "syscall_test_net" }
azos_mm = { path = "shims/mm", package = "syscall_test_mm" }
azos_arch = { path = "shims/arch", package = "syscall_test_arch" }
azos_arch_api = { path = "../../../arch/api" }
azos_robot = { path = "shims/robot", package = "syscall_test_robot", features = ["test-util"] }
azos_imu = { path = "shims/imu", package = "syscall_test_imu" }
azos_gps = { path = "shims/gps", package = "syscall_test_gps" }
azos_driver_server = { path = "shims/driver_server", package = "syscall_test_driver_server" }

# The task pool the pulled-in `cap_store.rs` resolves TIDs against.
#
# `crates/core/ipc`'s cap_store calls `azos_sched::idx_for_tid`, and inside
# `shims/ipc` that name resolves to `shims/ipc_sched` -> `cap_test_sched`, NOT
# to this crate's own `shims/sched`. The two are separate task tables. A test
# that mints a capability and then calls a typed handler has to bind the TID in
# THIS one and set the current TID in the other, so it needs both names.
# Aliased rather than shadowing `azos_sched` precisely so that a reader
# cannot mistake one for the other.
ipc_task_pool = { path = "../cap-tests/shims/sched", package = "cap_test_sched" }

# The scheduler as `crates/core/ipc` sees it (`shims/ipc_sched`): where the real
# ipc modules record their wakes. Named so the tests can read them.
ipc_sched_shim = { path = "shims/ipc_sched", package = "syscall_test_ipc_sched" }

# Reproduce the kernel's release profile: overflow-checks is what turns a
# wrapped arithmetic op into a panic, which matters for handlers that do
# pointer/length arithmetic on raw syscall args.
[profile.release]
overflow-checks = true

[lints.rust]
# `handlers.rs` is compiled here under a host target it was never written
# for; a handful of driver/ipc modules it pulls in declare cfg's (qemu, vf2,
# kani, loom) that this crate's Cargo.toml does not also declare features
# for. Declared rather than silenced, so the condition stays visible.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(feature, values("qemu"))', 'cfg(feature, values("storm-no-resume-canary", "storm-ignore-locked-canary", "swap-no-restore-slot-canary"))', 'cfg(feature, values("vf2"))', 'cfg(feature, values("actuation-smoke"))', 'cfg(feature, values("arp-timing"))', 'cfg(feature, values("portwait-timer-canary"))'] }
