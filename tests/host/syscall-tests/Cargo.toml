swap-put-back-lost-canary = ["azos_ipc/swap-put-back-lost-canary"]
swap-discharge-all-canary = ["azos_ipc/swap-discharge-all-canary"]
swap-word-away-canary = ["azos_ipc/swap-word-away-canary"]
