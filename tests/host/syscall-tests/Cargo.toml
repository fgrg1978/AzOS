move-lifts-depth-canary = ["azos_ipc/move-lifts-depth-canary"]
# SUBTREE-POLICY: mirrors azos_syscall's gate canary in the pulled-in
# families.rs. Off: the real behaviour.
subtree-gate-canary = []
# Mirrors azos_syscall's deadline admission canary in the pulled-in
# ipc_deadline.rs: every call is admitted. Off: the real behaviour.
ipc-admit-canary = []
# Mirrors azos_syscall's partition scope canary in the pulled-in
# block_host.rs: the end of the partition is not checked. Off: the real behaviour.
block-scope-canary = []
# Mirrors azos_syscall's vdso-bind-canary in the pulled-in sensor_host.rs: a robot
