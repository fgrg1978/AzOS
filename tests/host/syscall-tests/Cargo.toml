uaccess-mmio-canary = ["azos_mm/uaccess-mmio-canary"]
memobj-move-keeps-map-canary = ["azos_ipc/memobj-move-keeps-map-canary"]
memobj-share-no-narrow-canary = ["azos_ipc/memobj-share-no-narrow-canary"]
