memobj-write-first-frame-canary = ["azos_ipc/memobj-write-first-frame-canary"]
memobj-refcount-wrap-canary = ["azos_ipc/memobj-refcount-wrap-canary"]
memobj-sweep-no-hook-canary = ["azos_ipc/memobj-sweep-no-hook-canary"]
memobj-sweep-no-retain-canary = ["azos_ipc/memobj-sweep-no-retain-canary"]
memobj-sweep-every-domain-canary = ["azos_ipc/memobj-sweep-every-domain-canary"]
memobj-purge-held-canary = ["azos_ipc/memobj-purge-held-canary"]
