[package]
name = "azos_syscall_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/core/syscall/src/handlers.rs. Excluded from workspace."

# Run with:  cd tests/host/syscall-tests && cargo test --release

[features]
# The kernel's ring-3 IOMMU reuse rule broken to empty-only
# (`behind_an_iommu_a_binding_ends_freed_and_the_device_binds_again` goes red).
ring3-reuse-canary = ["azos_dma/ring3-reuse-canary"]
# `dma_bind.rs`'s canary: a device no IOMMU confines is given memory anyway
# (`an_unconfined_device_is_refused_without_the_acceptance` goes red).
dma-ring3-unconfined-canary = ["azos_ipc/dma-ring3-unconfined-canary"]
# `dma_bind.rs`'s canary: a map whose flush failed twice is unpinned
# (`a_map_the_unit_did_not_confirm_keeps_its_frames_and_parks_the_device` goes red).
dma-map-unpin-canary = ["azos_ipc/dma-map-unpin-canary"]
# The syscall sources pulled in below name the robot crates through the shims
# in `shims/` (robot, imu, gps); `use-robot` is what makes them do so
# instead of importing `crates/core/syscall/src/no_robot.rs` (wave 11).
default = ["use-robot", "virtio-snd", "linux-abi", "board-io", "pkg-sec-floor"]
use-robot = []
# Mirrors azos_syscall's `board-io`: the pulled-in khost.rs serves the `adc` key
# (`adc_host.rs`) and handlers.rs reads the board's sensor types.
board-io = []
# Mirrors azos_syscall's `virtio-snd`: the pulled-in khost.rs serves the `sound` key.
virtio-snd = []
# Mirrors azos_syscall's `linux-abi` (the pulled-in handlers.rs): on, because
# the tests drive the file helpers the Linux personality calls.
linux-abi = []
# Mirrors azos_syscall's `energy` (the pulled-in power.rs): off here, so the
# energy policy operations answer -ENOSYS (the host has no governor).
energy = []
# Mirrors azos_syscall's `hv` (the pulled-in khost.rs): off here, so the `vm` and
# `vcpu` keys answer as an interface this build does not host.
hv = []
# Mirrors azos_syscall's `pkg-sec-floor` (Kconfig PKG_SEC_FLOOR_ENFORCE) and its
# `exec-floor-canary`, for the pulled-in exec_grant.rs.
pkg-sec-floor = []
exec-floor-canary = []
# Mirrors azos_syscall's gate canary (wave 13): `cfg!(feature =
# "mmap-prot-canary")` in the pulled-in handlers.rs. Off: the real behaviour.
mmap-prot-canary = []
# `azos_devif::gpio::badge`'s canary: a badge is stamped without its controller
# (`a_capability_on_controller_1_never_reaches_controller_0` goes red).
gpio-badge-canary = ["azos_devif/badge-without-controller-canary"]
# The pulled-in devices.rs: a controller that is not registered is answered by
# the board's (`a_controller_not_bound_is_no_resource_and_a_pin_past_its_last_is_bad_argument`
# goes red); the safety core's lines are not kept from an acting op
# (`the_kill_switch_line_is_refused_to_a_holder_of_its_endpoint` goes red).
gpio-unbound-falls-to-board-canary = []
gpio-safety-guard-canary = []
# Mirror azos_syscall's canaries of the pulled-in frame_host.rs (rows of
# src/frame_guards.rs): a read copies nothing; the buffer is checked after the
# frame is taken; a task's every call takes a reader slot; an exit keeps its
# slot; the pool's view of a frame writes into it.
frame-copy-skip-canary = []
# ... the frame is copied with the region table locked.
frame-copy-under-lock-canary = []
effect-default-allow-canary = []
frame-effect-ignored-canary = []
frame-unrecorded-canary = []
frame-first-read-always-canary = []
frame-check-late-canary = []
frame-slot-per-call-canary = []
frame-exit-keeps-canary = []
frame-reader-writes-canary = ["azos_cam_ring/canary-reader-writes"]
# `ipc_handlers.rs` `doorbell_word`'s canary: the doorbell offset's end wraps
# (`a_doorbell_offset_outside_its_region_is_refused` goes red).
doorbell-wrap-canary = []
# `nicq.rs` `kick`'s canaries (`a_kick_shares_a_doorbell_and_a_stamped_frame_leaves_at_once`
# goes red).
nicq-no-batch-canary = []
nicq-no-stamp-flush-canary = []
# The kick closes its batch only while the queue is still taken (the batch stays
# open on the stack's NIC when the taker's receive ring fails mid-kick).
nicq-gated-close-canary = []
# `endpoint.rs` `calls_set_link`'s canary: any READ holder binds an endpoint's
# calls (`only_the_server_binds_an_endpoints_calls` goes red).
calls-any-binder-canary = ["azos_ipc/calls-any-binder-canary"]
# Mirror azos_syscall's mmap-hint canaries (the pulled-in handlers.rs): the
# rows of src/mmap_hint.rs go red under each. Off: the real behaviour.
mmap-hint-canary = []
mmap-noreplace-canary = []
mmap-hint-window-canary = []
mmap-brk-apart-canary = []
mmap-break-only-canary = []
# Mirrors azos_syscall's gate canary (wave 15, plan 4a) in the pulled-in
# ipc_handlers.rs. Off: the real behaviour.
thread-objects-canary = []
# Mirrors azos_syscall's `lx-loader` in the pulled-in invoke.rs (the module ops
# of the domain). Off: the host has no module loader.
lx-loader = []
# Wave 14 (DEMANDPAGE): the pagers never resolve a fault.
demand-region-canary = ["azos_mm/demand-region-canary"]
# Wave 14 (SPAWNCACHE): mirrors azos_syscall's canaries of the same names
# (the pulled-in image_cache.rs).
digest-cache-stale-canary = []
digest-recheck-canary = []
# ... and the kept-frames canary of the pulled-in `image_frames.rs`.
image-share-all-canary = ["azos_mm/image-share-all-canary"]
mprotect-shared-canary = ["azos_mm/mprotect-shared-canary"]
vdso-write-canary = ["azos_mm/vdso-write-canary"]
uaccess-race-canary = ["azos_mm/uaccess-race-canary"]
as-stale-root-canary = ["azos_mm/as-stale-root-canary"]
mm-pte-truth-canary = ["azos_mm/mm-pte-truth-canary"]
restore-flip-canary = ["azos_mm/restore-flip-canary"]
age-slots-ignored-canary = ["azos_mm/age-slots-ignored-canary"]
swap-skip-unrecorded-canary = ["azos_mm/swap-skip-unrecorded-canary"]
swap-skip-every-page-canary = ["azos_mm/swap-skip-every-page-canary"]
fault-block-leaf-canary = ["azos_mm/fault-block-leaf-canary"]
keep-leaf-first-canary = ["azos_mm/keep-leaf-first-canary"]
fork-hold-canary = ["azos_mm/fork-hold-canary"]
fork-install-recheck-canary = ["azos_mm/fork-install-recheck-canary"]
mm-install-after-release-canary = ["azos_mm/mm-install-after-release-canary"]
uaccess-mapped-refused-canary = ["azos_mm/uaccess-mapped-refused-canary"]
fault-foreign-retry-canary = ["azos_mm/fault-foreign-retry-canary"]
budget-ceiling-ignored-canary = ["azos_mm/budget-ceiling-ignored-canary"]
budget-pool-ignored-canary = ["azos_mm/budget-pool-ignored-canary"]
budget-keep-grown-canary = ["azos_mm/budget-keep-grown-canary"]
fault-entry-rewalk-canary = ["azos_mm/fault-entry-rewalk-canary"]
fork-wait-counted-canary = ["azos_mm/fork-wait-counted-canary"]
spurious-fault-canary = ["azos_mm/spurious-fault-canary"]
slot-chunk-promised-canary = ["azos_mm/slot-chunk-promised-canary"]
slot-chunk-kept-canary = ["azos_mm/slot-chunk-kept-canary"]
cow-slot-canary = ["azos_mm/cow-slot-canary"]
cow-shared-write-canary = ["azos_mm/cow-shared-write-canary"]
fork-marker-canary = ["azos_mm/fork-marker-canary"]
fork-chunks-within-base-canary = []
mm-rmap-missing-canary = ["azos_mm/mm-rmap-missing-canary"]
phys-memtype-canary = ["azos_mm/phys-memtype-canary"]
exec-shared-record-canary = ["azos_mm/exec-shared-record-canary"]
exec-flip-unlocked-canary = ["azos_mm/exec-flip-unlocked-canary"]
stale-va-kept-canary = []
module-fixed-record-canary = []
phys-grant-ends-by-owner-canary = []
phys-leaves-unrecorded-canary = []
phys-unmap-any-canary = []
vdso-page-kept-canary = []
phys-inherit-ignored-canary = ["azos_mm/phys-inherit-ignored-canary"]
fork-passes-nothing-canary = ["azos_mm/fork-passes-nothing-canary"]
exec-no-space-canary = ["azos_mm/exec-no-space-canary"]
release-one-pass-canary = ["azos_mm/release-one-pass-canary"]
clone-invariant-silent-canary = []
shm-partial-map-kept-canary = []
shm-release-record-kept-canary = []
stale-record-kept-canary = []
fork-file-count-late-canary = ["azos_mm/fork-file-count-late-canary"]
cow-break-during-fork-canary = ["azos_mm/cow-break-during-fork-canary"]
fork-leafless-frame-canary = ["azos_mm/fork-leafless-frame-canary"]
cow-reuse-canary = ["azos_mm/cow-reuse-canary"]
as-stale-ref-canary = ["azos_mm/as-stale-ref-canary"]
as-gen-unchecked-canary = ["azos_mm/as-gen-unchecked-canary"]
as-key-no-gen-canary = ["azos_mm/as-key-no-gen-canary"]
