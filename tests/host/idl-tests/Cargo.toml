[package]
name = "azos_idl_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Runs the IDL crates' own tests (crates/core/idl: the runtime and its round trips; crates/core/idl-macros: the #[azos_interface] expansion) under the host gate. Those crates are excluded from every workspace and a proc-macro crate's unit tests only run from its own manifest, so this suite runs them there. Excluded from workspace."

# Run with:  cd tests/host/idl-tests && cargo test --release

[dependencies]
azos_idl = { path = "../../../crates/core/idl" }
azos_devif = { path = "../../../crates/core/devif" }

[workspace]

[profile.release]
