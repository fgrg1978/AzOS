[package]
name = "azos_arch_api_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for azos_arch_api — PagePerms named constants, ArchId/arch_name round-trip, trait shape pinned via a Stub impl that satisfies all five traits (Cpu/Interrupts/Mmu/Boot/Vector)."

# Run with:  cd tests/host/arch-api-tests && cargo test

[dependencies]
azos_common = { path = "../../../crates/core/common" }
# `lat-trace`: the masked-window tracer bookkeeping (`lat`), tested below.
azos_arch_api = { path = "../../../arch/api", features = ["lat-trace"] }
# The kernel entropy pool: the CPU sources' credit is checked against the pool
# it seeds (`entropy_tests`).
azos_crypto = { path = "../../../crates/core/crypto" }

# `aarch64_its` (below, pulled via `#[path]`) carries
# `#[cfg(feature = "its-skip-mapti")]` — declared here too, mirroring
# `arch/aarch64/Cargo.toml`'s own feature of the same name, purely
# so this crate's `unexpected_cfgs` lint recognizes it (the pulled file
# never turns the feature on; nothing here sets it).
[features]
its-skip-mapti = []
# Same for `sysregs.rs` (pulled for `cpu.rs`): the gate's IRQ-order canary.
irq-nomem-canary = []
# Same for `sysregs.rs`: the gate's EL0-state canary (el0-state-audit).
el0-state-canary = []
# Same for `cpu/features.rs` (pulled with `cpu/mod.rs`): the gate's ID-register canary.
a64-id-canary = []
