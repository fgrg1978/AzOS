[package]
name = "sync_test_arch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host stand-in for azos_arch, used only by tests/host/sync-tests. NOT part of the kernel."

[dependencies]
# The cross-ISA contract itself — pure traits and plain types, `no_std` and
# host-portable (`tests/host/arch-api-tests` already runs it here). The shim has
# to provide `Interrupts` + `ARCH` because `spinlock.rs` and `preempt.rs`
# reach interrupt state through them since 2026-09-21, not through `csr::`.
azos_arch_api = { path = "../../../../../crates/core/arch-api" }
