[package]
name = "azos_sync_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the K-C29 preemption-control mechanism in crates/core/sync/src/preempt.rs and crates/core/sync/src/preempt_core.rs. Excluded from the kernel workspace."

# Its own workspace root.
#
# Every other host-test crate in this tree is listed in the root `Cargo.toml`'s
# `exclude` array; without that, `cargo test` here walks up, finds the root
# manifest, sees this package in neither `members` nor `exclude`, and refuses
# to build. This empty table achieves the same isolation from inside the crate
# (and makes `shims/arch` a member of *this* workspace). Adding the root
# `exclude` entry as well is harmless and keeps the tree uniform — see the
# report accompanying this change.
[workspace]

# Host stand-in for the RV64-only `azos_arch`. Renamed so
# `crates/core/sync/src/preempt.rs` compiles UNMODIFIED: it names
# `azos_arch::cpu::hart_id()` and `azos_arch::csr::read_sstatus()`,
# which are inline asm on the kernel target. See the shim's crate doc.
[dependencies]
azos_arch = { path = "shims/arch", package = "sync_test_arch" }
azos_limits = { path = "../../../crates/core/limits" }

[dev-dependencies]

# `preempt.rs`/`spinlock.rs` (pulled via `#[path]`) carry
# `#[cfg(feature = "lat-trace")]` hooks. Declared here only so this crate's
# `unexpected_cfgs` lint recognizes the name; nothing here turns it on.
[features]
lat-trace = []
