[package]
name = "azos_usb_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/drivers/usb: the xHCI driver, the USB core, hubs, pipes and the class-driver interface, against a register-level xHCI mock (a fake controller behind the register window that executes the command ring, the transfer rings and the port state machine, and a tree of fake devices and hubs). Excluded from the workspace like the other *-tests crates."

# Run with:  cd tests/host/usb-tests && CARGO_TARGET_DIR=~/azos-out/usb-tests cargo test --release --target aarch64-apple-darwin
# Canaries: `cargo test --release --target aarch64-apple-darwin --features canary-<name>` must FAIL.

[dependencies]
azos_usb = { path = "../../../crates/drivers/usb", features = ["inspect", "dwc2"] }
azos_rings = { path = "../../../crates/core/rings" }
azos_idl = { path = "../../../crates/core/idl" }
azos_devif = { path = "../../../crates/core/devif" }
azos_scsi = { path = "../../../crates/drivers/scsi" }
azos_limits = { path = "../../../crates/core/limits" }
azos_inspect = { path = "../../../crates/core/inspect" }
azos_hwbus = { path = "../../../crates/drivers/hwbus" }
# The device timeout policy's records (`tests::reset`).
azos_drv_api = { path = "../../../crates/drivers/api" }

[dev-dependencies]
# `tests/chaos.rs` arms the xHCI injection point (the registry built in, as a
# Kconfig CHAOS kernel has it; nothing else arms a point here).
azos_chaos = { path = "../../../crates/core/chaos", features = ["on"] }

[features]
canary-ac64 = ["azos_usb/canary-ac64"]
canary-csz = ["azos_usb/canary-csz"]
canary-scratchpad = ["azos_usb/canary-scratchpad"]
canary-cycle = ["azos_usb/canary-cycle"]
canary-erdp-ehb = ["azos_usb/canary-erdp-ehb"]
canary-64k = ["azos_usb/canary-64k"]
canary-route = ["azos_usb/canary-route"]
canary-unplug = ["azos_usb/canary-unplug"]
canary-msc-no-recovery = ["azos_usb/canary-msc-no-recovery"]
canary-dr-mode = ["azos_usb/canary-dr-mode"]
canary-xhci-no-reset = ["azos_usb/canary-xhci-no-reset"]
canary-xhci-reset-keeps-devices = ["azos_usb/canary-xhci-reset-keeps-devices"]
canary-xhci-reset-event-ring = ["azos_usb/canary-xhci-reset-event-ring"]
canary-xhci-hse-latches = ["azos_usb/canary-xhci-hse-latches"]
canary-dwc2-hprt-w1c = ["azos_usb/canary-dwc2-hprt-w1c"]
canary-dwc2-toggle = ["azos_usb/canary-dwc2-toggle"]
canary-dwc2-no-bounce = ["azos_usb/canary-dwc2-no-bounce"]
canary-dwc2-split = ["azos_usb/canary-dwc2-split"]

[profile.release]
overflow-checks = true

[workspace]
