[package]
name = "azos_energy_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for energy-aware scheduling (stages E0-E2): azos_energy (utilisation trackers on synthetic traces, model validation and resolution, the seams' I4 answer), the SCHED.TOML energy sections and the DTB energy tables. Excluded from workspace."

# Run with:  cd tests/host/energy-tests && cargo test --release

[dependencies]
azos_energy = { path = "../../../crates/core/energy" }
azos_abi = { path = "../../../crates/core/abi" }
azos_dtb = { path = "../../../crates/drivers/dtb" }
# The parser of the signed SCHED.TOML, with its energy sections; `dev-key`
# because a host build names no production key (see topology-tests).
azos_topology = { path = "../../../crates/core/topology", features = ["energy", "dev-key"] }

[features]
# `arch/x86_64/src/cpu/features.rs` (pulled in for the CPUID decode)
# reads it; the arch suite owns the canary (tests/host/arch-tests).
x86-cpuid-canary = []
# The gate's canary run: `EnergyModel::validate` accepts everything, and the
# validation tests must fail.
validate-canary = ["azos_energy/validate-canary"]
# E3/E4 invariant canaries: each must turn its invariant test red.
i1-canary = ["azos_energy/i1-canary"]
i6-canary = ["azos_energy/i6-canary"]
i3-canary = ["azos_energy/i3-canary"]
rt-powerdown-canary = ["azos_energy/rt-powerdown-canary"]
# The firmware-derived table (the Raspberry Pi's ARM clock range) accepts a
# degenerate range and ends off the firmware's maximum: exactly four tests
# (`firmware.rs`).
firmware-model-canary = ["azos_energy/firmware-model-canary"]
# Policy canaries: each removes one limit, and exactly its tests must fail.
pl-floor-canary = ["azos_energy/pl-floor-canary"]
pl-clamp-canary = ["azos_energy/pl-clamp-canary"]
pl-record-canary = ["azos_energy/pl-record-canary"]
pl-limit-canary = ["azos_energy/pl-limit-canary"]
pl-reserve-canary = ["azos_energy/pl-reserve-canary"]
pl-stale-canary = ["azos_energy/pl-stale-canary"]
apply-canary = ["azos_energy/apply-canary"]
apply-overdue-canary = ["azos_energy/apply-overdue-canary"]
