[package]
name = "azos_seccomp_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the syscall filter (AQ11): crates/core/sched/src/filter.rs and seccomp.rs. Excluded from workspace."

# Run with:  cd tests/host/seccomp-tests && cargo test --release

[dependencies]
# Kconfig CHAOS / DECISION_RECORDS sites in the #[path]-pulled sources
# (off on the host: the `on` feature is not enabled).
azos_decision = { path = "../../../crates/core/decision" }
# Kconfig CHAOS / DECISION_RECORDS sites in the #[path]-pulled sources
# (off on the host: the `on` feature is not enabled).
azos_chaos = { path = "../../../crates/core/chaos" }
# The real syscall numbers, not a copy. `seccomp.rs` redeclares them as local
# `const`s with a comment saying they "must match azos_syscall::numbers
# exactly" — a claim nothing enforced until this suite did.
azos_syscall_numbers = { path = "shims/numbers" }
# This suite `#[path]`-includes the real `crates/core/sched/src/seccomp.rs`,
# which derives its syscall numbers from `abi` instead of restating them.
azos_abi = { path = "../../../crates/core/abi" }
# RFC-0047: a Linux image's profile is derived through the personality's table.
azos_linux_abi = { path = "../../../crates/core/linux-abi" }
# `seccomp.rs` hashes images with `azos_crypto::sha256`, as in the kernel.
azos_crypto = { path = "../../../crates/core/crypto" }
# `filter.rs` sizes its list from `azos_limits::SYSCALL_FILTER_MAX` (Kconfig).
azos_limits = { path = "../../../crates/core/limits" }

# Reproduce the kernel's release profile: a suite that does not is testing a
# different program.
[profile.release]
overflow-checks = true
