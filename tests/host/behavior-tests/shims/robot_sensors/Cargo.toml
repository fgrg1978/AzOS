[package]
name = "beh_test_robot_sensors"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "The robot extension's sensors (crates/domains/robot/sensors, pulled in verbatim) over this suite's stand-in for the sensor class. NOT part of the kernel."

[dependencies]
