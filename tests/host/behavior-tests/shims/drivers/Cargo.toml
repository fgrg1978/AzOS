[package]
name = "beh_test_drivers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host stand-in for the driver class crates (azos_drv_*), reduced to the clock, kprintln, GPIO and PWM the pulled-in behavior modules use. Excluded from workspace."

[dependencies]
# `azos_drv_base::sensors` is pulled in verbatim (the sensor bus reads its streams).
azos_abi = { path = "../../../../../crates/core/abi" }
azos_devif = { path = "../../../../../crates/core/devif" }
azos_rings = { path = "../../../../../crates/core/rings" }
azos_limits = { path = "../../../../../crates/core/limits" }
azos_sync = { path = "../../../cap-tests/shims/sync", package = "cap_test_sync" }

[features]
# The canaries of the pulled-in `instances.rs` and `sensors.rs`: known values,
# never enabled here (drivers-tests runs them).
instances-reuse-canary = []
instances-no-drain-canary = []
sensor-reserve-canary = []
sensor-drop-canary = []
