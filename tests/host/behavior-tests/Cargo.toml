[package]
name = "azos_behavior_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the brain wire protocol in crates/domains/robot/behavior/src/brain_protocol.rs. Excluded from workspace."

# Run with:  cd tests/host/behavior-tests && cargo test --release

[features]
# logger.rs's RT-flush gate canary: a known value, never enabled.
rt-flush-canary = []
# Gate canaries only (host suite `behavior-tests`): the replay does not end its
# walk at a file's state records; a rotation leaves the latch out of the new
# file's state records; the replay takes the last name, not the newest serial,
# once the names have wrapped.
replay-snapshot-canary = []
rotate-latch-canary = []
# providers.rs (pulled via #[path]; actuation-tests runs its canary).
devices-phase-canary = []
# azos_robot_sensors: the IMU and the odometry swap numbers
# (`the_robot_attaches_each_sensor_at_its_topology_number` goes red).
robot-sensors-swap-canary = ["azos_robot_sensors/robot-sensors-swap-canary"]
wrap-tail-canary = []
# logger.rs's ring-reserve gate canary: a known value, never enabled here (the
# canary row is in actuation-tests).
ring-reserve-canary = []
# logger.rs's durable queue canaries: the per-CPU queues written one after
# another, not in push order; a full queue dropping what it answered taken; a
# batch dropped from RAM before the write; the busy, spill, wake, rotation-sync
# gap-skip, resnap, rotate-trust and stall-cap canaries (see
# crates/core/actuation/Cargo.toml).
durable-merge-canary = []
durable-full-canary = []
durable-staging-canary = []
durable-busy-canary = []
durable-spill-canary = []
durable-nowake-canary = []
durable-rotate-sync-canary = []
durable-gap-skip-canary = []
durable-resnap-canary = []
durable-rotate-trust-canary = []
durable-stall-cap-canary = []
durable-full-mask-canary = []
# logger.rs's telemetry gate canary and the ring crate's: known values, never
# enabled by default (the canary rows are in this suite).
telemetry-ring-canary = []
# estop.rs's unrecorded-release gate canary: a known value, never enabled by default.
estop-unrecorded-canary = []
# The behaviour engine's inference client (userspace/services/brain_client/src/ml.rs):
# a refused call passes as a class, the model that answered is not compared
# with the one asked for, a call that timed out passes as a class. Known
# values, never enabled by default (the canary rows are in this suite).
infer-refusal-canary = []
infer-model-canary = []
ml-timeout-canary = []
ml-grant-canary = []
ml-unaskable-canary = []
range-stale-canary = []
# `safety.rs`'s E03 section is the `geofence` feature and `rc_link.rs`
# exists only under `rc-input` in the real crate; on here so the suite tests
# both (the files are pulled in by `#[path]`).
default = ["geofence", "rc-input"]
geofence = []
rc-input = []

[dependencies]
azos_common = { path = "../../../crates/core/common" }
azos_ext_api = { path = "../../../crates/core/ext-api" }
# The ABI types and device interfaces the pulled-in files name: both
# dependency-free of the kernel.
azos_abi = { path = "../../../crates/core/abi" }
azos_devif = { path = "../../../crates/core/devif" }
wcet-macro = { path = "../../../crates/core/wcet-macro" }
# Real crate: dependency-free leaf, so the degrade ceiling under test is the
# kernel's own mapping rather than a number this suite made up.
azos_degrade_policy = { path = "../../../crates/domains/robot/degrade-policy" }
azos_ipc = { path = "shims/ipc", package = "beh_test_ipc" }
azos_sync = { path = "../cap-tests/shims/sync", package = "cap_test_sync" }
azos_rings = { path = "../../../crates/core/rings" }
# Real crates: both build for the host and have their own suites, so the code
# under test uses the kernel's own decision and crypto code rather than
# stand-ins that could drift from them.
azos_records = { path = "../../../crates/core/records" }
azos_decision = { path = "../../../crates/core/decision", features = ["on"] }
azos_crypto = { path = "../../../crates/core/crypto" }
beh_test_drivers = { path = "shims/drivers" }
# The real `crates/domains/robot/robot/src/motor.rs` (+ `pid.rs`), pulled in by its own
# small shim crate the same way `tests/host/syscall-tests/shims/robot` already
# does — it needs a `SpinLock::get_mut_unchecked` this crate's own
# `cap_test_sync` (line above) deliberately omits, so it cannot share the
# `azos_sync` alias this crate uses for everything else. See
# `shims/robot`'s own doc. Motor-gate/record suite.
azos_robot = { path = "shims/robot", package = "beh_test_robot" }
azos_robot_sensors = { path = "shims/robot_sensors", package = "beh_test_robot_sensors" }
azos_limits = { path = "shims/limits", package = "beh_test_limits" }
# The flight recorder's `LogStorage` seam is a trait `logger.rs` defines
# itself now (crates/domains/robot/behavior no longer depends on azos_fs at all -- see
# tools/lint/tcb_check.sh), so the fault-injecting stand-in that used to impersonate
# azos_fs's whole API lives directly in this crate as `log_storage_mock`
# (src/lib.rs) instead of a separate aliased shim crate.
#
# `estop_release_authority.rs`'s tests need to SIGN, not just verify —
# `azos_crypto::ed25519` is deliberately verify-only (see its module doc),
# so this test crate takes its own direct dependency on the same
# `ed25519-dalek` version. Cargo unifies features for one dependency graph, so
# this does not change what `azos_crypto` itself builds with anywhere
# else (this crate is `Excluded from workspace`, its own separate build).
# `SigningKey::from_bytes` is deterministic from a raw 32-byte seed, so no
# `rand_core` feature is needed to produce a signature.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }

# Reproduce the kernel's release profile. A suite that does not is testing a
# different program: overflow-checks is what turns a wrapping length
# computation into a panic, and panic = "abort" makes that a board reset.
[profile.release]
overflow-checks = true
