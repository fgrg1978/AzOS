[package]
name = "azos_input_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the input event word and the console screen region (crates/drivers/input/wire), and for the framebuffer grid as the screen region's publisher (scrollback, wrap flags, mouse modes, the overlay drawn in inverse video). Excluded from workspace."

# Run with:  cd tests/host/input-tests && cargo test --release

[dependencies]
azos_input_wire = { path = "../../../crates/drivers/input/wire" }
azos_fb = { path = "../../../crates/drivers/fb" }
azos_limits = { path = "../../../crates/core/limits" }

[profile.release]
overflow-checks = true

[workspace]
