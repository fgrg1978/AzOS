[package]
name = "azos_actuation_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for write-ahead receipts (innovation B1): the effect gate in crates/core/actuation/src/effect_gate.rs over the real flight-recorder queues in logger.rs, with a power-cut model. Excluded from workspace."

# Run with:  cd tests/host/actuation-tests && cargo test --release
# Canary:    cargo test --release --features effect-issue-before-commit-canary
#            (the two write-ahead tests must FAIL; see src/lib.rs)

[features]
# effect_gate.rs's gate canary: the device op is issued before its record is
# committed. A known value here, off unless the canary row builds with it.
effect-issue-before-commit-canary = []
# effect_gate.rs's envelope gate canary: the Domain's `delete` and `egress`
# rows are ignored. A known value here, off unless the canary row builds with it.
envelope-row-canary = []
# providers.rs: the devices phase is not ordered with the others
# (`each_boot_phase_runs_once_and_in_order` goes red).
devices-phase-canary = []
# logger.rs's RT-flush gate canary: a known value, never enabled.
rt-flush-canary = []
# logger.rs's replay and rotation canaries: known values, never enabled here (the
# canary rows are in behavior-tests).
replay-snapshot-canary = []
rotate-latch-canary = []
wrap-tail-canary = []
# logger.rs's reserve canary: effect and ordinary records may use the slots
# kept for safety records. Off unless the canary row builds with it.
ring-reserve-canary = []
# logger.rs's durable queue canaries: the per-CPU queues written one after
# another, not in push order; a full queue dropping what it answered taken; a
# batch dropped from RAM before the write; the busy, spill, wake, rotation-sync
# gap-skip, resnap, rotate-trust and stall-cap canaries (see
# crates/core/actuation/Cargo.toml).
durable-merge-canary = []
durable-full-canary = []
durable-staging-canary = []
durable-busy-canary = []
durable-spill-canary = []
durable-nowake-canary = []
durable-rotate-sync-canary = []
durable-gap-skip-canary = []
durable-resnap-canary = []
durable-rotate-trust-canary = []
durable-stall-cap-canary = []
durable-full-mask-canary = []
# logger.rs's telemetry gate canary: a known value, never enabled here (the canary row is in behavior-tests).
telemetry-ring-canary = []
# estop.rs's unrecorded-release gate canary: a known value, never enabled by default.
estop-unrecorded-canary = []
# estop_line.rs's gate canary: a known value, never enabled by default.
estop-line-dead-ready-canary = []

[dependencies]
azos_common = { path = "../../../crates/core/common" }
azos_ext_api = { path = "../../../crates/core/ext-api" }
# The same host stand-ins behavior-tests pulls `logger.rs` in with: the clock
# and kprintln, the generated limits (a 128-record ring), the sync primitives.
beh_test_drivers = { path = "../behavior-tests/shims/drivers" }
azos_limits = { path = "../behavior-tests/shims/limits", package = "beh_test_limits" }
azos_sync = { path = "../cap-tests/shims/sync", package = "cap_test_sync" }
# Real: the e-stop release authority `estop.rs` verifies signatures with.
azos_crypto = { path = "../../../crates/core/crypto" }
# Test-only signer for the operator's release warrant (`azos_crypto` verifies
# only); the same crate and features behavior-tests signs the e-stop release with.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# Real, a dependency-free leaf: the degrade policy's speed ceilings, which the
# gate's envelope ceilings are pinned to (src/b4.rs).
azos_degrade_policy = { path = "../../../crates/domains/robot/degrade-policy" }
# Real: the receipt of a refusal is one of its records.
azos_records = { path = "../../../crates/core/records" }
# Real: the per-CPU queues the flight recorder keeps its records in.
azos_rings = { path = "../../../crates/core/rings" }
azos_decision = { path = "../../../crates/core/decision", features = ["on", "durable"] }

# Reproduce the kernel's release profile (see behavior-tests).
[profile.release]
overflow-checks = true

[workspace]
