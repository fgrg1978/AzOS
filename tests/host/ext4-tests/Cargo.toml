[package]
name = "azos_ext4_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the read-only ext4 parser (userspace/lib/ext4) and the ring-3 server that serves it (userspace/services/ext4d): images made by the host's mke2fs at test time, feature sets and block sizes, refusals, byte flips over real images, the file protocol's round trip. Excluded from workspace."

# Run with:  cd tests/host/ext4-tests && cargo test --release
# Needs e2fsprogs (`mke2fs`, `e2fsck`) on PATH or as a Homebrew keg; without
# it this suite fails, loudly.

[features]
# Gate canaries (tools/gate/ci_check.sh `host_canary_row`), never in a real
# build; each must turn the named test red.
#   dirent-bound-canary: a directory entry's name length is not checked
#     against NAME_MAX (`corrupt::mangled_images_never_panic`)
#   csum-skip-canary: an inode's checksum is not verified
#     (`refuse::a_flipped_inode_is_refused`)
#   short-read-canary: the server answers half of every read without saying
#     the file ended (`protocol::a_file_reads_whole_through_the_protocol`)
dirent-bound-canary = ["azos_ext4/dirent-bound-canary"]
csum-skip-canary = ["azos_ext4/csum-skip-canary"]
short-read-canary = []
#   badge-slot-canary: an open's badge is its slot, reused across restarts
#     and failed revokes (`protocol::a_badge_from_an_earlier_server_reaches_nothing`)
#   stale-completion-canary: a late block completion is taken for a stray
#     (`protocol::a_late_completion_is_dropped`)
badge-slot-canary = []
stale-completion-canary = []
#   dirent-name-canary: a name that is not one component is listed
#     (`refuse::a_name_that_is_not_one_component_is_refused`)
dirent-name-canary = ["azos_ext4/dirent-name-canary"]
#   escape-canary: a path resolved beneath a directory may leave it
#     (`protocol::a_link_out_of_the_callers_directory_is_refused`)
escape-canary = ["azos_ext4/escape-canary"]
#   seen-resolve-canary: every listed entry is resolved by path, a directory scan each
#     (`protocol::listing_a_directory_costs_steps_linear_in_its_entries`)
#   hole-walk-canary: a hole in a directory is walked one block at a time
#     (`sparse::a_directory_that_claims_the_partition_but_maps_little_ends_in_a_few_steps`)
seen-resolve-canary = []
hole-walk-canary = ["azos_ext4/hole-walk-canary"]

[dependencies]
azos_ext4 = { path = "../../../userspace/lib/ext4" }
# The server's protocol (userspace/services/ext4d/src/service.rs, pulled by
# `#[path]`) and the generated client it is checked against.
azos_abi = { path = "../../../crates/core/abi" }
azos_devif = { path = "../../../crates/core/devif" }
azos_idl = { path = "../../../crates/core/idl" }

[profile.release]
overflow-checks = true

[workspace]
