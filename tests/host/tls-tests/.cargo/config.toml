[build]
target = "host-tuple"

[unstable]
build-std = []
build-std-features = []

# rustls and its provider come from the one crates.io tree the repository
# builds from (third_party/vendor), offline.
[source.crates-io]
replace-with = "azos-vendor"

[source.azos-vendor]
directory = "../../../third_party/vendor"

[net]
offline = true

# The installer's `Work` (a megabyte of buffers and a topology) is built on the
# test thread's stack before it is boxed (tests/host/pkg-tests does the same).
[env]
RUST_MIN_STACK = "67108864"
