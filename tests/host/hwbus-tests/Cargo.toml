[package]
name = "azos_hwbus_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/drivers/hwbus (patterns, match tables, bind policy, the bus lifecycle). Excluded from the workspace like the other *-tests crates."

# Run with:  cd tests/host/hwbus-tests && cargo test
#            cargo test --features policy-canary   (the policy rows must FAIL)
#            cargo test --features leak-canary     (the unbind/rebind rows must FAIL)
#            cargo test --features unbind-canary   (the leaked-unbind row must FAIL)

[dependencies]
azos_hwbus = { path = "../../../crates/drivers/hwbus" }

[features]
# Mirrors azos_hwbus's gate canary so the host rows can show they bite.
policy-canary = ["azos_hwbus/policy-canary"]
unbind-canary = ["azos_hwbus/unbind-canary"]
dt-unknown-peripheral-canary = ["azos_hwbus/dt-unknown-peripheral-canary"]
dt-bare-token-canary = ["azos_hwbus/dt-bare-token-canary"]
dt-fallback-canary = ["azos_hwbus/dt-fallback-canary"]
ports-claim-canary = ["azos_hwbus/ports-claim-canary"]
# The fake virtio-blk record's unbind leaves its interrupt line bound: the
# unbind/rebind rows must FAIL.
leak-canary = []

[profile.release]
overflow-checks = true

[workspace]
