[package]
name = "azos-sched-hostshim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host stand-in for the two azos_sched accessors used by crates/core/ipc/src/{channel,pipe,signal}.rs."

[lib]
name = "azos_sched"
path = "src/lib.rs"

[dependencies]
# `task::MAX_TASKS` for `cap_store.rs` (pulled in with `cap.rs`'s `objref`).
azos_limits = { path = "../../../../../crates/core/limits" }
