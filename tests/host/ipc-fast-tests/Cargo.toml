[package]
name = "azos_ipc_fast_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the per-endpoint fast-call queues in crates/core/ipc/src/ep_queue.rs. Excluded from workspace."

# No dependencies on purpose. `ep_queue.rs` names `azos_sync` and
# `azos_sched`, both RV64-only, but only under `cfg(not(test))`; under
# `cfg(test)` it uses the host substitutes it carries itself. If this list ever
# grows, check that whatever was added is host-buildable.
[dependencies]

[dev-dependencies]

[features]
# `ep_queue.rs`'s call-source canary (`crates/core/ipc/Cargo.toml`): a call
# that finds its queue empty hands back no port link, so
# `a_call_on_an_empty_queue_hands_back_its_call_link` goes red.
port-calls-canary = []
# `ep_queue.rs` `keep_link_for`'s canary: a change of owner always drops the
# call link (a live update's successor loses it; a same-owner grant unbinds).
call-link-drop-canary = []
