[package]
name = "azos_iommu_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/drivers/iommu: encoders against hand-computed spec vectors (RISC-V IOMMU, SMMUv3, VT-d, AMD-Vi, their page tables), the units' bring-up against register models, and the IO domain. Excluded from the workspace like the other *-tests crates."

# Run with:  cd tests/host/iommu-tests && cargo test --release

[dependencies]
azos_iommu = { path = "../../../crates/drivers/iommu" }
azos_dma = { path = "../../../crates/drivers/dma" }
azos_drvkit = { path = "../../../crates/drivers/kit" }

[features]
vtd-window-canary = ["azos_iommu/vtd-window-canary"]
# A ring-3 object recorded as bound without entering its domain
# (`a_device_reaches_its_object_and_no_other_page` goes red).
dma-bind-skip-map-canary = ["azos_dma/dma-bind-skip-map-canary"]
# A domain with a mapping left reads as empty
# (`a_domain_with_a_mapping_left_is_not_handed_to_ring_3` goes red).
domain-empty-canary = ["azos_iommu/domain-empty-canary"]
domain-stale-canary = ["azos_iommu/domain-stale-canary"]
# The kernel's reuse rule and the park, broken (see crates/drivers/dma/Cargo.toml).
ring3-reuse-canary = ["azos_dma/ring3-reuse-canary"]
park-drop-canary = ["azos_dma/park-drop-canary"]

[profile.release]
overflow-checks = true

[workspace]
