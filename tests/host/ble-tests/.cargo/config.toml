[build]
target = "aarch64-apple-darwin"

[unstable]
build-std = []
build-std-features = []

# p256 is not in the kernel workspace's lockfile: it comes from the vendored crates.io tree
# (third_party/VENDOR_PIN), offline.
[net]
offline = true

[source.crates-io]
replace-with = "azos-vendor"

[source.azos-vendor]
directory = "../../../third_party/vendor"
