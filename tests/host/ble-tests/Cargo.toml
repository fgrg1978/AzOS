[package]
name = "azos_ble_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the BLE host stack (userspace/lib/ble) over a scripted controller: H4 framing across chunk boundaries and after garbage, the HCI codec, the host's initialisation, command and ACL flow control, advertising, scanning and connection in both roles, L2CAP fragmentation and reassembly, the signalling channel, the ATT PDUs and the MTU exchange, and SMP LE Secure Connections between two hosts (same LTK on both sides, a tampered confirm or check refused, numeric comparison). This suite is the in-tree user of the library until ble-gatt lands. Excluded from workspace."

[features]
canary-no-confirm-check = ["azos_ble/canary-no-confirm-check"]
canary-no-dhkey-check = ["azos_ble/canary-no-dhkey-check"]
canary-allow-reflected-key = ["azos_ble/canary-allow-reflected-key"]

# Run with:  cd tests/host/ble-tests && cargo test --release
# Resolves crates.io through ../../../third_party/vendor (.cargo/config.toml): offline, locked.

[dependencies]
azos_ble = { path = "../../../userspace/lib/ble" }
azos_devif = { path = "../../../crates/core/devif" }

[profile.release]
overflow-checks = true

[workspace]
