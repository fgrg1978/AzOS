[package]
name = "azos_scsi_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for azos_scsi: the initiator (CDB builders, INQUIRY / READ CAPACITY / sense parsers, CBW encode, CSW parse) against the target (the gadget's decoder and executor), so the two ends cannot drift apart. Excluded from the workspace like the other *-tests crates."

# Run with:  cd tests/host/scsi-tests && CARGO_TARGET_DIR=~/azos-out/scsi-tests cargo test --release

[dependencies]
azos_scsi = { path = "../../../crates/drivers/scsi" }

[workspace]
