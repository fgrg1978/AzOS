[package]
name = "topology_seed_test_drivers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host stand-in for the driver class crates (azos_drv_*), used only by tests/host/topology-tests' P1 cap-seed bridge suite. NOT part of the kernel."

[dependencies]
# platform.rs reads Kconfig TIMER_FREQ through azos_limits (2026-09-26)
azos_limits = { path = "../../../../../crates/core/limits" }
# Real, pure, host-buildable, zero deps of its own -- `platform.rs` (pulled
# below) reads `azos_abi::vdso::{VDSO_USER_BASE, ...}` in its per-board
# `const` asserts (2026-09-22 vDSO placement fix).
azos_abi = { path = "../../../../../crates/core/abi" }

# `pwm_domain.rs` is pulled in with `#[path]` and is split by a `vf2` cfg the
# real drivers crate declares. Echoed here so the pulled module does not emit
# `unexpected_cfgs` — DECLARED rather than silenced, so the condition stays
# visible. Same reason, same shape, as `tests/host/drivers-tests`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("vf2", "k1"))'] }
