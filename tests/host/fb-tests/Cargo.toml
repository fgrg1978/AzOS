[package]
name = "azos_fb_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for crates/drivers/fb: font rendering, pixel packing, scroll and dirty-rect math, the console grid and the panic screen over a Vec-backed surface. Excluded from workspace."

# Run with:  cd tests/host/fb-tests && cargo test --release

[dependencies]
azos_fb = { path = "../../../crates/drivers/fb", features = ["console", "panic-screen"] }
azos_limits = { path = "../../../crates/core/limits" }
azos_devif = { path = "../../../crates/core/devif" }

[profile.release]
overflow-checks = true
