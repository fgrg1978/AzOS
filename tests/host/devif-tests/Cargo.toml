[package]
name = "azos_devif_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for azos_devif: the registry of kernel-hosted interfaces (keys, ids, topology targets) and the wire form of an op's answer. Excluded from workspace."

# Run with:  cd tests/host/devif-tests && cargo test --release

[dependencies]
azos_devif = { path = "../../../crates/core/devif" }
azos_idl = { path = "../../../crates/core/idl" }

[profile.release]
overflow-checks = true

[workspace]
