[package]
name = "azos_pkg_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for signed application packages (crates/core/pkg): the container, the metadata, verification against the signers of a signed topology, admission as a topology delta (neverallow included) and the install receipt, plus a package built and signed by tools/azpkg.py. Excluded from workspace."

# Run with:  cd tests/host/pkg-tests && cargo test --offline
#
# The canaries each skip one check of the crate; exactly the tests that
# expect that refusal go red:
#   cargo test --offline --features pkg-verify-skip-canary
#   cargo test --offline --features pkg-signer-canary
#   cargo test --offline --features pkg-image-canary
#   cargo test --offline --features pkg-import-canary
#   cargo test --offline --features neverallow-canary

[features]
default = ["dev-key"]
dev-key = ["azos_topology/dev-key"]
pkg-verify-skip-canary = ["azos_pkg/pkg-verify-skip-canary"]
pkg-signer-canary = ["azos_pkg/pkg-signer-canary"]
pkg-image-canary = ["azos_pkg/pkg-image-canary"]
pkg-import-canary = ["azos_pkg/pkg-import-canary"]
neverallow-canary = ["azos_topology/neverallow-canary"]
# The drivetrain exists: a motor grant parses and the rules refuse it.
profile-actuation = ["azos_topology/profile-actuation"]

[dependencies]
azos_pkg = { path = "../../../crates/core/pkg" }
azos_topology = { path = "../../../crates/core/topology" }
azos_crypto = { path = "../../../crates/core/crypto" }
azos_abi = { path = "../../../crates/core/abi" }
azos_limits = { path = "../../../crates/core/limits" }
azos_decision = { path = "../../../crates/core/decision", features = ["durable"] }
azos_packages = { path = "../../../userspace/lib/packages", features = ["service"] }
azos_idl = { path = "../../../crates/core/idl" }

[dev-dependencies]
# Signs the packages the tests build (the crate the device verifies with).
ed25519-dalek = { version = "2", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }

[profile.release]
overflow-checks = true

[workspace]
