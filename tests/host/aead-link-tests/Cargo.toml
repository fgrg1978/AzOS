[package]
name = "azos_aead_link_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests of the brain link's Noise secure channel (crates/core/crypto::secure_channel). Pins the wire bytes AzOSRobotBrain/secure_channel.py must reproduce. Excluded from workspace."

# Run with:
#   cd tests/host/aead-link-tests && cargo +stable test --release -- --nocapture
#
# Pinned to stable via rust-toolchain.toml.

[features]
# K-C5. Rebuild the suite with the enforced link policy compiled in, so both
# halves of the gate get exercised:
#
#   cargo test --release                      # policy OFF
#   cargo test --release --features enforced   # policy ON
#
# `tests/link_policy.rs` asserts the value of
# `azos_crypto::secure_channel::link_provisioning_enforced()` in BOTH states: the
# guard against a renamed or mis-forwarded feature quietly disarming the gate.
enforced = ["azos_crypto/link-provisioning-enforced"]

[dependencies]
azos_crypto = { path = "../../../crates/core/crypto" }
