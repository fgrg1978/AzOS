[package]
name = "azos_stdrt_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for azos_stdrt, the std port layer of the native SDK: the entropy call against the generated Entropy dispatcher, and the trap wrappers against libsys's. The modules that issue a trap are covered from ring 3 (userspace/tests/sdktest). Excluded from workspace."

# Run with:  cd tests/host/stdrt-tests && cargo test --release

[dependencies]
azos_stdrt = { path = "../../../crates/core/stdrt" }
azos_abi = { path = "../../../crates/core/abi" }
azos_devif = { path = "../../../crates/core/devif" }
azos_idl = { path = "../../../crates/core/idl" }

[profile.release]
overflow-checks = true

[workspace]
