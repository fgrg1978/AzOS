[package]
name = "azos_micro_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for micro/: the PMP encodings, domains, grants, capability table, ceilings and dispatch, and the micro kernel itself driven over a fake machine with the topology the micro image ships and the ABI cases it shares with the main kernel's captest. Excluded from the kernel workspace."

# Its own workspace root (see sync-tests).
[workspace]

[dependencies]
azos_micro = { path = "../../../micro" }
azos_abi = { path = "../../../crates/core/abi" }
azos_topology = { path = "../../../crates/core/topology", features = ["dev-key"] }
azos_limits = { path = "../../../crates/core/limits" }
