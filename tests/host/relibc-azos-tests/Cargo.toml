[package]
name = "azos_relibc_tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false
description = "Host-side tests for the pure helpers of the relibc platform layer (userspace/lib/relibc-azos): paths, wait status, directory records, spawn blobs, the futex timeout. The calls themselves need a boot. Excluded from workspace."

# Run with:  cd tests/host/relibc-azos-tests && cargo test --release

[dependencies]
azos_abi = { path = "../../../crates/core/abi" }

[profile.release]
overflow-checks = true

# Standalone, like every host-test crate (see the root Cargo.toml exclude list).
[workspace]
