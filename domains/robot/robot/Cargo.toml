[package]
name = "azos_robot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR GPL-2.0-only"
publish = false

[dependencies]
azos_drv_sys      = { workspace = true }
azos_drv_gpio     = { workspace = true }
azos_drv_actuator = { workspace = true }
azos_sync = { workspace = true }
azos_common = { workspace = true }
azos_channel = { workspace = true }

# Never enabled by the kernel build (nothing in `kernel/Cargo.toml`'s feature
# graph turns it on). Exists so a host test crate that pulls `motor.rs` in
# with `#[path]` — instead of building this crate itself under `cargo test`
# — can still reach the two `#[cfg(any(test, feature = "test-util"))]`
# test-only accessors: `cfg(test)` alone is true only for the crate `cargo
# test` directly targets, which such a pulled-in copy never is. See
# `tests/host/behavior-tests/shims/robot` and `tests/host/syscall-tests/shims/robot`.
[features]
test-util = []
