# The repository-root .cargo/config.toml forces a riscv64 bare-metal target
# and build-std. Cargo merges configs from parent directories, so override
# both here to build and test on the host (same as tests/host/pci-tests).
[build]
target = "aarch64-apple-darwin"

[unstable]
build-std = []
build-std-features = []
